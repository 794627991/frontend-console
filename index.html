    const j = await r.json();
    if (!j.ok) return;
    // 状态点：有 backend_url 即后端在跑（MCP server 能否连上由最近调用推断）
    const dot = $('mcpStatusDot'), txt = $('mcpStatusText');
    if (j.backend_url) { dot.className = 'dot on'; txt.textContent = 'MCP 后端运行中'; }
    else { dot.className = 'dot'; txt.textContent = 'MCP 后端未运行'; }
    $('mcpBackendUrl').textContent = j.backend_url || '—（endpoint.json 未找到）';
    // 脏检查：工具列表内容没变就跳过 innerHTML 重建（5s 一次全量重建会叠加重排/ GC，输入时感知卡顿）
    const tools = j.tools || [];
    const toolsKey = tools.map(t => t.name).join(',');
    if (toolsKey !== _mcpToolsKey) {
      _mcpToolsKey = toolsKey;
      $('mcpTools').innerHTML = tools.length ? tools.map(t =>
        `<div class="mcp-tool"><span class="tname">${esc(t.name)}</span><span class="tdesc">${esc(t.desc)}</span></div>`).join('') : '<div class="mcp-empty">—</div>';
    }
    // 最近调用
    const calls = j.recent_calls || [];
    const callsEl = $('mcpCalls');
    // key 用最后一条的 ts+tool+args+总数：秒精度 ts 同秒两次调用 + 封顶 20 条后 len 不变都会撞 key
    const last = calls[calls.length - 1];
    const callsKey = last ? `${last.ts}|${last.tool}|${last.args}|${calls.length}` : '0';
    if (callsKey === _mcpCallsKey) return;  // 无新调用，跳过重建
    _mcpCallsKey = callsKey;
    if (!calls.length) { callsEl.innerHTML = '<div class="mcp-empty">暂无调用记录（Claude Code 调用 MCP 工具后会显示）</div>'; return; }
    callsEl.innerHTML = calls.slice(-20).reverse().map(c => {
      const d = new Date(c.ts * 1000);
      const ts = d.toTimeString().slice(0, 8);
      return `<div class="mcp-call ${c.ok ? 'ok' : 'fail'}"><span class="ctime">${ts}</span><span class="ctool">${esc(c.tool)}</span> <span class="cargs">${esc(c.args || '')}</span></div>`;
    }).join('');
  } catch(e) {}
}
let _mcpToolsKey = '', _mcpCallsKey = '';
function kwClassOf(text) {
  const t = text.toLowerCase();
  if (/\b(error|fail|panic|fatal|denied|refused|abort|crash|oom|killed)\b/.test(t)) return 'kw-error';
  if (/\b(warn|warning|deprecated|timeout|retry|overflow)\b/.test(t)) return 'kw-warning';
  if (/\b(info|notice|starting|started|stopped|detected|ready)\b/.test(t)) return 'kw-info';
  return '';
}
function renderSense() {
  const list = $('senseList');

  const ports = ['ALL', ...new Set(senseState.lines.map(l => l.port))];

    `<span class="chip ${p === filter ? 'active' : ''}" data-port="${esc(p)}">${esc(p === 'ALL' ? '全部' : p)}</span>`
  ).join('');
  filterEl.querySelectorAll('.chip').forEach(c => c.onclick = () => { senseState.filter = c.dataset.port; renderSense(); });
  // 行
  let shown = senseState.lines;
  if (filter !== 'ALL') shown = shown.filter(l => l.port === filter);
  const recent = shown.slice(-50);
  list.innerHTML = recent.map(it => {
    const kc = kwClassOf(it.text || '');
    return `<div class="sense-line ${kc}" data-port="${esc(it.port)}"><span class="port-tag">[${esc(it.port)}]</span>${esc((it.text || '').slice(0, 200))}</div>`;
  }).join('');
  list.scrollTop = list.scrollHeight;

// ---- 分析标签 ----
// 4 类关键字正则
const ANALYZE_RE = {
  error:   /\b(error|fail|panic|fatal|denied|refused|abort|crash|oom|killed|segmentation fault|kernel panic|out of memory|call trace|page fault)\b/i,
  warning: /\b(warn|warning|deprecated|timeout|retry|overflow|hung|deadlock|corrupt|not found|not supported|invalid)\b/i,
  info:    /\b(info|notice|starting|started|stopped|detected|ready|linux version|systemd|mounting|booting|link is up|link is down)\b/i,
  success: /\b(success|succeed|succeeded|ok|done|complete|completed|passed)\b/i,
};
const ANALYZE_LABEL = { error: 'ERROR', warning: 'WARNING', info: 'INFO', success: 'SUCCESS' };

// 点击条目 → 跳到主终端对应行并高亮
// searchText 优先：在当前 buffer 重新搜索定位，避免行号因 reflow/resize 漂移导致跳错
function jumpToLine(rowIdx, searchText) {
  if (!activePortId) return;
  const conn = connections[activePortId];
  if (!conn || !conn.term) return;
  try {
    const buf = conn.term.buffer.active;
    let target = rowIdx;
    // 用文本重搜：行号可能因 reflow/resize/新数据流入而漂移，按内容定位最可靠
    if (searchText) {
      const needle = searchText.trim();
      const pref = needle.slice(0, Math.min(40, needle.length));
      // 从 rowIdx 起向上找最近的匹配行（漂移通常是小幅度，原行就在附近）
      // 若向上没找到，再从 rowIdx 向下找
      let found = -1;
      const match = (t) => t === needle || (t && pref && t.startsWith(pref));
      for (let r = Math.min(rowIdx, buf.length - 1); r >= 0; r--) {
        const ln = buf.getLine(r);
        if (!ln) continue;
        if (match(ln.translateToString(true).trim())) { found = r; break; }
      }
      if (found < 0) {
        for (let r = rowIdx + 1; r < buf.length; r++) {
          const ln = buf.getLine(r);
          if (!ln) continue;
          if (match(ln.translateToString(true).trim())) { found = r; break; }
        }
      }
      if (found >= 0) target = found;
    }
    // 边界保护
    target = Math.max(0, Math.min(target, buf.length - 1));
    // scrollToLine 把目标行滚到视图顶部
    conn.term.scrollToLine(target);
    conn.term.focus();
    // select 选中整行（蓝底高亮，xterm 内置最稳定）
    conn.term.select(0, target, conn.term.cols);
    // registerDecoration 加醒目背景（6 位 hex，不带 alpha）
    if (conn.term.registerDecoration) {
      const offset = Math.round(target - buf.ybase - buf.y);
      const dec = conn.term.registerDecoration({
        marker: conn.term.registerMarker(offset),
        x: 0,
        width: conn.term.cols,
        backgroundColor: '#00d4ff',
        layer: 'top',
      });
      if (dec) setTimeout(() => { try { dec.dispose(); } catch(e){} }, 2500);
    }
  } catch(e) {}
}

// 点击统计卡片 → 在下方列表显示该类别最近条目
function showAnalyzeList(kw) {
  if (!activePortId) return;
  const conn = connections[activePortId];
  if (!conn || !conn.term) return;
  const re = ANALYZE_RE[kw];
  if (!re) return;
  const buf = conn.term.buffer.active;
  const items = [];
  for (let r = 0; r < buf.length; r++) {
    const ln = buf.getLine(r);
    if (!ln) continue;
    const t = ln.translateToString(true);
    if (re.test(t)) items.push({ row: r, text: t.trim().slice(0, 100) });
  }
  $('analyzeListTitle').textContent = `最近 ${ANALYZE_LABEL[kw]}（${items.length} 条）`;
  const cl = $('clusterList');
  if (!items.length) {
    cl.innerHTML = `<div class="cmd-empty">无 ${ANALYZE_LABEL[kw]} 条目</div>`;
    return;
  }
  // 最近的在前（取最后 30 条倒序）
  const recent = items.slice(-30).reverse();
  cl.innerHTML = recent.map((it, i) =>
    `<div class="cluster-item" data-idx="${i}" title="${esc(it.text)}">${esc(it.text)}</div>`
  ).join('');
  // 点击条目 → 跳到对应行并选中高亮
  cl.querySelectorAll('.cluster-item').forEach((el, i) => {
    el.onclick = () => jumpToLine(recent[i].row, recent[i].text);
  });
}

function renderAnalyze() {
  if (!activePortId) { $('statCards').innerHTML = '<div class="cmd-empty">无活动连接</div>'; return; }
  const conn = connections[activePortId];
  if (!conn || !conn.term) return;
  // 统计已加载行（从 xterm buffer 读取）
  const lines = [];
  const buf = conn.term.buffer.active;
  for (let r = 0; r < buf.length; r++) {
    const ln = buf.getLine(r);
    if (ln) lines.push(ln.translateToString(true));
  }
  let err = 0, warn = 0, info = 0, ok = 0;
  for (const t of lines) {
    const low = t.toLowerCase();
    if (ANALYZE_RE.error.test(low)) err++;
    if (ANALYZE_RE.warning.test(low)) warn++;
    if (ANALYZE_RE.info.test(low)) info++;
    if (ANALYZE_RE.success.test(low)) ok++;
  }
  $('statCards').innerHTML = `
    <div class="stat-card err" data-kw="error" style="cursor:pointer" title="点击查看最近 ERROR 条目">
      <div class="label">ERROR</div><div class="value">${err}</div></div>
    <div class="stat-card warn" data-kw="warning" style="cursor:pointer" title="点击查看最近 WARNING 条目">
      <div class="label">WARNING</div><div class="value">${warn}</div></div>
    <div class="stat-card info" data-kw="info" style="cursor:pointer" title="点击查看最近 INFO 条目">
      <div class="label">INFO</div><div class="value">${info}</div></div>
    <div class="stat-card ok" data-kw="success" style="cursor:pointer" title="点击查看最近 SUCCESS 条目">
      <div class="label">SUCCESS</div><div class="value">${ok}</div></div>
  `;
  // 点击统计卡片 → 下方列表显示该类别最近条目（不弹 banner）
  $('statCards').querySelectorAll('.stat-card').forEach(card => {
    card.onclick = () => showAnalyzeList(card.dataset.kw);
  });
}

// 命令库：后端持久化（~/.serialconsole_pro/cmdlib.json），跨端口/重启保留
// 内存缓存避免每次渲染都异步拉取
let _cmdLibCache = null;
async function loadCmdLib() {
  if (_cmdLibCache) return _cmdLibCache;
  try {
    const r = await fetch('/api/cmd_lib');
    const j = await r.json();
    _cmdLibCache = j.lib || [];
  } catch (e) { _cmdLibCache = []; }
  return _cmdLibCache;
}
async function saveCmdLib(lib) {
  _cmdLibCache = lib;
  try {
    await fetch('/api/cmd_lib', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lib })
    });
  } catch (e) {}
}
async function renderCmdPane() {
  // 命令库
  const lib = await loadCmdLib();
  const libEl = $('cmdLibrary');
  if (!lib.length) {
    libEl.innerHTML = '<div class="cmd-empty">点击上方添加常用命令（支持备注名）</div>';
  } else {
    libEl.innerHTML = lib.map((c, i) => {
      const showName = c.name && c.name.trim();
      const title = (showName ? `【${esc(c.name)}】\n` : '') + esc(c.cmd);
      // 名称/命令都可点击编辑（弹出模态框）；命令内容只读展示
      return `<div class="cmd-item" title="${title}">

          ${showName ? `<span class="name">${esc(c.name)}</span><span class="cmd-sub">${esc(c.cmd)}</span>` : `<span class="cmd-no-name">＋ 备注</span><span class="cmd-sub">${esc(c.cmd)}</span>`}
        </span>
        <button class="run" data-i="${i}">发送</button>
        <button class="edit" data-i="${i}" title="编辑">✎</button>
        <button class="del" data-i="${i}" title="删除">✕</button>

    }).join('');
    libEl.querySelectorAll('.run').forEach(b => b.onclick = () => runCmdFromLib(parseInt(b.dataset.i)));
    libEl.querySelectorAll('.del').forEach(b => b.onclick = async () => {
      const lib2 = await loadCmdLib(); lib2.splice(parseInt(b.dataset.i), 1); await saveCmdLib(lib2); renderCmdPane();
    });
    // 点击名称区或编辑按钮 → 弹出编辑模态框（名称+命令都可改）
    const openEdit = async (i) => {
      const lib2 = await loadCmdLib();

      openCmdEditModal(i, lib2[i].name || '', lib2[i].cmd);
    };
    libEl.querySelectorAll('.cmd-edit-trigger').forEach(el => el.onclick = () => openEdit(parseInt(el.dataset.i)));
    libEl.querySelectorAll('.edit').forEach(b => b.onclick = () => openEdit(parseInt(b.dataset.i)));

  // 最近命令
  if (activePortId) {
    fetch('/api/history?port_id=' + encodeURIComponent(activePortId))
      .then(r => r.json()).then(j => {

        rec.innerHTML = hist.slice(-15).reverse().map(c =>
          `<div class="cmd-item"><span class="text" title="${esc(c)}">${esc(c)}</span><button class="run" data-cmd="${esc(c)}">重发</button></div>`
        ).join('');
        rec.querySelectorAll('.run').forEach(b => b.onclick = () => sendCmd(b.dataset.cmd));
      }).catch(() => {});

    $('cmdRecent').innerHTML = '<div class="cmd-empty">无活动连接</div>';

}

// 日志查看 tab（G 级虚拟列表 + 底部查找分栏）
// ============================================================
// 复用 connections[port_id] 模型，kind='log'。每个日志 tab 独立 logState（替代旧全局 histState）。
// 虚拟列表算法不变：inner 钳制 MAX_SCROLL_H 突破 Chrome 33.5M 上限，viewport 跟随 scrollTop 平移。
const HIST_ROW_H = 18;
const HIST_BUF = 10;
const HIST_PAGE = 200;
const HIST_CACHE_MAX = 5000;
const MAX_SCROLL_H = 10000000;

// 拖拽日志文件到窗口任意位置打开（含超大文件，走 G 级虚拟列表）
let _dragOverlay = null;
let _dragCounter = 0;
function showDragOverlay(show) {
  if (show && !_dragOverlay) {
    _dragOverlay = document.createElement('div');
    _dragOverlay.id = 'dragOverlay';
    _dragOverlay.textContent = '📄 松开以打开日志';
    document.body.appendChild(_dragOverlay);
  } else if (!show && _dragOverlay) {
    _dragOverlay.remove(); _dragOverlay = null;
  }
}
document.body.addEventListener('dragenter', e => {
  e.preventDefault();
  if (e.dataTransfer && e.dataTransfer.types && e.dataTransfer.types.includes('Files')) {
    _dragCounter++; showDragOverlay(true);
  }
});
document.body.addEventListener('dragover', e => { e.preventDefault(); });
document.body.addEventListener('dragleave', e => {
  e.preventDefault();
  _dragCounter--;
  if (_dragCounter <= 0) { _dragCounter = 0; showDragOverlay(false); }
});
// drop 事件由 pywebview 原生处理（main.py 注册，能拿到 File.pywebviewFullPath 绝对路径），
// 回调里 evaluate_js 调 buildLogViewer。这里仅 preventDefault（阻止 WebView2 导航到文件）
// 并隐藏遮罩——preventDefault 不影响 pywebview 的 drop_handler 触发。
document.body.addEventListener('drop', e => {
  e.preventDefault();
  _dragCounter = 0; showDragOverlay(false);
});

// 打开日志：建索引 + 初始化虚拟列表
async function openLogInViewer(conn) {
  const ls = conn.logState;
  ls.rows = new Map();
  ls.renderedStart = -1; ls.renderedEnd = -1;
  ls.searchQ = ''; ls.searchResults = []; ls.searchIdx = 0;
  conn.searchInput.value = '';
  conn.vlist.scrollTop = 0;
  conn.statusEl.textContent = '正在索引…';
  try {
    const r = await fetch('/api/log_count?name=' + encodeURIComponent(ls.name));
    const j = await r.json();
    // 索引期间用户可能已关闭此日志 tab 或切到别的 tab，校验当前 conn 仍存活
    if (connections[conn.portId] !== conn) return;
    if (!j.ok) { conn.statusEl.textContent = '错误：' + (j.err || ''); return; }
    ls.total = j.total;
    const naturalH = ls.total * HIST_ROW_H;
    ls.scaled = naturalH > MAX_SCROLL_H;
    conn.vlistInner.innerHTML = '';
    conn.vlistInner.style.height = Math.min(naturalH, MAX_SCROLL_H) + 'px';
    conn.statusEl.textContent = `共 ${ls.total.toLocaleString()} 行` + (ls.scaled ? ' · 缩放模式' : '');
    renderLogSlice(conn);
    syncOpenLogs();  // 索引完成，带 total 再同步一次
  } catch(e) { if (connections[conn.portId] === conn) conn.statusEl.textContent = '加载失败：' + e; }
}

// scrollTop → 行号（缩放末页可达映射）
function logScrollToRow(conn, scrollTop) {
  const ls = conn.logState;
  if (!ls.scaled) return Math.floor(scrollTop / HIST_ROW_H);
  const innerH = Math.min(ls.total * HIST_ROW_H, MAX_SCROLL_H);
  const viewH = conn.vlist.clientHeight;
  const maxScroll = innerH - viewH;
  const maxRow = Math.max(0, ls.total - Math.ceil(viewH / HIST_ROW_H));
  if (maxScroll <= 0) return 0;
  return Math.min(maxRow, Math.floor(scrollTop / maxScroll * maxRow));
}
// 行号 → scrollTop
function logRowToScroll(conn, row) {
  const ls = conn.logState;
  if (!ls.scaled) return row * HIST_ROW_H;
  const innerH = Math.min(ls.total * HIST_ROW_H, MAX_SCROLL_H);
  const viewH = conn.vlist.clientHeight;
  const maxScroll = innerH - viewH;
  const maxRow = Math.max(0, ls.total - Math.ceil(viewH / HIST_ROW_H));
  if (maxRow <= 0) return 0;
  return Math.floor(row / maxRow * maxScroll);
}

// 确保区间已加载
async function ensureLogRange(conn, start, end) {
  const ls = conn.logState;
  start = Math.max(0, start); end = Math.min(ls.total, end);
  const missing = [];
  let i = start;
  while (i < end) {
    if (ls.rows.has(i)) { i++; continue; }
    let j = i;
    while (j < end && !ls.rows.has(j)) j++;
    missing.push([i, j]); i = j;
  }
  const fetches = [];
  for (const [s, e] of missing) {
    for (let k = s; k < e; k += HIST_PAGE) {
      const off = k, lim = Math.min(HIST_PAGE, e - k);
      fetches.push(
        fetch('/api/log_page?name=' + encodeURIComponent(ls.name) + '&offset=' + off + '&limit=' + lim)
          .then(r => r.json()).then(j => {
            if (j.ok) (j.lines || []).forEach((l, idx) => ls.rows.set(off + idx, l));
          }).catch(() => {})
      );
    }
  }
  if (fetches.length) await Promise.all(fetches);
}

// 渲染可视区切片
async function renderLogSlice(conn) {
  const ls = conn.logState;
  if (!ls.name || !ls.total) return;
  const vlist = conn.vlist, inner = conn.vlistInner;
  const scrollTop = vlist.scrollTop;
  const viewH = vlist.clientHeight;
  const startRow = Math.max(0, logScrollToRow(conn, scrollTop));
  const viewportRows = Math.ceil(viewH / HIST_ROW_H);
  const renderStart = startRow;
  const endRow = Math.min(ls.total, startRow + viewportRows + HIST_BUF);
  if (renderStart === ls.renderedStart && endRow === ls.renderedEnd) return;
  const mySeq = ++ls.renderSeq;
  await ensureLogRange(conn, renderStart, endRow);
  if (mySeq !== ls.renderSeq) return;
  let vp = inner.querySelector('.vlist-viewport');
  if (!vp) { vp = document.createElement('div'); vp.className = 'vlist-viewport'; inner.appendChild(vp); }
  vp.style.top = scrollTop + 'px';
  let html = '';
  for (let r = renderStart; r < endRow; r++) {
    const l = ls.rows.get(r);
    if (!l) continue;
    const top = (r - renderStart) * HIST_ROW_H;
    const kc = l.tag === 'error' ? 'kw-error' : l.tag === 'warning' ? 'kw-warning' : (l.tag === 'info' || l.tag === 'comment') ? 'kw-info' : '';
    const text = esc(l.text || '');
    // 工具日志自带时间戳（外部纯文本 ts=0 不显示）
    const tsHtml = l.ts ? `<span class="hts">${fmtTs(l.ts)}</span>` : '';
    html += `<div class="hline ${kc}" style="top:${top}px" data-row="${r}" title="${text}"><span class="hrow">${r}</span>${tsHtml}<span class="htag">${esc(l.tag||'')}</span>${text}</div>`;
  }
  vp.innerHTML = html;
  ls.renderedStart = renderStart; ls.renderedEnd = endRow;
  if (ls.rows.size > HIST_CACHE_MAX) {
    const keepFrom = renderStart - HIST_CACHE_MAX / 2, keepTo = endRow + HIST_CACHE_MAX / 2;
    for (const k of ls.rows.keys()) { if (k < keepFrom || k > keepTo) ls.rows.delete(k); }
  }
  conn.statusEl.textContent = `共 ${ls.total.toLocaleString()} 行 · 显示 ${renderStart}-${endRow-1}` + (ls.scaled ? ' · 缩放' : '');
}

// 跳到日志某行（居中）
function jumpToLogRow(conn, row) {
  const ls = conn.logState;
  const innerH = Math.min(ls.total * HIST_ROW_H, MAX_SCROLL_H);
  const viewH = conn.vlist.clientHeight;
  const viewportRows = Math.ceil(viewH / HIST_ROW_H);
  const startRow = Math.max(0, Math.min(ls.total - viewportRows, row - Math.floor(viewportRows / 2)));
  conn.vlist.scrollTop = Math.max(0, Math.min(innerH - viewH, logRowToScroll(conn, startRow)));
  ls.renderedStart = -1; ls.renderedEnd = -1;
  renderLogSlice(conn);
}

// 查找全部 → 底部分栏列命中行
async function doLogSearch(conn) {
  const q = conn.searchInput.value.trim();
  const ls = conn.logState;
  if (!q || !ls.name) return;
  // 已有结果且查询未变 → 跳转下一个
  if (ls.searchResults.length && ls.searchQ === q) {
    ls.searchIdx = (ls.searchIdx + 1) % ls.searchResults.length;
    jumpToLogRow(conn, ls.searchResults[ls.searchIdx]);
    highlightLogSearchResult(conn, ls.searchIdx);
    return;
  }
  toggleLogSearchPane(conn, true);
  conn.searchCount.textContent = '搜索中…';
  try {
    const r = await fetch('/api/log_search?name=' + encodeURIComponent(ls.name) + '&q=' + encodeURIComponent(q) + '&limit=500');
    const j = await r.json();
    if (!j.ok) { conn.searchCount.textContent = '失败：' + (j.err || ''); return; }
    ls.searchResults = (j.lines || []).map(l => l.row);
    ls.searchQ = q; ls.searchIdx = 0;
    // 渲染命中行列表
    conn.searchResults.innerHTML = (j.lines || []).map((l, idx) => {
      const kc = l.tag === 'error' ? 'kw-error' : l.tag === 'warning' ? 'kw-warning' : (l.tag === 'info' || l.tag === 'comment') ? 'kw-info' : '';
      const text = esc(l.text || '');
      const tsHtml = l.ts ? `<span class="hts">${fmtTs(l.ts)}</span>` : '';
      return `<div class="hline ${kc}" data-row="${l.row}" data-idx="${idx}" title="${text}"><span class="hrow">${l.row}</span>${tsHtml}<span class="htag">${esc(l.tag||'')}</span>${text}</div>`;
    }).join('');
    conn.searchResults.querySelectorAll('.hline').forEach(el => {
      el.onclick = () => {
        const idx = +el.dataset.idx;
        ls.searchIdx = idx;
        jumpToLogRow(conn, +el.dataset.row);
        highlightLogSearchResult(conn, idx);
      };
    });
    conn.searchCount.textContent = `命中 ${ls.searchResults.length} 处`;
    if (ls.searchResults.length) { jumpToLogRow(conn, ls.searchResults[0]); highlightLogSearchResult(conn, 0); }
  } catch(e) { conn.searchCount.textContent = '失败：' + e; }
}
function highlightLogSearchResult(conn, idx) {
  conn.searchResults.querySelectorAll('.hline').forEach((el, i) => el.classList.toggle('active', i === idx));
}
function toggleLogSearchPane(conn, show) {
  conn.searchPane.style.display = show ? 'flex' : 'none';
  conn.wrap.querySelector('.log-search-splitter').style.display = show ? 'block' : 'none';
  // 折叠按钮提示随状态变（▾ 折叠 / ▴ 展开）
  const collapseBtn = conn.wrap.querySelector('.log-search-collapse');
  if (collapseBtn) collapseBtn.textContent = show ? '▾' : '▴';
  if (show) { conn.searchInput.focus(); }
}

// 拖分隔条调分栏高度
function initLogSplitter(conn) {
  const splitter = conn.wrap.querySelector('.log-search-splitter');
  const pane = conn.searchPane;
  const top = conn.wrap.querySelector('.log-viewer-top');
  let dragging = false, startY = 0, startH = 0;
  splitter.addEventListener('mousedown', e => {
    dragging = true; startY = e.clientY; startH = pane.offsetHeight;
    document.body.style.cursor = 'row-resize'; e.preventDefault();
  });
  // 存到 conn 以便 closeLogViewer 移除，避免 document 级监听器泄漏
  conn._splitMove = e => {
    if (!dragging) return;
    const dh = e.clientY - startY;
    const newH = Math.max(60, Math.min(startH - dh, conn.wrap.clientHeight - 100));
    pane.style.height = newH + 'px';
    top.style.flex = '1';
  };
  conn._splitUp = () => {
    if (dragging) { dragging = false; document.body.style.cursor = ''; renderLogSlice(conn); }
  };
  document.addEventListener('mousemove', conn._splitMove);
  document.addEventListener('mouseup', conn._splitUp);
}

// 关闭日志 tab
function closeLogViewer(portId) {
  const conn = connections[portId];
  if (conn) {
    // 移除 document 级拖拽监听器，避免泄漏
    if (conn._splitMove) document.removeEventListener('mousemove', conn._splitMove);
    if (conn._splitUp) document.removeEventListener('mouseup', conn._splitUp);
    conn.tab.remove(); conn.wrap.remove(); delete connections[portId];
  }
  const remaining = Object.keys(connections).sort(sortKeyFn);
  if (remaining.length) switchTab(remaining[0]);
  else {
    activePortId = null;
    termArea.innerHTML = '<div class="empty-state"><div class="big-icon">📡</div><div class="title">暂无连接</div><div class="desc">点击顶部「新建连接」选择串口或 SSH，支持同时监控多个连接。每个连接独立标签页，互不干扰。</div></div>';
  }
  refreshSidebar();
  refreshGlobalStatus();
  syncOpenLogs();  // 通知后端此日志已关闭
}

// ============================================================
// ============================================================
// TFTP 面板（侧边栏底部）
// ============================================================
let _tftpRunning = false;
let _tftpTransfersKey = '';  // 传输区脏检查 key（含进度，进行中每秒变）
let _tftpFilesKey = '';      // 文件区脏检查 key（只在文件集变化时变）
let _tftpActive = false;     // 有进行中传输（轮询频率切换，不查 DOM）
function _fmtSize(n) {
  if (n == null) return '';
  if (n >= 1048576) return (n / 1048576).toFixed(1) + 'MB';
  if (n >= 1024) return (n / 1024).toFixed(1) + 'KB';
  return n + 'B';
}
async function refreshTftp() {
  try {
    const r = await fetch('/api/tftp/status');
    const j = await r.json();
    if (!j.ok) return;
    _tftpRunning = j.running;
    const tg = $('tftpToggle');
    tg.classList.toggle('on', j.running);
    $('tftpToggleText').textContent = j.running ? '运行中' : '已停止';
    if (j.root_dir && !$('tftpDirPath').dataset.editing) $('tftpDirPath').textContent = j.root_dir;
    // 两个独立容器分别脏检查：传输区含进度（bytes 变化必须刷新进度条），
    // 文件区只在文件集变化时刷新。分区可折叠，折叠状态纳入脏检查 key。
    const transfersEl = $('tftpTransfers');
    const filesEl = $('tftpFiles');
    const secState0 = (n) => { try { return localStorage.getItem('tftpSec_' + n) !== '0'; } catch(e) { return true; } };
    // 传输区：最近传输在上（5 行滚动），进行中每秒刷新进度
    const transfers = j.transfers || [];
    // 记录有无进行中传输，供轮询频率切换（不查 DOM，避免冷启动漏掉前几秒进度）
    _tftpActive = transfers.some(t => t.status !== 'done' && t.status !== 'error');
    const tKey = JSON.stringify([secState0('transfers'),
      transfers.map(t => [t.status, t.bytes, t.total, t.filename, t.err])]);
    if (tKey !== _tftpTransfersKey) {
      _tftpTransfersKey = tKey;
      const tOpen = secState0('transfers');
      const secArrow = (open) => open ? '▾' : '▸';
      let thtml = `<div class="tftp-sec" data-sec="transfers" title="点击折叠/展开"><span>${secArrow(tOpen)} 最近传输</span><span>${transfers.length}</span></div>`;
      if (tOpen) {
        if (transfers.length) {
          thtml += transfers.map(t => {
            const active = t.status !== 'done' && t.status !== 'error';
            // get=设备下载(RRQ,有total)，put=设备上传(WRQ,total可能null)
            const icon = t.status === 'done' ? '✓' : t.status === 'error' ? '✗' : (t.kind === 'get' ? '⬆' : '⬇');
            const hasTotal = active && t.total;
            const pct = hasTotal ? Math.min(100, Math.round(t.bytes / t.total * 100)) : 0;
            const size = t.status === 'done'
              ? _fmtSize(t.bytes)
              : (hasTotal ? `${_fmtSize(t.bytes)}/${_fmtSize(t.total)} · ${pct}%` : _fmtSize(t.bytes));
            const tip = t.kind === 'get' ? '设备下载' : '设备上传';
            // 无 total（WRQ 未协商 tsize）时进度条用不确定条纹动画，至少表明在传输
            const barStyle = hasTotal ? `width:${pct}%` : '';
            const barClass = hasTotal ? '' : 'indeterminate';
            return `<div class="tftp-item ${active ? 'active' : t.status}" title="${tip} · ${t.peer}${t.err ? ' · ' + esc(t.err) : ''}">
              <span class="icon">${icon}</span>
              <span class="name">${esc(t.filename)}</span>
              <span class="size">${size}</span>
              <div class="bar ${barClass}"><i style="${barStyle}"></i></div>
            </div>`;
          }).join('');
        } else {
          thtml += `<div class="tftp-empty"><div>暂无传输</div><div class="hint">设备端执行 tftp 命令即可上传/下载</div></div>`;
        }
      }
      transfersEl.innerHTML = thtml;
    }
    // 文件区：目录文件在下，占余下空间
    const files = j.files || [];
    const fKey = JSON.stringify([secState0('files'), files.map(f => [f.name, f.size])]);
    if (fKey !== _tftpFilesKey) {
      _tftpFilesKey = fKey;
      const fOpen = secState0('files');
      const secArrow = (open) => open ? '▾' : '▸';
      let fhtml = `<div class="tftp-sec" data-sec="files" title="点击折叠/展开"><span>${secArrow(fOpen)} 目录文件</span><span>${files.length}</span></div>`;
      if (fOpen) {
        if (files.length) {
          fhtml += files.map(f => `
            <div class="tftp-file" title="${esc(f.name)} · ${_fmtSize(f.size)}">
              <span class="icon">📄</span>
              <span class="name">${esc(f.name)}</span>
              <span class="size">${_fmtSize(f.size)}</span>
            </div>`).join('');
        } else {
          fhtml += `<div class="tftp-empty"><div>目录为空或未选择</div></div>`;
        }
      }
      filesEl.innerHTML = fhtml;
    }
  } catch(e) {}
}
// 分区标题点击折叠/展开（事件委托，绑定到两个容器；状态 localStorage 记忆）
[$('tftpTransfers'), $('tftpFiles')].forEach(el => {
  el.addEventListener('click', e => {
    const sec = e.target.closest('.tftp-sec');
    if (!sec || !sec.dataset.sec) return;
    const key = 'tftpSec_' + sec.dataset.sec;
    const open = (function(){ try { return localStorage.getItem(key) !== '0'; } catch(e){ return true; } })();
    try { localStorage.setItem(key, open ? '0' : '1'); } catch(e) {}
    refreshTftp();
  });
});
// TFTP 面板高度拖拽调节 + localStorage 记忆
(function initTftpResizer() {
  const resizer = $('tftpResizer');
  const pane = $('tftpPane');
  if (!resizer || !pane) return;
  // 恢复记忆高度（clamp 到合理范围防窗口变小后面板超界）
  try {
    const h = parseInt(localStorage.getItem('tftpPaneH') || '', 10);
    if (h >= 180 && h <= window.innerHeight - 200) pane.style.height = h + 'px';
  } catch(e) {}
  let dragging = false, startY = 0, startH = 0;
  resizer.addEventListener('mousedown', e => {
    dragging = true; startY = e.clientY; startH = pane.offsetHeight;
    resizer.classList.add('dragging');
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    // 向上拖增大：clientY 减小 → 高度增加
    const h = Math.max(180, Math.min(startH + (startY - e.clientY), window.innerHeight - 200));
    pane.style.height = h + 'px';
  });
  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    resizer.classList.remove('dragging');
    document.body.style.userSelect = '';
    try { localStorage.setItem('tftpPaneH', pane.offsetHeight); } catch(e) {}
  });
})();

$('tftpToggle').onclick = async () => {
  try {
    const r = await fetch(`/api/tftp/${_tftpRunning ? 'stop' : 'start'}`, {method:'POST'});
    const j = await r.json();
    if (j.msg) showBanner(j.msg);
    refreshTftp();
  } catch(e) { showBanner('TFTP 操作失败', 4000, true); }
};
async function pickTftpDir() {
  // 原生目录对话框（pywebview js_api）。取消（空串）直接中止——不弹输入框
  try {
    if (window.pywebview && pywebview.api && pywebview.api.pick_dir) {
      let dir = await pywebview.api.pick_dir();
      // 防御：js bridge 序列化异常时可能拿到数组形态，归一化为字符串
      if (Array.isArray(dir)) dir = dir[0] || '';
      if (dir) return setTftpDir(dir);
      return;  // 用户取消对话框，什么都不做
    }
  } catch(e) {}
  // js bridge 不可用兜底：内联输入（WebView2 可能禁用 window.prompt，不能用）
  _tftpInlineDirInput();
}
function _tftpInlineDirInput() {
  // 内联路径输入：把路径 span 换成 input，回车提交 / Esc 取消 / 失焦中止
  const span = $('tftpDirPath');
  if (span.dataset.editing) return;
  const old = span.textContent === '选择目录…' ? '' : span.textContent;
  span.dataset.editing = '1';
  const input = document.createElement('input');
  input.type = 'text';
  input.value = old;
  input.style.cssText = 'width:100%;font-family:var(--font-mono);font-size:10px;background:var(--bg-input,#111);border:1px solid var(--accent);border-radius:5px;padding:4px 6px;color:var(--fg);outline:none';
  span.textContent = '';
  span.appendChild(input);
  input.focus(); input.select();
  let done = false;
  const finish = (apply) => {
    if (done) return; done = true;
    delete span.dataset.editing;
    const v = input.value.trim().replace(/^["']|["']$/g, '');  // 容忍手输时带引号
    span.textContent = apply && v ? v : (old || '选择目录…');
    if (apply && v) setTftpDir(v);
    else refreshTftp();  // 恢复原显示
  };
  input.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Enter') finish(true);
    else if (e.key === 'Escape') finish(false);
  });
  input.addEventListener('blur', () => finish(true));
}
async function setTftpDir(dir) {
  try {
    const r = await fetch('/api/tftp/set_dir', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({root_dir: dir})});
    const j = await r.json();
    if (j.ok) { showBanner('TFTP 目录已切换: ' + dir); refreshTftp(); }
    else showBanner(j.err || '目录无效', 4000, true);
  } catch(e) { showBanner('设置目录失败', 4000, true); }
}
$('tftpPickDir').onclick = pickTftpDir;
$('tftpDirPath').onclick = pickTftpDir;
$('tftpTypeDir').onclick = _tftpInlineDirInput;  // 手动输入（支持 UNC/网络盘/任意路径）
refreshTftp();
// 传输进度刷新：空闲 2s 兜底，进行中 0.5s 抓进度。
// 关键：active 状态用 JS 变量从 status 响应记录，不查 DOM——传输刚启动时 DOM 还没
// 渲染出 active 项，查 DOM 会漏掉前 10s 进度（设备升完才显示结果的根因）。
setInterval(() => { if (!_tftpActive) refreshTftp(); }, 2000);       // 空闲兜底
setInterval(() => { if (_tftpActive) refreshTftp(); }, 500);          // 进行中抓进度

// 初始化
// ============================================================
// 性能计时：页面加载各阶段上报后端（诊断启动慢）
const _perf = { domStart: performance.now(), initStart: 0, initDone: 0 };
document.addEventListener('DOMContentLoaded', () => { _perf.domReady = performance.now(); });
function _reportPerf() {
  _perf.initDone = performance.now();
  try {
    fetch('/api/ai/perf', {method:'POST',headers:{'Content-Type':'application/json'},body: JSON.stringify({
      dom_start: Math.round(_perf.domStart),
      dom_ready: Math.round(_perf.domReady || 0),
      init_done: Math.round(_perf.initDone),
      load: Math.round(_perf.initDone - _perf.domStart),
    })});
  } catch(e) {}
}
loadPorts();
refreshGlobalStatus();
connectAiSSE();
refreshMcpInfo();
_reportPerf();  // 初始化完成，上报计时
// 轮询降载：连接增删时 refreshSidebar/refreshGlobalStatus 已被事件调用处触发，
// 周期轮询只作兜底，全部放宽（3s→15s / 5s→30s），减少常态 HTTP + 重排叠加（输入卡顿 Contributor）
setInterval(refreshGlobalStatus, 15000);
setInterval(refreshMcpInfo, 30000);  // MCP 状态面板：后端地址/工具/最近调用
setInterval(() => { if (activePortId) refreshSidebar(); }, 30000);
setInterval(() => {
  // 感知面板可见时刷新分析（用户停在分析标签）
  const activePane = document.querySelector('.panel-tab.active');
  if (activePane && activePane.dataset.pane === 'analyze') renderAnalyze();
}, 5000);
