<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>终端控制台 Pro</title>
<style>
  :root {
    --bg-deep: #050810;
    --bg: #0a0f1c;
    --bg-panel: #0d1424;
    --bg-card: #111a2e;
    --bg-input: #0a1120;
    --border: #1a2942;
    --border-glow: #2a4a7a;
    --fg: #c8d6e8;
    --fg-bright: #e8f1ff;
    --muted: #5a6b85;
    --accent: #00d4ff;
    --accent-2: #0099cc;
    --accent-glow: rgba(0, 212, 255, 0.4);
    --neon-green: #00ff9d;
    --neon-purple: #b366ff;
    --neon-orange: #ff9d00;
    --neon-red: #ff4060;
    --kernel: #79c0ff;
    --kernel-err: #ff7b72;
    --uboot: #d2a8ff;
    --heop: #a5d6ff;
    --heop-ok: #56d364;
    --heop-fail: #ff7b72;
    --prompt: #00ff9d;
    --text: #c8d6e8;
    --input-c: #00d4ff;
    --shadow-glow: 0 0 20px rgba(0, 212, 255, 0.15);
    --font-mono: "Cascadia Code", "JetBrains Mono", "Consolas", "Menlo", monospace;
    --font-ui: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg-deep);
    color: var(--fg);
    font-family: var(--font-ui);
    font-size: 13px;
    display: flex;
    flex-direction: column;
  }
  /* 科技风背景网格 */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: "";
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at top, rgba(0, 212, 255, 0.06), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* ===== 顶栏 ===== */
  .topbar {
    position: relative; z-index: 10;
    display: flex; align-items: center; gap: 14px;
    padding: 0 18px; height: 52px;
    background: linear-gradient(180deg, var(--bg-panel), var(--bg));
    border-bottom: 1px solid var(--border);
    box-shadow: 0 2px 20px rgba(0,0,0,0.4);
    flex-shrink: 0;
  }
  .logo {
    display: flex; align-items: center; gap: 10px;
    font-weight: 700; font-size: 15px; color: var(--fg-bright);
    letter-spacing: 0.5px;
  }
  .logo .icon {
    width: 28px; height: 28px; border-radius: 7px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; line-height: 1;
    box-shadow: 0 0 12px var(--accent-glow);
  }
  .logo .ver { color: var(--accent); font-size: 11px; font-weight: 600; }
  /* 拖拽日志遮罩 */
  #dragOverlay {
    position: fixed; inset: 0; z-index: 9999;
    background: rgba(0, 20, 40, 0.75);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 600; color: var(--accent);
    border: 3px dashed var(--accent);
    pointer-events: none;
    backdrop-filter: blur(2px);
  }
  /* 日志查看 tab */
  .log-viewer { display: flex; flex-direction: column; width: 100%; height: 100%; position: relative; }
  .log-viewer-top { flex: 1; display: flex; min-height: 0; }
  .log-viewer-top .vlist { flex: 1; }
  .log-search-splitter { height: 5px; background: var(--border); cursor: row-resize; flex-shrink: 0; display: none; }
  .log-search-splitter:hover { background: var(--accent); }
  .log-search-pane { flex-direction: column; min-height: 60px; max-height: 70%; background: var(--bg-card); border-top: 1px solid var(--border); }
  .log-search-head { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  .log-search-head input { flex: 1; background: var(--bg-input); border: 1px solid var(--border); color: var(--fg); border-radius: 4px; padding: 4px 8px; font-size: 12px; }
  .log-search-count { color: var(--muted); font-size: 11px; min-width: 60px; }
  .log-search-results { flex: 1; overflow-y: auto; position: relative; background: var(--bg-input); }
  .log-search-results .hline { cursor: pointer; }
  .log-search-results .hline.active { background: var(--accent); color: #001020; }
  .log-search-results .hline.active .hrow, .log-search-results .hline.active .htag { color: #001020; }
  .log-viewer-status { position: absolute; bottom: 4px; right: 8px; font-size: 10px; color: var(--muted); pointer-events: none; background: rgba(0,0,0,0.4); padding: 2px 6px; border-radius: 3px; }
  .topbar .divider { width: 1px; height: 24px; background: var(--border); }
  .topbar .conn-area { display: flex; align-items: center; gap: 8px; }
  .topbar select, .topbar input {
    background: var(--bg-input); color: var(--fg); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; font-size: 12px; font-family: var(--font-ui);
    outline: none; transition: border-color 0.2s, box-shadow 0.2s;
  }
  .topbar select { min-width: 130px; cursor: pointer; }
  .topbar select:focus, .topbar input:focus {
    border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow);
  }
  .btn {
    background: var(--bg-card); color: var(--fg); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 14px; font-size: 12px; cursor: pointer;
    font-family: var(--font-ui); transition: all 0.2s; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #001020; border: none; font-weight: 600;
  }
  .btn.primary:hover { box-shadow: 0 0 14px var(--accent-glow); filter: brightness(1.1); }
  .btn.danger { color: var(--neon-red); }
  .btn.danger:hover { border-color: var(--neon-red); box-shadow: 0 0 8px rgba(255,64,96,0.3); }
  .btn.ghost { background: transparent; }
  .btn.icon-btn { padding: 6px 8px; min-width: 30px; text-align: center; }
  .topbar .spacer { flex: 1; }
  .topbar .status-pill {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 20px;
    background: var(--bg-card); border: 1px solid var(--border);
    font-size: 11px; color: var(--muted);
  }
  .topbar .status-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .topbar .status-pill .dot.on { background: var(--neon-green); box-shadow: 0 0 6px var(--neon-green); }
  .topbar .status-pill .dot.rec { background: var(--neon-red); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* ===== 主布局 ===== */
  .main {
    flex: 1; display: flex; min-height: 0; position: relative; z-index: 1;
  }

  /* ===== 左侧串口列表 ===== */
  .sidebar {
    width: 220px; flex-shrink: 0;
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .sidebar-head {
    padding: 12px 16px 8px;
    font-size: 11px; font-weight: 600; letter-spacing: 1px;
    color: var(--muted); text-transform: uppercase;
    display: flex; align-items: center; justify-content: space-between;
  }
  .sidebar-head .count {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 10px; padding: 1px 8px; font-size: 10px; color: var(--accent);
  }
  .port-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
  .port-item {
    padding: 10px 12px; border-radius: 8px; cursor: pointer;
    margin-bottom: 4px; transition: all 0.2s;
    border: 1px solid transparent;
    display: flex; align-items: center; gap: 10px;
  }
  .port-item:hover { background: var(--bg-card); }
  .port-item.active {
    background: linear-gradient(135deg, rgba(0,212,255,0.12), rgba(0,153,204,0.05));
    border-color: var(--border-glow);
    box-shadow: inset 0 0 10px rgba(0,212,255,0.08);
  }
  .port-item .led {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    background: var(--muted); transition: all 0.3s;
  }
  .port-item.connected .led { background: var(--neon-green); box-shadow: 0 0 8px var(--neon-green); }
  .port-item .info { flex: 1; min-width: 0; }
  .port-item .name { font-size: 12px; font-weight: 600; color: var(--fg-bright); font-family: var(--font-mono); }
  .port-item .desc { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .port-item .baud { font-size: 10px; color: var(--accent); font-family: var(--font-mono); }
  .port-item .actions { display: none; gap: 4px; }
  .port-item:hover .actions { display: flex; }
  .port-item .actions button {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 14px; padding: 0 2px; border-radius: 3px;
  }
  .port-item .actions button:hover { color: var(--neon-red); background: rgba(255,64,96,0.1); }
  .sidebar-foot {
    padding: 10px 14px; border-top: 1px solid var(--border);
    font-size: 10px; color: var(--muted); display: flex; justify-content: space-between;
  }

  /* ===== 中央终端区 ===== */
  .center { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .tabs {
    display: flex; align-items: center; gap: 2px;
    padding: 6px 8px 0; background: var(--bg-panel);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
    overflow-x: auto;
  }
  .tab {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px; border-radius: 7px 7px 0 0;
    cursor: pointer; font-size: 12px; color: var(--muted);
    border: 1px solid transparent; border-bottom: none;
    transition: all 0.2s; white-space: nowrap;
  }
  .tab:hover { color: var(--fg); background: var(--bg-card); }
  .tab.active {
    color: var(--accent); background: var(--bg);
    border-color: var(--border); border-bottom-color: var(--bg);
    position: relative;
  }
  .tab.active::after {
    content: ""; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--accent), transparent);
  }
  .tab .led { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
  .tab.active .led { background: var(--neon-green); box-shadow: 0 0 6px var(--neon-green); }
  .tab .close { opacity: 0.4; font-size: 14px; padding: 0 2px; border-radius: 3px; }
  .tab .close:hover { opacity: 1; color: var(--neon-red); }
  .tab-bar-actions { margin-left: auto; display: flex; gap: 4px; padding-right: 8px; }

  .term-area { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .term-toolbar {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 12px; background: var(--bg-panel);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .term-toolbar .btn { padding: 4px 10px; font-size: 11px; }
  .term-toolbar .info { font-size: 11px; color: var(--muted); margin-left: auto; font-family: var(--font-mono); }

  .output-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; background: var(--bg); }
  .output { flex: 1; min-height: 0; overflow-y: auto;
    padding: 8px 14px;
    font-family: var(--font-mono); font-size: 13px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-all;
    font-variant-ligatures: none;
  }
  /* xterm 终端容器 */
  .xterm-wrap {
    flex: 1; min-height: 0; position: relative; background: #000;
    padding: 4px 6px; overflow: hidden;
  }
  .xterm-wrap .xterm { height: 100%; }
  .xterm-wrap .xterm-viewport { overflow-y: auto !important; }
  /* xterm 行高/字号与原终端一致 */
  .xterm-wrap .xterm-rows { font-family: var(--font-mono); }
  .line { padding: 0; }
  .line .ts { color: #2a3a55; font-size: 10px; margin-right: 8px; user-select: none; font-family: var(--font-mono); }
  .tag-kernel { color: var(--kernel); }
  .tag-kernel_err { color: var(--kernel-err); }
  .tag-uboot { color: var(--uboot); }
  .tag-heop { color: var(--heop); }
  .tag-heop_ok { color: var(--heop-ok); }
  .tag-heop_fail { color: var(--heop-fail); font-weight: 600; }
  .tag-prompt { color: var(--prompt); }
  .tag-text { color: var(--text); }
  .tag-empty { }
  .tag-input { color: var(--input-c); }
  .tag-serial-reader, .tag-serial, .tag-ctrl { color: var(--neon-orange); font-style: italic; }

  /* 终端内联输入行（v0.3.0 已弃用，xterm 自带输入；保留样式以防残留引用） */
  .term-input-line { display: none; }

  /* ===== 右侧面板（工具栏 + 标签页） ===== */
  .ai-panel {
    width: 340px; flex-shrink: 0;
    background: var(--bg-panel);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
    transition: width 0.3s;
  }
  .ai-panel.collapsed { width: 44px; }
  .ai-panel.collapsed .panel-body, .ai-panel.collapsed .ai-head-detail { display: none; }
  .ai-panel.collapsed .ai-head { padding: 12px 0; justify-content: center; }
  .ai-panel.collapsed #aiToggle { display: none; }
  .ai-head .ai-icon { cursor: pointer; transition: transform 0.2s; }
  .ai-head .ai-icon:hover { transform: scale(1.12); }
  .ai-head {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  }
  .ai-head .ai-icon {
    width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--neon-purple), var(--accent));
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; box-shadow: 0 0 12px rgba(179,102,255,0.4);
  }
  .ai-head-detail { flex: 1; }
  .ai-head-detail .title { font-size: 13px; font-weight: 600; color: var(--fg-bright); }
  .ai-head-detail .sub { font-size: 10px; color: var(--muted); }
  .ai-head .toggle {
    background: none; border: 1px solid var(--border); border-radius: 5px;
    color: var(--muted); cursor: pointer; padding: 3px 7px; font-size: 14px;
  }
  .ai-head .toggle:hover { color: var(--accent); border-color: var(--accent); }

  /* 顶部工具栏：搜索 + 跳底 */
  .panel-toolbar {
    display: flex; align-items: center; gap: 6px;
    padding: 10px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .panel-toolbar .search-box {
    flex: 1; display: flex; align-items: center; gap: 4px;
    background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px;
    padding: 4px 8px; transition: border-color 0.2s, box-shadow 0.2s;
  }
  .panel-toolbar .search-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
  .panel-toolbar .search-box input {
    flex: 1; background: transparent; border: none; outline: none; color: var(--fg);
    font-size: 12px; font-family: var(--font-ui);
  }
  .panel-toolbar .search-box .count { font-size: 10px; color: var(--muted); font-family: var(--font-mono); }
  .panel-toolbar .nav-btn {
    background: none; border: 1px solid var(--border); border-radius: 5px;
    color: var(--muted); cursor: pointer; padding: 3px 6px; font-size: 12px;
  }
  .panel-toolbar .nav-btn:hover { color: var(--accent); border-color: var(--accent); }
  .panel-toolbar .nav-btn:disabled { opacity: 0.3; cursor: default; }
  .panel-toolbar .jump-btn {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px;
    color: var(--accent); cursor: pointer; padding: 4px 10px; font-size: 12px;
    white-space: nowrap; transition: all 0.2s;
  }
  .panel-toolbar .jump-btn:hover { border-color: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }

  /* 标签页 */
  .panel-tabs {
    display: flex; gap: 2px; padding: 0 14px; background: var(--bg-panel);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .panel-tab {
    padding: 8px 14px; cursor: pointer; font-size: 12px; color: var(--muted);
    border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap;
  }
  .panel-tab:hover { color: var(--fg); }
  .panel-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .panel-body { flex: 1; min-height: 0; overflow-y: auto; }
  .panel-tab-pane { display: none; height: 100%; }
  .panel-tab-pane.active { display: flex; flex-direction: column; }

  /* 感知标签 */
  .sense-pane { padding: 8px 14px; overflow-y: auto; }
  .sense-head {
    font-size: 10px; font-weight: 600; letter-spacing: 1px; color: var(--muted);
    text-transform: uppercase; margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .sense-head .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--neon-green); animation: pulse 1.5s infinite; }
  .sense-filter { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; }
  .sense-filter .chip {
    font-size: 10px; padding: 2px 8px; border-radius: 10px; cursor: pointer;
    background: var(--bg-card); border: 1px solid var(--border); color: var(--muted);
    font-family: var(--font-mono); transition: all 0.2s;
  }
  .sense-filter .chip:hover { border-color: var(--accent); color: var(--accent); }
  .sense-filter .chip.active { background: rgba(0,212,255,0.15); border-color: var(--accent); color: var(--accent); }
  .sense-line { font-family: var(--font-mono); font-size: 11px; color: var(--text); padding: 2px 0; white-space: pre-wrap; word-break: break-all; cursor: pointer; border-radius: 4px; padding-left: 4px; }
  .sense-line:hover { background: var(--bg-card); }
  .sense-line .port-tag { color: var(--accent); font-size: 9px; margin-right: 4px; }
  .sense-line.kw-error { color: var(--neon-red); }
  .sense-line.kw-warning { color: var(--neon-orange); }
  .sense-line.kw-info { color: var(--accent); }

  /* 分析标签 */
  .analyze-pane { padding: 12px 14px; overflow-y: auto; }
  .stat-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 14px; }
  .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
  .stat-card .label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-card .value { font-size: 20px; font-weight: 700; font-family: var(--font-mono); margin-top: 2px; }
  .stat-card.err .value { color: var(--neon-red); }
  .stat-card.warn .value { color: var(--neon-orange); }
  .stat-card.info .value { color: var(--accent); }
  .stat-card.ok .value { color: var(--neon-green); }
  .analyze-section { margin-bottom: 14px; }
  .analyze-section .title { font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .freq-bar { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; font-size: 11px; }
  .freq-bar .name { width: 70px; color: var(--fg); font-family: var(--font-mono); }
  .freq-bar .bar { flex: 1; height: 8px; background: var(--bg-card); border-radius: 4px; overflow: hidden; }
  .freq-bar .fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 4px; }
  .freq-bar .num { width: 30px; text-align: right; color: var(--muted); font-family: var(--font-mono); }
  .cluster-item { font-size: 11px; color: var(--fg); padding: 4px 8px; background: var(--bg-card); border-radius: 6px; margin-bottom: 4px; border-left: 2px solid var(--neon-red); font-family: var(--font-mono); cursor: pointer; }
  .cluster-item:hover { background: var(--bg-input); }

  /* 命令标签 */
  .cmd-pane { padding: 10px 14px; overflow-y: auto; display: flex; flex-direction: column; }
  .cmd-add { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .cmd-add input { background: var(--bg-input); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 12px; outline: none; font-family: var(--font-mono); width: 100%; }
  .cmd-add .cmd-add-name { font-family: var(--font-ui); }
  .cmd-add .cmd-add-row { display: flex; gap: 6px; }
  .cmd-add .cmd-add-cmd { flex: 1; }
  .cmd-add input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
  .cmd-add button { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #001020; border: none; border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer; font-weight: 600; flex-shrink: 0; }
  .cmd-sheets { display: flex; gap: 4px; margin-bottom: 8px; border-bottom: 1px solid var(--border); }
  .cmd-sheet-tab { font-size: 11px; font-weight: 600; color: var(--muted); padding: 4px 10px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.2s; }

  /* 历史浏览（虚拟列表） */

  .vlist-viewport { position: absolute; left: 0; right: 0; top: 0; }  /* 跟随 scrollTop 平移的渲染块，行在其中用实际坐标排列 */
  .hline { position: absolute; left: 0; right: 0; top: 0; height: 18px; line-height: 18px; padding: 0 6px; font-family: var(--font-mono); font-size: 11px; color: var(--fg); white-space: pre; overflow: hidden; text-overflow: ellipsis; box-sizing: border-box; }

  /* 全屏覆盖容器（top 等）—— v0.3.0：xterm 自身处理全屏序列，此 overlay 仅作"全屏模式"提示条 */

  }
  .screen-overlay.show { display: flex; flex-direction: column; }
  /* 退出全屏提示条 */
  .screen-hint {
    padding: 4px 10px; font-size: 11px; color: var(--muted);

  .screen-body, .screen-row, .screen-cursor { display: none; }

  /* 跳底悬浮按钮 —— 主窗口右下角，科技风 */
  .jump-bottom-fab {
    position: absolute; right: 20px; bottom: 20px; z-index: 8;
    display: none; align-items: center; justify-content: center;
    width: 44px; height: 44px; border-radius: 14px;
    background: linear-gradient(135deg, rgba(0,212,255,0.92), rgba(0,153,204,0.88));
    color: #001020; cursor: pointer;
    box-shadow: 0 4px 18px rgba(0,212,255,0.45), 0 0 0 1px rgba(0,212,255,0.25) inset;
    transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), box-shadow 0.25s, opacity 0.25s;
    opacity: 0.92;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .jump-bottom-fab svg { width: 22px; height: 22px; display: block; }
  .jump-bottom-fab:hover {
    transform: translateY(-3px) scale(1.06);
    box-shadow: 0 8px 26px rgba(0,212,255,0.6), 0 0 0 1px rgba(0,212,255,0.4) inset;
    opacity: 1;
  }
  .jump-bottom-fab:active { transform: translateY(-1px) scale(1.02); }
  .jump-bottom-fab.show { display: flex; animation: fab-in 0.3s ease; }
  @keyframes fab-in {
    from { opacity: 0; transform: translateY(8px) scale(0.85); }

  }
  /* 持续呼吸提示 */
  .jump-bottom-fab.show::after {
    content: ""; position: absolute; inset: -4px; border-radius: 16px;

    animation: fab-pulse 1.8s ease-out infinite;
    pointer-events: none;
  }
  @keyframes fab-pulse {

    70%  { opacity: 0; transform: scale(1.25); }
    100% { opacity: 0; transform: scale(1.25); }
  }

  /* 搜索/关键字高亮 */
  mark.hit { background: rgba(0,212,255,0.18); border-bottom: 2px solid var(--accent); color: inherit; padding: 0 1px; border-radius: 2px; }

  .modal {

  .log-dir-bar .lbl { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .log-dir-input { flex: 1; background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; color: var(--fg); font-family: var(--font-mono); font-size: 11px; outline: none; }
  .log-dir-input:focus { border-color: var(--accent); }
  .modal .list { overflow-y: auto; padding: 8px; }
  .modal .item { padding: 10px 12px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: all 0.2s; gap: 8px; }
  .modal .item:hover { background: var(--bg-card); border-color: var(--accent); }
  .modal .item .sz { color: var(--muted); font-size: 11px; }

  .modal .item .act-btn:hover { border-color: var(--accent); background: rgba(0,212,255,0.12); }
  .modal .item .act-btn.open { color: var(--neon-orange); }

  /* 连接对话框 */
  .conn-modal .box { width: 400px; }
  .conn-form { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .conn-form label { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
  .conn-form select, .conn-form input { width: 100%; background: var(--bg-input); color: var(--fg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 13px; outline: none; }
  .conn-form select:focus, .conn-form input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
  .conn-form .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }

  /* 命令编辑对话框 */
  #cmdEditModal .box { width: 420px; }

  /* 滚动条 */

  /* 横幅通知 */
  .banner {

<script>
// ============================================================
// 全局状态
// ============================================================
const $ = id => document.getElementById(id);
const banner = $('banner');
const portList = $('portList');
const tabs = $('tabs');
const termArea = $('termArea');

let connections = {};   // port_id -> conn（含 term/fit/search/xtermWrap/sse 等）
let activePortId = null;
let aiSse = null;

function showBanner(msg, ms=4000, isErr=false) {
  banner.textContent = msg;
  banner.className = 'banner show' + (isErr ? ' err' : '');
  if (ms) setTimeout(()=>{ if (banner.textContent === msg) banner.className = 'banner'; }, ms);
}
function fmtTs(ms) {
  const d = new Date(ms);
  return d.toLocaleTimeString('zh-CN', {hour12:false}) + '.' + String(ms % 1000).padStart(3,'0');
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// 连接排序：串口[0] < SSH[1] < 日志[2]，同类内按自然序
function sortKeyFn(pid) {
  const m = /^COM(\d+)$/i.exec(pid);
  if (m) return [0, parseInt(m[1], 10)];  // 串口：COM 号数字序
  if (pid.startsWith('log:')) return [2, pid];  // 日志：字典序
  return [1, pid];  // SSH：字典序
}

// ============================================================
// 关键字高亮（error/warning/info 等）
// v0.3.0：改用 xterm decoration 实现（见下方 highlightNewKw），
// 旧的 DOM textNode 高亮函数 highlightKeywords 已废弃移除。
// ============================================================
// （KW_RULES / KW_COLOR 已移至下方 xterm decoration 区块统一定义）

// ============================================================
// 终端标签页 & 输出区管理
// ============================================================
// 注：实际终端元素由 buildTerminal() 创建，此处不再保留死代码。

// 重新设计：每个连接有自己的 xterm 终端容器
function buildTerminal(portId, meta) {
  // 标签
  const tab = document.createElement('div');
  tab.className = 'tab';
  tab.dataset.portId = portId;
  tab.innerHTML = `<span class="led"></span><span>${esc(meta.label || portId)}</span><span style="color:var(--muted);font-size:10px;">${meta.kind === 'ssh' ? '' : '@'+meta.baud}</span> <span class="close" title="关闭">✕</span>`;
  tab.onclick = (e) => {
    if (e.target.classList.contains('close')) { e.stopPropagation(); closeConnection(portId); return; }
    switchTab(portId);
  };
  // 终端区
  const wrap = document.createElement('div');
  wrap.className = 'term-area';
  wrap.dataset.portId = portId;
  wrap.style.display = 'none';
  wrap.innerHTML = `
    <div class="output-wrap">
      <div class="xterm-wrap" data-xterm="${portId}"></div>
    </div>
  `;

  const conn = {
    meta, tab, wrap,
    xtermWrap: wrap.querySelector(`[data-xterm="${portId}"]`),
    term: null, fit: null, search: null,
    sse: null,
    paused: false,
    autoScroll: true,
    pendingRaw: '',   // 历史加载期间缓冲的实时 raw，loadBuffer 完成后 flush
    // 历史分页（基于后端 buf，xterm 滚动到底即实时流；向上翻历史用分页 API）
    hasMore: true,
    oldestSeq: null,
    loadingMore: false,
    loadingHistory: false,
    // 全屏模式（top/htop）：仅用于显示提示条 + 抑制跳底 FAB
    inScreen: false,
    screenOverlay: null,
    fab: null,
    // 关键字常驻高亮：记录已加 decoration 的行范围
    kwDecorLastRow: 0,
    kwDecorations: [],
  };

  // ---- 创建 xterm 实例 ----
  conn.term = new Terminal({
    fontFamily: '"Cascadia Code", "JetBrains Mono", "Consolas", "Menlo", monospace',
    fontSize: 13,
    lineHeight: 1.3,
    cursorBlink: true,
    cursorStyle: 'bar',
    scrollback: 100000,       // 大回滚缓冲，配合后端分页
    allowProposedApi: true,
    convertEol: false,        // 保留原始 \r\n，设备输出原样
    theme: {
      background: '#000000',
      foreground: '#c8d6e8',
      cursor: '#00d4ff',
      cursorAccent: '#000000',
      selectionBackground: 'rgba(0,212,255,0.25)',
      black: '#0a0f1c', red: '#ff7b72', green: '#56d364', yellow: '#e3b341',
      blue: '#79c0ff', magenta: '#d2a8ff', cyan: '#39c5cf', white: '#c9d1d9',
      brightBlack: '#6e7681', brightRed: '#ffa198', brightGreen: '#7ee787',
      brightYellow: '#f0e07a', brightBlue: '#a5d6ff', brightMagenta: '#d2a8ff',
      brightCyan: '#56d4dd', brightWhite: '#f0f6fc',
    },
  });
  conn.fit = new FitAddon.FitAddon();
  conn.search = new SearchAddon.SearchAddon();
  conn.term.loadAddon(conn.fit);
  conn.term.loadAddon(conn.search);
  try { conn.term.loadAddon(new WebLinksAddon.WebLinksAddon()); } catch(e) {}
  conn.term.open(conn.xtermWrap);
  try { conn.fit.fit(); } catch(e) {}

  // ---- Ctrl+C 复制选中文字（有选中→复制；无选中→发 ^C 中断）----
  conn.term.attachCustomKeyEventHandler(e => {
    if (e.ctrlKey && e.key === 'c' && e.type === 'keydown') {
      const sel = conn.term.getSelection();
      if (sel) { try { navigator.clipboard.writeText(sel); } catch(_){} return false; }
    }
    return true;
  });

  // ---- xterm 输入 → 串口 ----
  conn.term.onData(data => {
    if (conn.paused) return;
    // data 是字符串（已按字符拆分），编码为字节发送
    const bytes = [];
    for (let i = 0; i < data.length; i++) {
      const code = data.charCodeAt(i);
      if (code < 128) bytes.push(code);
      else { for (const b of new TextEncoder().encode(data[i])) bytes.push(b); }
    }
    if (bytes.length) termSendRaw(portId, bytes);
  });

  // ---- 滚动检测：到底自动跟实时，翻上去显示跳底 FAB ----
  // 注：深历史翻阅走「📜 历史」tab（虚拟列表，G 级不卡），主 xterm 不再 reset 重写加载更早历史
  conn.term.onScroll(() => {
    const vp = conn.xtermWrap.querySelector('.xterm-viewport');
    if (!vp) return;
    const atBottom = vp.scrollHeight - vp.scrollTop - vp.clientHeight < 30;
    conn.autoScroll = atBottom;
    conn.fab.classList.toggle('show', !atBottom && !conn.inScreen);
  });

  // ---- 全屏模式提示条（xterm 自身处理全屏序列，这里只显示提示 + 退出按钮） ----
  const overlay = document.createElement('div');
  overlay.className = 'screen-overlay';
  overlay.dataset.screen = portId;
  overlay.innerHTML = `
    <div class="screen-hint">
      <span class="dot"></span><span>全屏模式（top/htop）— 实时刷新中</span>
      <span class="esc" data-screen-esc="${portId}">退出 ↩</span>
    </div>
  `;
  wrap.querySelector('.output-wrap').appendChild(overlay);
  conn.screenOverlay = overlay;
  overlay.querySelector(`[data-screen-esc="${portId}"]`).onclick = () => {
    termSendRaw(portId, [3]);  // Ctrl-C 中断 top
  };

  // ---- 跳底悬浮按钮 ----
  const fab = document.createElement('div');
  fab.className = 'jump-bottom-fab';
  fab.title = '跳到底部 (Ctrl+End)';
  fab.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v14"/><path d="m6 12 6 6 6-6"/><path d="M5 20h14"/></svg>';
  fab.onclick = () => jumpToBottom(portId);
  wrap.querySelector('.output-wrap').appendChild(fab);
  conn.fab = fab;

  // 插入 DOM
  const es = termArea.querySelector('.empty-state');
  if (es) es.remove();
  // 标签按 COM 号数字排序插入：找到第一个比当前大的标签，插它前面
  const _comKey = pid => { const m = /^COM(\d+)$/i.exec(pid); return m ? +m[1] : 9999; };
  const curKey = _comKey(portId);
  let inserted = false;
  for (const t of tabs.querySelectorAll('.tab')) {
    if (_comKey(t.dataset.portId) > curKey) {
      tabs.insertBefore(tab, t);
      inserted = true;
      break;
    }
  }
  if (!inserted) tabs.insertBefore(tab, tabs.querySelector('.tab-bar-actions'));
  termArea.appendChild(wrap);

  // SSE
  connectSSE(portId, conn);

  // 加载历史缓冲（写入 xterm）
  loadBuffer(portId, conn);
  return conn;
}

function switchTab(portId) {
  activePortId = portId;
  // 标签
  tabs.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.portId === portId));
  // 终端区
  termArea.querySelectorAll('.term-area').forEach(w => w.style.display = w.dataset.portId === portId ? 'flex' : 'none');
  // 侧边栏
  portList.querySelectorAll('.port-item').forEach(p => p.classList.toggle('active', p.dataset.portId === portId));
  // 切换后重新 fit 并聚焦 xterm（等 display:flex 生效后再 fit，否则算出 0 尺寸）
  const conn = connections[portId];
  if (conn) {
    if (conn.meta.kind === 'log') {
      // 日志 tab：重渲染虚拟列表（display:flex 后尺寸才正确）
      requestAnimationFrame(() => requestAnimationFrame(() => renderLogSlice(conn)));
    } else {
      requestAnimationFrame(() => requestAnimationFrame(() => {
        try { conn.fit.fit(); } catch(e){}
        try { conn.term.focus(); } catch(e){}
      }));
    }
    // 若分析标签正显示，刷新一次（数据源已切到新连接的 buffer）
    const activePane = document.querySelector('.panel-tab.active');
    if (activePane && activePane.dataset.pane === 'analyze') renderAnalyze();
  }
}

// 窗口/面板尺寸变化时重新 fit 活动 xterm
window.addEventListener('resize', () => {
  const conn = connections[activePortId];
  if (conn) {
    if (conn.meta.kind === 'log') renderLogSlice(conn);
    else { try { conn.fit.fit(); } catch(e){} }
  }
});

// SSE 收到 raw 字节流 → 写入 xterm；screenctl → 切换提示条
function appendRaw(portId, text) {
  const conn = connections[portId];
  if (!conn || conn.paused) return;
  // 历史还在加载时先缓冲 raw，等历史写完再 flush，避免实时数据插到历史前面/重复
  if (conn.loadingHistory) { conn.pendingRaw += text; return; }
  conn.term.write(text);
  // 关键字常驻高亮：对新写入的行扫描
  scheduleKwHighlight(conn);
}
function enterScreen(portId, conn) {
  if (conn.inScreen) return;
  conn.inScreen = true;
  conn.screenOverlay.classList.add('show');
  conn.fab.classList.remove('show');
}
function exitScreen(portId, conn) {
  if (!conn.inScreen) return;
  conn.inScreen = false;
  conn.screenOverlay.classList.remove('show');
}

// 构建一行 DOM（仅回放面板仍用 DOM 行渲染，主终端已改用 xterm）
function buildLineDiv(item) {
  const div = document.createElement('div');
  div.className = 'line tag-' + (item.tag || 'text');
  if (item.seq != null) div.dataset.seq = item.seq;
  const ts = document.createElement('span');
  ts.className = 'ts';
  ts.textContent = item.ts ? fmtTs(item.ts) : '';
  div.appendChild(ts);
  div.appendChild(document.createTextNode(item.text || ''));
  return div;
}

// DOM 节点上限：方向性裁剪（v0.3.0 已废弃，xterm 自管缓冲；保留空壳避免引用报错）
function trimDom(conn) {}

function renderTermInput(conn) {}

function termSendRaw(portId, bytes) {
  fetch('/api/send_raw', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({port_id: portId, bytes})});
}

function connectSSE(portId, conn) {
  conn.sse = new EventSource('/api/stream?port_id=' + encodeURIComponent(portId));
  conn.sse.onmessage = (e) => {
    try {
      const item = JSON.parse(e.data);
      if (item.kind === 'raw') {
        appendRaw(portId, item.data);
        return;
      }
      if (item.kind === 'screenctl') {
        if (item.state === 'exit') exitScreen(portId, conn);
        else if (item.state === 'enter') enterScreen(portId, conn);
        return;
      }
    } catch(err) {}
  };
  conn.sse.onerror = () => {
    conn.sse.close();
    setTimeout(() => { if (connections[portId]) connectSSE(portId, conn); }, 2000);
  };
}

// ============================================================
// 关键字常驻高亮（xterm decoration）
// ============================================================
const KW_RULES = [
  { cls: 'kw-error', re: /\b(error|fail|failed|failure|panic|oops|fatal|denied|refused|abort|crash|segfault|oom|killed|segmentation fault|no such file or directory|permission denied|operation not permitted|unable to handle|kernel panic|out of memory|oom-kill|oom killer|call trace|stack trace|core dump|bus error|page fault|null pointer|general protection fault|illegal instruction|division by zero|hung task|soft lockup|hard lockup)\b/gi },
  { cls: 'kw-warning', re: /\b(warn|warning|deprecated|timeout|retry|overflow|underrun|stall|hung|blocked|deadlock|leak|leaked|corrupt|corrupted|incomplete|missing|not found|not supported|invalid|broken|exhausted|degraded|overrun|underflow|bad blocks|read-only|filesystem corruption)\b/gi },
  { cls: 'kw-info', re: /\b(info|notice|starting|started|stopped|detected|found|loaded|ready|init|initializing|mounting|mounted|deactivated|booting|probe|probed|register|registered|enabled|disabled|linux version|systemd|udev|freeing|freed|allocated|setting up|configured|bringing up|link is up|link is down)\b/gi },
  { cls: 'kw-success', re: /\b(success|succeed|succeeded|ok|done|complete|completed|passed|ready)\b/gi },
];
const KW_COLOR = { 'kw-error':'#ff4060', 'kw-warning':'#ff9d00', 'kw-info':'#00d4ff', 'kw-success':'#00ff9d' };
// 节流：批量扫描新行，避免每个 chunk 都扫全缓冲
function scheduleKwHighlight(conn) {
  if (conn._kwTimer) return;
  conn._kwTimer = setTimeout(() => {
    conn._kwTimer = null;
    highlightNewKw(conn);
  }, 250);
}
function highlightNewKw(conn) {
  if (!conn.term || !conn.term.registerDecoration) return;
  const buf = conn.term.buffer.active;
  const totalRows = buf.length;
  const fromRow = Math.max(0, conn.kwDecorLastRow - 1); // 回溯一行防跨行漏扫
  for (let r = fromRow; r < totalRows; r++) {
    const line = buf.getLine(r);
    if (!line) continue;
    const text = line.translateToString(true);
    if (!text.trim()) continue;
    for (const rule of KW_RULES) {
      rule.re.lastIndex = 0;
      let m;
      while ((m = rule.re.exec(text)) !== null) {
        // kw-cmd 用捕获组 2 定位命令名本身，其余用整个匹配
        const grp = rule.grp || 0;
        const start = m.index + (m[grp] ? text.slice(m.index).indexOf(m[grp]) : 0);
        const matched = m[grp] || m[0];
        const end = start + matched.length;
        try {
          // registerMarker(e) 内部: ybase + y + e = 目标行 → e = r - ybase - y（相对偏移，非绝对行号）
          const offset = Math.round(r - buf.ybase - buf.y);
          const dec = conn.term.registerDecoration({
            marker: conn.term.registerMarker(offset),
            x: start,
            width: end - start,
            foregroundColor: KW_COLOR[rule.cls],
            layer: 'top',
          });
          if (dec) conn.kwDecorations.push(dec);
        } catch(e) {}
        if (m.index === rule.re.lastIndex) rule.re.lastIndex++;
      }
    }
  }
  conn.kwDecorLastRow = totalRows;
  if (conn.kwDecorations.length > 5000) {
    const drop = conn.kwDecorations.splice(0, conn.kwDecorations.length - 5000);
    drop.forEach(d => { try { d.dispose(); } catch(e){} });
  }
}

// ============================================================
// 历史分页（xterm 滚动到底即实时流；向上翻历史用后端分页 API）
// ============================================================
async function loadBuffer(portId, conn) {
  if (conn.loadingHistory) return;
  conn.loadingHistory = true;
  try {
    const r = await fetch('/api/buffer?port_id=' + encodeURIComponent(portId) + '&n=500');
    const j = await r.json();
    const lines = j.lines || [];
    if (lines.length) {
      // 历史行是"逻辑行"（后端已按 \n 切分、\r 覆盖处理过），用 \r\n 写入 xterm
      const text = lines.map(l => l.text || '').join('\r\n');
      if (text) conn.term.write(text + '\r\n');
      conn.oldestSeq = lines[0].seq;
      conn.hasMore = j.has_more !== false;
    } else {
      conn.hasMore = false;
    }
    conn.kwDecorLastRow = 0;
    scheduleKwHighlight(conn);
    if (conn.autoScroll) conn.term.scrollToBottom();
    // flush 历史加载期间缓冲的实时数据
    if (conn.pendingRaw) {
      const pend = conn.pendingRaw; conn.pendingRaw = '';
      conn.term.write(pend);
      scheduleKwHighlight(conn);
      if (conn.autoScroll) conn.term.scrollToBottom();
    }
  } catch(e) {} finally {
    conn.loadingHistory = false;
  }
}

// 向上加载更早历史：xterm 不支持顶部插入，用 reset 重写（旧行+当前行）
async function loadOlder(portId, conn) {
  if (conn.loadingMore || !conn.hasMore || conn.oldestSeq == null || conn.loadingHistory) return;
  conn.loadingMore = true;
  try {
    const r = await fetch('/api/buffer?port_id=' + encodeURIComponent(portId) + '&n=500&before_seq=' + conn.oldestSeq);
    const j = await r.json();
    const lines = j.lines || [];
    if (lines.length) {
      const older = lines.map(l => l.text || '').join('\r\n');
      const curBuf = conn.term.buffer.active;
      const curLines = [];
      for (let r = 0; r < curBuf.length; r++) {
        const ln = curBuf.getLine(r);
        if (ln) curLines.push(ln.translateToString(true));
      }
      // 记住重写前用户视口顶行对应的行号，重写后恢复到同一逻辑行
      const vp = conn.xtermWrap.querySelector('.xterm-viewport');
      let topRowBefore = 0;
      try {
        const cellH = conn.term._core._renderService.dimensions.css.cell.height || 17;
        topRowBefore = conn.term.buffer.active.baseY + Math.round(vp.scrollTop / cellH);
      } catch(e) {}
      const allText = older + '\r\n' + curLines.join('\r\n');
      conn.term.reset();
      conn.term.write(allText);
      conn.kwDecorLastRow = 0;
      conn.kwDecorations.forEach(d => { try { d.dispose(); } catch(e){} });
      conn.kwDecorations = [];
      conn.oldestSeq = lines[0].seq;
      conn.hasMore = j.has_more !== false;
      scheduleKwHighlight(conn);
      // 恢复滚动位置：旧行插入后，原视口顶行下移了 lines.length 行
      try { conn.term.scrollToLine(topRowBefore + lines.length); } catch(e) {}
    } else {
      conn.hasMore = false;
    }
  } catch(e) {} finally {
    conn.loadingMore = false;
  }
}

function closeConnection(portId) {
  fetch('/api/disconnect', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({port_id: portId})});
  const conn = connections[portId];
  if (conn) {
    if (conn.sse) conn.sse.close();
    if (conn.term) { try { conn.term.dispose(); } catch(e){} }
    conn.tab.remove();
    conn.wrap.remove();
    delete connections[portId];
  }
  // 切换到第一个可用标签（复用全局 sortKeyFn）
  const remaining = Object.keys(connections).sort((a, b) => {
    const ka = sortKeyFn(a), kb = sortKeyFn(b);
    return ka[0] !== kb[0] ? ka[0] - kb[0] : (ka[1] < kb[1] ? -1 : ka[1] > kb[1] ? 1 : 0);
  });
  if (remaining.length) {
    switchTab(remaining[0]);
  } else {
    activePortId = null;
    termArea.innerHTML = '<div class="empty-state"><div class="big-icon">📡</div><div class="title">暂无连接</div><div class="desc">点击顶部「新建连接」选择串口或 SSH，支持同时监控多个连接。每个连接独立标签页，互不干扰。</div></div>';
  }
  refreshSidebar();
  refreshGlobalStatus();
}

function refreshSidebar() {
  const ids = Object.keys(connections);
  $('portCount').textContent = ids.length;
  if (!ids.length) {
    portList.innerHTML = '<div class="empty-state" style="padding:30px 10px;"><div class="desc">点击「新建连接」添加连接</div></div>';
    return;
  }
  portList.innerHTML = '';
  // 排序：串口[0] < SSH[1] < 日志[2]（sortKeyFn 全局定义，closeConnection/closeLogViewer 复用）
  ids.sort((a, b) => {
    const ka = sortKeyFn(a), kb = sortKeyFn(b);
    return ka[0] !== kb[0] ? ka[0] - kb[0] : (ka[1] < kb[1] ? -1 : ka[1] > kb[1] ? 1 : 0);
  });
  ids.forEach(pid => {
    const conn = connections[pid];
    const item = document.createElement('div');
    item.className = 'port-item connected' + (pid === activePortId ? ' active' : '');
    item.dataset.portId = pid;
    const isSSH = conn.meta.kind === 'ssh';
    const isLog = conn.meta.kind === 'log';
    const descText = isSSH ? `SSH · ${conn.meta.host || ''}` : isLog ? `📜 日志` : `${conn.meta.baud || ''} baud`;
    const rowCount = conn.term ? conn.term.buffer.active.length : (conn.logState ? conn.logState.total : 0);
    item.innerHTML = `
      <span class="led"></span>
      <div class="info">
        <div class="name">${esc(conn.meta.label || pid)}</div>
        <div class="desc">${esc(descText)} · <span class="baud">${rowCount} 行</span></div>
      </div>
      <div class="actions"><button data-close="${pid}" title="${isLog ? '关闭' : '断开'}">✕</button></div>
    `;
    item.onclick = (e) => {
      if (e.target.dataset.close) { e.stopPropagation(); (isLog ? closeLogViewer(pid) : closeConnection(pid)); return; }
      switchTab(pid);
    };
    portList.appendChild(item);
  });
  // 标签栏同序重排（复用全局 sortKeyFn）
  const tabEls = Array.from(tabs.querySelectorAll('.tab'));
  tabEls.sort((a, b) => {
    const ka = sortKeyFn(a.dataset.portId), kb = sortKeyFn(b.dataset.portId);
    return ka[0] !== kb[0] ? ka[0] - kb[0] : (ka[1] < kb[1] ? -1 : ka[1] > kb[1] ? 1 : 0);
  });
  const actions = tabs.querySelector('.tab-bar-actions');
  tabEls.forEach(t => tabs.insertBefore(t, actions));
}

// ============================================================
let replayData = null, replayTimer = null, replayIdx = 0, replayStartTs = 0, replayBaseReal = 0;
async function openReplay(name) {
  const panel = $('replayPanel');
  $('replayTitle').textContent = '回放：' + name;
  const r = await fetch('/api/replay/' + encodeURIComponent(name));
  const j = await r.json();
  replayData = j.lines || [];
  replayIdx = 0;
  $('replayBody').innerHTML = '';
  if (!replayData.length) { $('replayInfo').textContent = '空'; panel.classList.add('show'); return; }
  const first = replayData[0].ts, last = replayData[replayData.length-1].ts;
  const dur = (last - first)/1000;
  $('replayTotal').textContent = fmtDur(dur);
  $('replayInfo').textContent = `${replayData.length} 行 · 时长 ${fmtDur(dur)}`;
  $('replaySeek').max = Math.max(1, Math.floor(dur));
  panel.classList.add('show');
  playReplay();
}
function fmtDur(s){ const m=Math.floor(s/60), ss=Math.floor(s%60); return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0'); }
function renderReplayLine(item) {
  const body = $('replayBody');
  const div = document.createElement('div');
  div.className = 'line tag-' + (item.tag||'text');
  const ts = document.createElement('span'); ts.className='ts'; ts.textContent = item.ts?fmtTs(item.ts):'';
  div.appendChild(ts);
  div.appendChild(document.createTextNode(item.text));
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
}
function playReplay() {
  if (!replayData || replayTimer) return;
  const speed = parseFloat($('replaySpeed').value)||1;
  replayStartTs = replayData[replayIdx]?.ts || 0;
  replayBaseReal = Date.now();
  const tick = () => {
    if (replayIdx >= replayData.length) { stopReplay(); return; }
    const now = Date.now();
    const elapsed = (now - replayBaseReal) * speed;
    const cur = replayStartTs + elapsed;
    while (replayIdx < replayData.length && replayData[replayIdx].ts <= cur) {
      renderReplayLine(replayData[replayIdx]); replayIdx++;
    }
    $('replaySeek').value = Math.floor((cur - replayData[0].ts)/1000);
    $('replayTime').textContent = fmtDur((cur - replayData[0].ts)/1000);
    replayTimer = requestAnimationFrame(tick);
  };
  replayTimer = requestAnimationFrame(tick);
}
function stopReplay() { if (replayTimer) { cancelAnimationFrame(replayTimer); replayTimer = null; } }
$('btnReplayPlay').onclick = playReplay;
$('btnReplayPause').onclick = stopReplay;
$('btnReplayClose').onclick = () => { stopReplay(); $('replayPanel').classList.remove('show'); };
$('replaySpeed').onchange = () => { stopReplay(); playReplay(); };
$('replaySeek').oninput = function() {
  stopReplay();
  const v = parseInt(this.value);
  if (!replayData.length) return;
  const target = replayData[0].ts + v*1000;
  replayIdx = 0;
  $('replayBody').innerHTML = '';
  while (replayIdx < replayData.length && replayData[replayIdx].ts < target) {
    renderReplayLine(replayData[replayIdx]); replayIdx++;
  }
  $('replayTime').textContent = fmtDur(v);
};

// ---- 搜索（v0.3.0：用 xterm SearchAddon + decoration 高亮） ----
let searchState = { q: '', idx: -1, total: 0 };
const SEARCH_DECOR = {
  matchBackground: 'rgba(255,214,102,0.35)',
  matchOverviewRuler: '#ff9d00',
  activeMatchBackground: 'rgba(0,212,255,0.45)',
  activeMatchColor: '#ffffff',
};
function clearSearchHighlights() {
  // 清掉搜索 decoration（带 class 的）
  if (activePortId && connections[activePortId] && connections[activePortId].search) {
    try { connections[activePortId].search.clearDecorations(); } catch(e){}
  }
  searchState.idx = -1;
  searchState.total = 0;
  $('searchCount').textContent = '';
}
function applySearchHighlights(q) {
  clearSearchHighlights();
  if (!q || !activePortId) return;
  const conn = connections[activePortId];
  if (!conn || !conn.term || !conn.search) return;
  // 统计总数：遍历 buffer 行匹配（与 search addon 的大小写设置一致）
  let total = 0;
  const buf = conn.term.buffer.active;
  const low = q.toLowerCase();
  for (let r = 0; r < buf.length; r++) {
    const ln = buf.getLine(r);
    if (!ln) continue;
    const t = ln.translateToString(true).toLowerCase();
    let pos = 0;
    while ((pos = t.indexOf(low, pos)) !== -1) { total++; pos += low.length; }
  }
  searchState.total = total;
  searchState.idx = total ? 1 : -1;
  $('searchCount').textContent = total ? (total + ' 处') : '无';
  if (!total) return;
  // findNext 会用 SEARCH_DECOR 高亮所有匹配，并定位到第一个
  conn.search.findNext(q, {
    caseSensitive: false, wholeWord: false, incremental: false,
    decorations: SEARCH_DECOR,
  });
}
function gotoSearchMark(idx) {
  if (!activePortId) return;
  const conn = connections[activePortId];
  if (!conn || !conn.search) return;
  const q = searchState.q;
  if (!q) return;
  const opts = { caseSensitive: false, wholeWord: false, incremental: false, decorations: SEARCH_DECOR };
  if (idx < 0) {
    conn.search.findPrevious(q, opts);
    if (searchState.idx > 1) searchState.idx--;
    else searchState.idx = searchState.total;
  } else {
    conn.search.findNext(q, opts);
    if (searchState.idx < searchState.total) searchState.idx++;
    else searchState.idx = 1;
  }
  $('searchCount').textContent = searchState.total ? (searchState.idx + '/' + searchState.total) : '无';
}
$('searchInput').addEventListener('input', (e) => {
  const q = e.target.value.trim();
  searchState.q = q;
  if (q) applySearchHighlights(q); else clearSearchHighlights();
});
$('searchInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    if (e.shiftKey) gotoSearchMark(-1);
    else gotoSearchMark(1);
  }
});
$('searchPrev').onclick = () => gotoSearchMark(-1);
$('searchNext').onclick = () => gotoSearchMark(1);

let senseState = { lines: [], filter: 'ALL' };
function connectAiSSE() {
  aiSse = new EventSource('/api/ai/stream');
  aiSse.onmessage = (e) => {
    try {
      const item = JSON.parse(e.data);
      if (item.kind) return; // 跳过 screen/screenctl 帧（不进感知流）
      senseState.lines.push(item);
      if (senseState.lines.length > 200) senseState.lines.shift();
      renderSense();
    } catch(err) {}
  };
  aiSse.onerror = () => {
    aiSse.close();
    setTimeout(connectAiSSE, 2000);
  };
}
function kwClassOf(text) {
  const t = text.toLowerCase();
  if (/\b(error|fail|panic|fatal|denied|refused|abort|crash|oom|killed)\b/.test(t)) return 'kw-error';
  if (/\b(warn|warning|deprecated|timeout|retry|overflow)\b/.test(t)) return 'kw-warning';
  if (/\b(info|notice|starting|started|stopped|detected|ready)\b/.test(t)) return 'kw-info';
  return '';
}
function renderSense() {
  const list = $('senseList');
  const filter = senseState.filter;
  // 端口筛选 chip
  const ports = ['ALL', ...new Set(senseState.lines.map(l => l.port))];
  const filterEl = $('senseFilter');
  filterEl.innerHTML = ports.map(p =>
    `<span class="chip ${p === filter ? 'active' : ''}" data-port="${esc(p)}">${esc(p === 'ALL' ? '全部' : p)}</span>`
  ).join('');
  filterEl.querySelectorAll('.chip').forEach(c => c.onclick = () => { senseState.filter = c.dataset.port; renderSense(); });
  // 行
  let shown = senseState.lines;
  if (filter !== 'ALL') shown = shown.filter(l => l.port === filter);
  const recent = shown.slice(-50);
  list.innerHTML = recent.map(it => {
    const kc = kwClassOf(it.text || '');
    return `<div class="sense-line ${kc}" data-port="${esc(it.port)}"><span class="port-tag">[${esc(it.port)}]</span>${esc((it.text || '').slice(0, 200))}</div>`;
  }).join('');
  list.scrollTop = list.scrollHeight;
  // 点击行跳转到该串口标签
  list.querySelectorAll('.sense-line').forEach(el => el.onclick = () => {
    const pid = el.dataset.port;
    if (connections[pid]) switchTab(pid);
  });
}

// 4 类关键字正则
const ANALYZE_RE = {
  error:   /\b(error|fail|panic|fatal|denied|refused|abort|crash|oom|killed|segmentation fault|kernel panic|out of memory|call trace|page fault)\b/i,
  warning: /\b(warn|warning|deprecated|timeout|retry|overflow|hung|deadlock|corrupt|not found|not supported|invalid)\b/i,
  info:    /\b(info|notice|starting|started|stopped|detected|ready|linux version|systemd|mounting|booting|link is up|link is down)\b/i,
  success: /\b(success|succeed|succeeded|ok|done|complete|completed|passed)\b/i,
};
const ANALYZE_LABEL = { error: 'ERROR', warning: 'WARNING', info: 'INFO', success: 'SUCCESS' };

// 点击条目 → 跳到主终端对应行并高亮
// searchText 优先：在当前 buffer 重新搜索定位，避免行号因 reflow/resize 漂移导致跳错
function jumpToLine(rowIdx, searchText) {
  if (!activePortId) return;
  const conn = connections[activePortId];
  if (!conn || !conn.term) return;
  try {
    const buf = conn.term.buffer.active;
    let target = rowIdx;
    // 用文本重搜：行号可能因 reflow/resize/新数据流入而漂移，按内容定位最可靠
    if (searchText) {
      const needle = searchText.trim();
      const pref = needle.slice(0, Math.min(40, needle.length));
      // 从 rowIdx 起向上找最近的匹配行（漂移通常是小幅度，原行就在附近）
      // 若向上没找到，再从 rowIdx 向下找
      let found = -1;
      const match = (t) => t === needle || (t && pref && t.startsWith(pref));
      for (let r = Math.min(rowIdx, buf.length - 1); r >= 0; r--) {
        const ln = buf.getLine(r);
        if (!ln) continue;
        if (match(ln.translateToString(true).trim())) { found = r; break; }
      }
      if (found < 0) {
        for (let r = rowIdx + 1; r < buf.length; r++) {
          const ln = buf.getLine(r);
          if (!ln) continue;
          if (match(ln.translateToString(true).trim())) { found = r; break; }
        }
      }
      if (found >= 0) target = found;
    }
    // 边界保护
    target = Math.max(0, Math.min(target, buf.length - 1));
    // scrollToLine 把目标行滚到视图顶部
    conn.term.scrollToLine(target);
    conn.term.focus();
    // select 选中整行（蓝底高亮，xterm 内置最稳定）
    conn.term.select(0, target, conn.term.cols);
    // registerDecoration 加醒目背景（6 位 hex，不带 alpha）
    if (conn.term.registerDecoration) {
      const offset = Math.round(target - buf.ybase - buf.y);
      const dec = conn.term.registerDecoration({
        marker: conn.term.registerMarker(offset),
        x: 0,
        width: conn.term.cols,
        backgroundColor: '#00d4ff',
        layer: 'top',
      });
      if (dec) setTimeout(() => { try { dec.dispose(); } catch(e){} }, 2500);
    }
  } catch(e) {}
}

// 点击统计卡片 → 在下方列表显示该类别最近条目
function showAnalyzeList(kw) {
  if (!activePortId) return;
  const conn = connections[activePortId];
  if (!conn || !conn.term) return;
  const re = ANALYZE_RE[kw];
  if (!re) return;
  const buf = conn.term.buffer.active;
  const items = [];
  for (let r = 0; r < buf.length; r++) {
    const ln = buf.getLine(r);
    if (!ln) continue;
    const t = ln.translateToString(true);
    if (re.test(t)) items.push({ row: r, text: t.trim().slice(0, 100) });
  }
  $('analyzeListTitle').textContent = `最近 ${ANALYZE_LABEL[kw]}（${items.length} 条）`;
  const cl = $('clusterList');
  if (!items.length) {
    cl.innerHTML = `<div class="cmd-empty">无 ${ANALYZE_LABEL[kw]} 条目</div>`;
    return;
  }
  // 最近的在前（取最后 30 条倒序）
  const recent = items.slice(-30).reverse();
  cl.innerHTML = recent.map((it, i) =>
    `<div class="cluster-item" data-idx="${i}" title="${esc(it.text)}">${esc(it.text)}</div>`
  ).join('');
  // 点击条目 → 跳到对应行并选中高亮
  cl.querySelectorAll('.cluster-item').forEach((el, i) => {
    el.onclick = () => jumpToLine(recent[i].row, recent[i].text);
  });
}

function renderAnalyze() {
  if (!activePortId) { $('statCards').innerHTML = '<div class="cmd-empty">无活动连接</div>'; return; }
  const conn = connections[activePortId];
  if (!conn || !conn.term) return;
  // 统计已加载行（从 xterm buffer 读取）
  const lines = [];
  const buf = conn.term.buffer.active;
  for (let r = 0; r < buf.length; r++) {
    const ln = buf.getLine(r);
    if (ln) lines.push(ln.translateToString(true));
  }
  let err = 0, warn = 0, info = 0, ok = 0;
  for (const t of lines) {
    const low = t.toLowerCase();
    if (ANALYZE_RE.error.test(low)) err++;
    if (ANALYZE_RE.warning.test(low)) warn++;
    if (ANALYZE_RE.info.test(low)) info++;
    if (ANALYZE_RE.success.test(low)) ok++;
  }
  $('statCards').innerHTML = `
    <div class="stat-card err" data-kw="error" style="cursor:pointer" title="点击查看最近 ERROR 条目">
      <div class="label">ERROR</div><div class="value">${err}</div></div>
    <div class="stat-card warn" data-kw="warning" style="cursor:pointer" title="点击查看最近 WARNING 条目">
      <div class="label">WARNING</div><div class="value">${warn}</div></div>
    <div class="stat-card info" data-kw="info" style="cursor:pointer" title="点击查看最近 INFO 条目">
      <div class="label">INFO</div><div class="value">${info}</div></div>
    <div class="stat-card ok" data-kw="success" style="cursor:pointer" title="点击查看最近 SUCCESS 条目">
      <div class="label">SUCCESS</div><div class="value">${ok}</div></div>
  `;
  // 点击统计卡片 → 下方列表显示该类别最近条目（不弹 banner）
  $('statCards').querySelectorAll('.stat-card').forEach(card => {
    card.onclick = () => showAnalyzeList(card.dataset.kw);
  });
}

let _cmdLibCache = null;
async function loadCmdLib() {
  if (_cmdLibCache) return _cmdLibCache;
  try {
    const r = await fetch('/api/cmd_lib');

}
async function saveCmdLib(lib) {
  _cmdLibCache = lib;
  try {
    await fetch('/api/cmd_lib', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ lib })
    });
  } catch (e) {}

async function renderCmdPane() {

    libEl.querySelectorAll('.del').forEach(b => b.onclick = async () => {

  // 最近命令
  if (activePortId) {
    fetch('/api/history?port_id=' + encodeURIComponent(activePortId))

        rec.innerHTML = hist.slice(-15).reverse().map(c =>
          `<div class="cmd-item"><span class="text" title="${esc(c)}">${esc(c)}</span><button class="run" data-cmd="${esc(c)}">重发</button></div>`
        ).join('');
        rec.querySelectorAll('.run').forEach(b => b.onclick = () => sendCmd(b.dataset.cmd));
      }).catch(() => {});
  } else {
    $('cmdRecent').innerHTML = '<div class="cmd-empty">无活动连接</div>';
  }

// 复用 connections[port_id] 模型，kind='log'。每个日志 tab 独立 logState（替代旧全局 histState）。
// 虚拟列表算法不变：inner 钳制 MAX_SCROLL_H 突破 Chrome 33.5M 上限，viewport 跟随 scrollTop 平移。
const HIST_ROW_H = 18;

// 拖拽日志文件到窗口任意位置打开（含超大文件，走 G 级虚拟列表）
let _dragOverlay = null;
let _dragCounter = 0;
function showDragOverlay(show) {
  if (show && !_dragOverlay) {
    _dragOverlay = document.createElement('div');
    _dragOverlay.id = 'dragOverlay';
    _dragOverlay.textContent = '📄 松开以打开日志';
    document.body.appendChild(_dragOverlay);
  } else if (!show && _dragOverlay) {
    _dragOverlay.remove(); _dragOverlay = null;
  }
}
document.body.addEventListener('dragenter', e => {
  e.preventDefault();
  if (e.dataTransfer && e.dataTransfer.types && e.dataTransfer.types.includes('Files')) {
    _dragCounter++; showDragOverlay(true);
  }
});
document.body.addEventListener('dragover', e => { e.preventDefault(); });
document.body.addEventListener('dragleave', e => {
  e.preventDefault();
  _dragCounter--;
  if (_dragCounter <= 0) { _dragCounter = 0; showDragOverlay(false); }
});
document.body.addEventListener('drop', e => {
  e.preventDefault();
  _dragCounter = 0; showDragOverlay(false);
  if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
  const f = e.dataTransfer.files[0];
  const path = f.path || f.webkitRelativePath || null;
  if (path) {
    buildLogViewer(path);
  } else {
    const hint = f.name ? `检测到文件「${f.name}」，但当前 WebView 未暴露绝对路径。\n请用「📁打开」按钮输入完整路径。` : '当前 WebView 未暴露文件路径，请用「📁打开」按钮输入路径';

  }
});

// 构建日志查看 tab（类似 buildTerminal，但用虚拟列表替代 xterm）
function buildLogViewer(path) {
  const name = path.split(/[\\\/]/).pop();
  const portId = 'log:' + name + ':' + Date.now();
  // 若已打开同名日志，切过去
  for (const pid in connections) {
    if (connections[pid].meta && connections[pid].meta.kind === 'log' && connections[pid].meta.path === path) {
      switchTab(pid); return;
    }
  }
  // 建 tab
  const tab = document.createElement('div');
  tab.className = 'tab';
  tab.dataset.portId = portId;
  tab.innerHTML = `<span class="led" style="color:var(--accent)">📜</span><span class="label">${esc(name)}</span><span class="baud"></span><span class="close" title="关闭">✕</span>`;
  tab.onclick = (e) => { if (e.target.classList.contains('close')) { e.stopPropagation(); closeLogViewer(portId); return; } switchTab(portId); };
  // 建 wrap（.term-area，内含日志查看器）
  const wrap = document.createElement('div');
  wrap.className = 'term-area';
  wrap.dataset.portId = portId;
  wrap.style.display = 'none';
  wrap.innerHTML = `
    <div class="log-viewer">
      <div class="log-viewer-top">
        <div class="vlist"><div class="vlist-inner"></div></div>
      </div>
      <div class="log-search-splitter"></div>
      <div class="log-search-pane" style="display:none">
        <div class="log-search-head">
          <input type="text" class="log-search-input" placeholder="查找关键字…" autocomplete="off">
          <button class="btn ghost log-search-btn">查找全部</button>
          <span class="log-search-count"></span>
          <button class="btn ghost log-search-collapse" title="折叠分栏">▾</button>
        </div>
        <div class="log-search-results"></div>
      </div>
      <div class="log-viewer-status">正在索引…</div>
    </div>`;
  // 移除 empty-state，插 tab + wrap
  const es = termArea.querySelector('.empty-state');
  if (es) es.remove();
  tabs.appendChild(tab);
  termArea.appendChild(wrap);
  // conn 对象
  const conn = {
    meta: { kind: 'log', label: name, path },
    tab, wrap,
    vlist: wrap.querySelector('.vlist'),
    vlistInner: wrap.querySelector('.vlist-inner'),
    statusEl: wrap.querySelector('.log-viewer-status'),
    searchPane: wrap.querySelector('.log-search-pane'),
    searchInput: wrap.querySelector('.log-search-input'),
    searchResults: wrap.querySelector('.log-search-results'),
    searchCount: wrap.querySelector('.log-search-count'),
    logState: {
      name: path, total: 0, scaled: false, rows: new Map(),
      renderedStart: -1, renderedEnd: -1, renderSeq: 0,
      searchQ: '', searchResults: [], searchIdx: 0,
    },
  };
  connections[portId] = conn;
  // 滚动事件（节流，绑定到本 conn 的 vlist）
  let scrollTimer = null;
  conn.vlist.addEventListener('scroll', () => {
    if (scrollTimer) return;
    scrollTimer = setTimeout(() => { scrollTimer = null; renderLogSlice(conn); }, 50);
  });
  // 查找分栏：拖分隔条调高度
  initLogSplitter(conn);
  // 查找全部按钮
  wrap.querySelector('.log-search-btn').onclick = () => doLogSearch(conn);
  wrap.querySelector('.log-search-input').addEventListener('keydown', e => { if (e.key === 'Enter') doLogSearch(conn); });
  wrap.querySelector('.log-search-collapse').onclick = () => toggleLogSearchPane(conn, false);
  // 加载日志
  openLogInViewer(conn);
  switchTab(portId);
  refreshSidebar();
}

// 打开日志：建索引 + 初始化虚拟列表
async function openLogInViewer(conn) {
  const ls = conn.logState;
  ls.rows = new Map();

  conn.searchInput.value = '';

  conn.statusEl.textContent = '正在索引…';
  try {
    const r = await fetch('/api/log_count?name=' + encodeURIComponent(ls.name));
    const j = await r.json();
    if (!j.ok) { conn.statusEl.textContent = '错误：' + (j.err || ''); return; }
    ls.total = j.total;
    const naturalH = ls.total * HIST_ROW_H;
    ls.scaled = naturalH > MAX_SCROLL_H;
    conn.vlistInner.innerHTML = '';
    conn.vlistInner.style.height = Math.min(naturalH, MAX_SCROLL_H) + 'px';
    conn.statusEl.textContent = `共 ${ls.total.toLocaleString()} 行` + (ls.scaled ? ' · 缩放模式' : '');
    renderLogSlice(conn);
  } catch(e) { conn.statusEl.textContent = '加载失败：' + e; }
}

// scrollTop → 行号（缩放末页可达映射）
function logScrollToRow(conn, scrollTop) {
  const ls = conn.logState;
  if (!ls.scaled) return Math.floor(scrollTop / HIST_ROW_H);
  const innerH = Math.min(ls.total * HIST_ROW_H, MAX_SCROLL_H);
  const viewH = conn.vlist.clientHeight;
  const maxScroll = innerH - viewH;
  const maxRow = Math.max(0, ls.total - Math.ceil(viewH / HIST_ROW_H));
  if (maxScroll <= 0) return 0;
  return Math.min(maxRow, Math.floor(scrollTop / maxScroll * maxRow));
}
// 行号 → scrollTop
function logRowToScroll(conn, row) {
  const ls = conn.logState;
  if (!ls.scaled) return row * HIST_ROW_H;
  const innerH = Math.min(ls.total * HIST_ROW_H, MAX_SCROLL_H);
  const viewH = conn.vlist.clientHeight;
  const maxScroll = innerH - viewH;
  const maxRow = Math.max(0, ls.total - Math.ceil(viewH / HIST_ROW_H));
  if (maxRow <= 0) return 0;
  return Math.floor(row / maxRow * maxScroll);
}

// 确保区间已加载
async function ensureLogRange(conn, start, end) {
  const ls = conn.logState;
  start = Math.max(0, start); end = Math.min(ls.total, end);
  const missing = [];
  let i = start;
  while (i < end) {
    if (ls.rows.has(i)) { i++; continue; }
    let j = i;
    while (j < end && !ls.rows.has(j)) j++;
    missing.push([i, j]); i = j;
  }
  const fetches = [];
  for (const [s, e] of missing) {
    for (let k = s; k < e; k += HIST_PAGE) {
      const off = k, lim = Math.min(HIST_PAGE, e - k);
      fetches.push(
        fetch('/api/log_page?name=' + encodeURIComponent(ls.name) + '&offset=' + off + '&limit=' + lim)
          .then(r => r.json()).then(j => {
            if (j.ok) (j.lines || []).forEach((l, idx) => ls.rows.set(off + idx, l));
          }).catch(() => {})
      );
    }
  }
  if (fetches.length) await Promise.all(fetches);
}

// 渲染可视区切片
async function renderLogSlice(conn) {
  const ls = conn.logState;
  if (!ls.name || !ls.total) return;
  const vlist = conn.vlist, inner = conn.vlistInner;
  const scrollTop = vlist.scrollTop;
  const viewH = vlist.clientHeight;
  const startRow = Math.max(0, logScrollToRow(conn, scrollTop));
  const viewportRows = Math.ceil(viewH / HIST_ROW_H);
  const renderStart = startRow;
  const endRow = Math.min(ls.total, startRow + viewportRows + HIST_BUF);
  if (renderStart === ls.renderedStart && endRow === ls.renderedEnd) return;
  const mySeq = ++ls.renderSeq;
  await ensureLogRange(conn, renderStart, endRow);
  if (mySeq !== ls.renderSeq) return;
  let vp = inner.querySelector('.vlist-viewport');
  if (!vp) { vp = document.createElement('div'); vp.className = 'vlist-viewport'; inner.appendChild(vp); }
  vp.style.top = scrollTop + 'px';
  let html = '';
  for (let r = renderStart; r < endRow; r++) {
    const l = ls.rows.get(r);
    if (!l) continue;
    const top = (r - renderStart) * HIST_ROW_H;
    const kc = l.tag === 'error' ? 'kw-error' : l.tag === 'warning' ? 'kw-warning' : (l.tag === 'info' || l.tag === 'comment') ? 'kw-info' : '';
    const text = esc(l.text || '');
    html += `<div class="hline ${kc}" style="top:${top}px" data-row="${r}" title="${text}"><span class="hrow">${r}</span><span class="htag">${esc(l.tag||'')}</span>${text}</div>`;
  }
  vp.innerHTML = html;
  ls.renderedStart = renderStart; ls.renderedEnd = endRow;
  if (ls.rows.size > HIST_CACHE_MAX) {
    const keepFrom = renderStart - HIST_CACHE_MAX / 2, keepTo = endRow + HIST_CACHE_MAX / 2;
    for (const k of ls.rows.keys()) { if (k < keepFrom || k > keepTo) ls.rows.delete(k); }
  }
  conn.statusEl.textContent = `共 ${ls.total.toLocaleString()} 行 · 显示 ${renderStart}-${endRow-1}` + (ls.scaled ? ' · 缩放' : '');
}

// 跳到日志某行（居中）
function jumpToLogRow(conn, row) {
  const ls = conn.logState;
  const innerH = Math.min(ls.total * HIST_ROW_H, MAX_SCROLL_H);
  const viewH = conn.vlist.clientHeight;
  const viewportRows = Math.ceil(viewH / HIST_ROW_H);
  const startRow = Math.max(0, Math.min(ls.total - viewportRows, row - Math.floor(viewportRows / 2)));
  conn.vlist.scrollTop = Math.max(0, Math.min(innerH - viewH, logRowToScroll(conn, startRow)));
  ls.renderedStart = -1; ls.renderedEnd = -1;
  renderLogSlice(conn);
}

// 查找全部 → 底部分栏列命中行
async function doLogSearch(conn) {
  const q = conn.searchInput.value.trim();
  const ls = conn.logState;
  if (!q || !ls.name) return;
  // 已有结果且查询未变 → 跳转下一个
  if (ls.searchResults.length && ls.searchQ === q) {
    ls.searchIdx = (ls.searchIdx + 1) % ls.searchResults.length;
    jumpToLogRow(conn, ls.searchResults[ls.searchIdx]);
    highlightLogSearchResult(conn, ls.searchIdx);
    return;
  }
  toggleLogSearchPane(conn, true);
  conn.searchCount.textContent = '搜索中…';
  try {
    const r = await fetch('/api/log_search?name=' + encodeURIComponent(ls.name) + '&q=' + encodeURIComponent(q) + '&limit=500');
    const j = await r.json();
    if (!j.ok) { conn.searchCount.textContent = '失败：' + (j.err || ''); return; }
    ls.searchResults = (j.lines || []).map(l => l.row);
    ls.searchQ = q; ls.searchIdx = 0;
    // 渲染命中行列表
    conn.searchResults.innerHTML = (j.lines || []).map((l, idx) => {
      const kc = l.tag === 'error' ? 'kw-error' : l.tag === 'warning' ? 'kw-warning' : (l.tag === 'info' || l.tag === 'comment') ? 'kw-info' : '';
      const text = esc(l.text || '');
      return `<div class="hline ${kc}" data-row="${l.row}" data-idx="${idx}" title="${text}"><span class="hrow">${l.row}</span><span class="htag">${esc(l.tag||'')}</span>${text}</div>`;
    }).join('');
    conn.searchResults.querySelectorAll('.hline').forEach(el => {
      el.onclick = () => {
        const idx = +el.dataset.idx;
        ls.searchIdx = idx;
        jumpToLogRow(conn, +el.dataset.row);
        highlightLogSearchResult(conn, idx);
      };
    });
    conn.searchCount.textContent = `命中 ${ls.searchResults.length} 处`;
    if (ls.searchResults.length) { jumpToLogRow(conn, ls.searchResults[0]); highlightLogSearchResult(conn, 0); }
  } catch(e) { conn.searchCount.textContent = '失败：' + e; }
}
function highlightLogSearchResult(conn, idx) {
  conn.searchResults.querySelectorAll('.hline').forEach((el, i) => el.classList.toggle('active', i === idx));
}
function toggleLogSearchPane(conn, show) {
  conn.searchPane.style.display = show ? 'flex' : 'none';
  conn.wrap.querySelector('.log-search-splitter').style.display = show ? 'block' : 'none';
  if (show) { conn.searchInput.focus(); }
}

// 拖分隔条调分栏高度
function initLogSplitter(conn) {
  const splitter = conn.wrap.querySelector('.log-search-splitter');
  const pane = conn.searchPane;
  const top = conn.wrap.querySelector('.log-viewer-top');
  let dragging = false, startY = 0, startH = 0;
  splitter.addEventListener('mousedown', e => {
    dragging = true; startY = e.clientY; startH = pane.offsetHeight;
    document.body.style.cursor = 'row-resize'; e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const dh = e.clientY - startY;
    const newH = Math.max(60, Math.min(startH - dh, conn.wrap.clientHeight - 100));
    pane.style.height = newH + 'px';
    top.style.flex = '1';
  });
  document.addEventListener('mouseup', () => {
    if (dragging) { dragging = false; document.body.style.cursor = ''; renderLogSlice(conn); }
  });
}

// 关闭日志 tab
function closeLogViewer(portId) {
  const conn = connections[portId];
  if (conn) { conn.tab.remove(); conn.wrap.remove(); delete connections[portId]; }
  const remaining = Object.keys(connections).sort(sortKeyFn);
  if (remaining.length) switchTab(remaining[0]);
  else {
    activePortId = null;
    termArea.innerHTML = '<div class="empty-state"><div class="big-icon">📡</div><div class="title">暂无连接</div><div class="desc">点击顶部「新建连接」选择串口或 SSH，支持同时监控多个连接。每个连接独立标签页，互不干扰。</div></div>';
  }
  refreshSidebar();
  refreshGlobalStatus();
}

// ============================================================
// 初始化
// ============================================================
loadPorts();
refreshGlobalStatus();
connectAiSSE();
setInterval(refreshGlobalStatus, 3000);
setInterval(() => { if (activePortId) refreshSidebar(); }, 5000);
setInterval(() => {
  // 感知面板可见时刷新分析（用户停在分析标签）
  const activePane = document.querySelector('.panel-tab.active');
  if (activePane && activePane.dataset.pane === 'analyze') renderAnalyze();
}, 5000);
</script>
