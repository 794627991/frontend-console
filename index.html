<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>终端控制台 Pro</title>
<style>
  :root {
    --bg-deep: #050810;
    --bg: #0a0f1c;
    --bg-panel: #0d1424;
    --bg-card: #111a2e;
    --bg-input: #0a1120;
    --border: #1a2942;
    --border-glow: #2a4a7a;
    --fg: #c8d6e8;
    --fg-bright: #e8f1ff;
    --muted: #5a6b85;
    --accent: #00d4ff;
    --accent-2: #0099cc;
    --accent-glow: rgba(0, 212, 255, 0.4);
    --neon-green: #00ff9d;
    --neon-purple: #b366ff;
    --neon-orange: #ff9d00;
    --neon-red: #ff4060;
    --kernel: #79c0ff;
    --kernel-err: #ff7b72;
    --uboot: #d2a8ff;
    --heop: #a5d6ff;
    --heop-ok: #56d364;
    --heop-fail: #ff7b72;
    --prompt: #00ff9d;
    --text: #c8d6e8;
    --input-c: #00d4ff;
    --shadow-glow: 0 0 20px rgba(0, 212, 255, 0.15);
    --font-mono: "Cascadia Code", "JetBrains Mono", "Consolas", "Menlo", monospace;
    --font-ui: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg-deep);
    color: var(--fg);
    font-family: var(--font-ui);
    font-size: 13px;
    display: flex;
    flex-direction: column;
  }
  /* 科技风背景网格 */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: "";
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at top, rgba(0, 212, 255, 0.06), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* ===== 顶栏 ===== */
  .topbar {
    position: relative; z-index: 10;
    display: flex; align-items: center; gap: 14px;
    padding: 0 18px; height: 52px;
    background: linear-gradient(180deg, var(--bg-panel), var(--bg));
    border-bottom: 1px solid var(--border);
    box-shadow: 0 2px 20px rgba(0,0,0,0.4);
    flex-shrink: 0;
  }
  .logo {
    display: flex; align-items: center; gap: 10px;
    font-weight: 700; font-size: 15px; color: var(--fg-bright);
    letter-spacing: 0.5px;
  }
  .logo .icon {
    width: 28px; height: 28px; border-radius: 7px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; line-height: 1;
    box-shadow: 0 0 12px var(--accent-glow);
  }
  .logo .ver { color: var(--accent); font-size: 11px; font-weight: 600; }
  /* 拖拽日志遮罩 */
  #dragOverlay {
    position: fixed; inset: 0; z-index: 9999;
    background: rgba(0, 20, 40, 0.75);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 600; color: var(--accent);
    border: 3px dashed var(--accent);
    pointer-events: none;
    backdrop-filter: blur(2px);
  }
  /* 日志查看 tab */
  .log-viewer { display: flex; flex-direction: column; width: 100%; height: 100%; position: relative; }
  .log-viewer-top { flex: 1; display: flex; min-height: 0; }
  .log-viewer-top .vlist { flex: 1; }
  .log-search-splitter { height: 5px; background: var(--border); cursor: row-resize; flex-shrink: 0; display: none; }
  .log-search-splitter:hover { background: var(--accent); }
  .log-search-pane { display: none; flex-direction: column; height: 35%; min-height: 80px; max-height: 70%; background: var(--bg-card); border-top: 1px solid var(--border); flex-shrink: 0; }
  .log-search-head { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .log-search-head input { flex: 1; background: var(--bg-input); border: 1px solid var(--border); color: var(--fg); border-radius: 4px; padding: 4px 8px; font-size: 12px; }
  .log-search-count { color: var(--muted); font-size: 11px; min-width: 60px; }
  .log-search-results { flex: 1; overflow-y: auto; position: relative; background: var(--bg-input); min-height: 40px; }
  .log-search-results .hline { cursor: pointer; }
  .log-search-results .hline.active { background: var(--accent); color: #001020; }
  .log-search-results .hline.active .hrow, .log-search-results .hline.active .htag { color: #001020; }
  /* 搜索结果区的 hline 用流式定位（主虚拟列表用 absolute+top，这里覆盖成 static） */
  .log-search-results .hline { position: static; height: auto; line-height: 1.5; padding: 2px 6px; white-space: pre-wrap; word-break: break-all; }
  .log-search-results .hline:hover { background: var(--bg-card); }
  .log-viewer-toolbar { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-bottom: 1px solid var(--border); background: var(--bg-card); flex-shrink: 0; }
  .log-viewer-toolbar .lv-btn { background: var(--bg-input); border: 1px solid var(--border); color: var(--fg); border-radius: 4px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
  .log-viewer-toolbar .lv-btn:hover { border-color: var(--accent); color: var(--accent); }
  .log-viewer-toolbar .lv-info { color: var(--muted); font-size: 11px; margin-left: auto; }
  .log-viewer-status { position: absolute; bottom: 4px; right: 8px; font-size: 10px; color: var(--muted); pointer-events: none; background: rgba(0,0,0,0.4); padding: 2px 6px; border-radius: 3px; }
  .topbar .divider { width: 1px; height: 24px; background: var(--border); }
  .topbar .conn-area { display: flex; align-items: center; gap: 8px; }
  .topbar select, .topbar input {
    background: var(--bg-input); color: var(--fg); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; font-size: 12px; font-family: var(--font-ui);
    outline: none; transition: border-color 0.2s, box-shadow 0.2s;
  }
  .topbar select { min-width: 130px; cursor: pointer; }
  .topbar select:focus, .topbar input:focus {
    border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow);
  }
  .btn {
    background: var(--bg-card); color: var(--fg); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 14px; font-size: 12px; cursor: pointer;
    font-family: var(--font-ui); transition: all 0.2s; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #001020; border: none; font-weight: 600;
  }
  .btn.primary:hover { box-shadow: 0 0 14px var(--accent-glow); filter: brightness(1.1); }
  .btn.danger { color: var(--neon-red); }
  .btn.danger:hover { border-color: var(--neon-red); box-shadow: 0 0 8px rgba(255,64,96,0.3); }
  .btn.ghost { background: transparent; }
  .btn.icon-btn { padding: 6px 8px; min-width: 30px; text-align: center; }
  .topbar .spacer { flex: 1; }
  .topbar .status-pill {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 20px;
    background: var(--bg-card); border: 1px solid var(--border);
    font-size: 11px; color: var(--muted);
  }
  .topbar .status-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .topbar .status-pill .dot.on { background: var(--neon-green); box-shadow: 0 0 6px var(--neon-green); }
  .topbar .status-pill .dot.rec { background: var(--neon-red); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* ===== 主布局 ===== */
  .main {
    flex: 1; display: flex; min-height: 0; position: relative; z-index: 1;
  }

  /* ===== 左侧串口列表 ===== */
  .sidebar {
    width: 220px; flex-shrink: 0;
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .sidebar-head {
    padding: 12px 16px 8px;
    font-size: 11px; font-weight: 600; letter-spacing: 1px;
    color: var(--muted); text-transform: uppercase;
    display: flex; align-items: center; justify-content: space-between;
  }
  .sidebar-head .count {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 10px; padding: 1px 8px; font-size: 10px; color: var(--accent);
  }
  .port-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
  .port-item {
    padding: 10px 12px; border-radius: 8px; cursor: pointer;
    margin-bottom: 4px; transition: all 0.2s;
    border: 1px solid transparent;
    display: flex; align-items: center; gap: 10px;
  }
  .port-item:hover { background: var(--bg-card); }
  .port-item.active {
    background: linear-gradient(135deg, rgba(0,212,255,0.12), rgba(0,153,204,0.05));
    border-color: var(--border-glow);
    box-shadow: inset 0 0 10px rgba(0,212,255,0.08);
  }
  .port-item .led {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    background: var(--muted); transition: all 0.3s;
  }
  .port-item.connected .led { background: var(--neon-green); box-shadow: 0 0 8px var(--neon-green); }
  .port-item .info { flex: 1; min-width: 0; }
  .port-item .name { font-size: 12px; font-weight: 600; color: var(--fg-bright); font-family: var(--font-mono); }
  .port-item .desc { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .port-item .baud { font-size: 10px; color: var(--accent); font-family: var(--font-mono); }
  .port-item .actions { display: none; gap: 4px; }
  .port-item:hover .actions { display: flex; }
  .port-item .actions button {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 14px; padding: 0 2px; border-radius: 3px;
  }
  .port-item .actions button:hover { color: var(--neon-red); background: rgba(255,64,96,0.1); }

  /* ===== 侧边栏底部 TFTP 面板（高度可拖拽）===== */
  .tftp-resizer {
    flex-shrink: 0; height: 7px; cursor: row-resize;
    background: var(--bg-panel); border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 9px; line-height: 1;
    user-select: none; transition: background 0.15s, color 0.15s;
  }
  .tftp-resizer:hover, .tftp-resizer.dragging {
    background: var(--accent); color: #001020;
  }
  .tftp-pane {
    height: 50%; flex-shrink: 0;  /* 默认占侧边栏一半，拖拽后 JS 用 px 覆盖并记忆 */
    border-top: 1px solid var(--border);
    display: flex; flex-direction: column;
    background: var(--bg-panel); overflow: hidden;
  }
  .tftp-head {
    padding: 10px 14px 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11px; font-weight: 600; letter-spacing: 1px;
    color: var(--muted); text-transform: uppercase;
  }
  .tftp-toggle {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    font-size: 10px; font-weight: 500; letter-spacing: 0;
    text-transform: none; padding: 3px 10px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg-card);
    color: var(--muted); transition: all 0.2s; user-select: none;
  }
  .tftp-toggle.on {
    color: var(--neon-green); border-color: rgba(0,255,136,0.4);
    background: rgba(0,255,136,0.08);
    box-shadow: 0 0 8px rgba(0,255,136,0.15);
  }
  .tftp-toggle .led { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); transition: all 0.3s; }
  .tftp-toggle.on .led { background: var(--neon-green); box-shadow: 0 0 6px var(--neon-green); }
  .tftp-dir {
    padding: 0 14px 8px; flex-shrink: 0;
    display: flex; align-items: center; gap: 6px;
  }
  .tftp-dir .path {
    flex: 1; min-width: 0; font-family: var(--font-mono); font-size: 10px;
    color: var(--fg); background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 5px; padding: 5px 8px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    cursor: pointer; title: '点击选择 TFTP 目录';
  }
  .tftp-dir .path:hover { border-color: var(--accent); }
  .tftp-dir .btn {
    flex-shrink: 0; font-size: 11px; padding: 4px 8px;
  }
  .tftp-list { flex: 1; overflow-y: auto; padding: 0 8px 8px; min-height: 0; }
  /* 两个独立滚动区：最近传输固定上限，目录文件占余下空间 */
  .tftp-transfers { flex: 0 0 auto; max-height: 188px; overflow-y: auto; padding: 0 8px 4px; min-height: 0; }  /* 标题24px + 5行×~32px ≈ 184px */
  .tftp-files { flex: 1; overflow-y: auto; padding: 0 8px 8px; min-height: 0; }
  .tftp-item {
    font-size: 11px; padding: 6px 8px 8px; border-radius: 5px;
    display: flex; align-items: center; gap: 8px; margin-bottom: 2px;
    font-family: var(--font-mono); color: var(--muted);
    position: relative;  /* 进度条绝对定位到此行底部 */
  }
  /* 传输进度条：进行中显示，done/error 隐藏（CSS 控制） */
  .tftp-item .bar {
    position: absolute; left: 8px; right: 8px; bottom: 2px; height: 2px;
    background: var(--bg-card); border-radius: 1px; overflow: hidden;
    display: none;
  }
  .tftp-item .bar > i { display: block; height: 100%; width: 0%;
    background: var(--accent); border-radius: 1px; transition: width 0.3s; }
  .tftp-item.active .bar { display: block; }  /* 进行中才显示进度条 */
  .tftp-item.error .bar > i { background: var(--neon-red); }
  /* 不确定进度条（WRQ 设备上传，未知 total）：条纹滚动，表明在传输 */
  .tftp-item .bar.indeterminate > i { width: 40% !important; transition: none;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    background-size: 200% 100%; animation: tftp-bar-slide 1.2s linear infinite; }
  @keyframes tftp-bar-slide { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  /* 分区标题（目录文件 / 最近传输）：sticky 吸顶，长列表滚动时始终可见 */
  .tftp-sec {
    font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
    color: var(--muted); font-weight: 600;
    margin: 8px 2px 4px; display: flex; justify-content: space-between;
    position: sticky; top: 0; background: var(--bg-panel);
    padding: 3px 2px; z-index: 1;
    cursor: pointer; user-select: none;
    transition: color 0.15s;
  }
  .tftp-sec:hover { color: var(--fg-bright); }
  .tftp-file {
    font-size: 11px; padding: 5px 8px; border-radius: 5px;
    display: flex; align-items: center; gap: 8px; margin-bottom: 2px;
    font-family: var(--font-mono); color: var(--muted); overflow: hidden;
    cursor: default;
  }
  .tftp-file:hover { background: var(--bg-card); }
  .tftp-file .icon { flex-shrink: 0; font-size: 12px; }
  .tftp-file .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg); }
  .tftp-file .size { flex-shrink: 0; font-size: 10px; color: var(--muted); }

  .tftp-item .icon { flex-shrink: 0; font-size: 12px; }
  .tftp-item .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg); }
  .tftp-item .size { flex-shrink: 0; font-size: 10px; color: var(--muted); }
  .tftp-item.done .icon { color: var(--neon-green); }
  .tftp-item.error .icon { color: var(--neon-red); }
  .tftp-item.error .name { color: var(--neon-red); }
  .tftp-empty {
    padding: 14px 10px; text-align: center; font-size: 11px; color: var(--muted);
  }
  .tftp-empty .hint { font-size: 10px; margin-top: 4px; color: var(--muted); opacity: 0.7; }

  /* ===== 中央终端区 ===== */
  .center { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .tabs {
    display: flex; align-items: center; gap: 2px;
    padding: 6px 8px 0; background: var(--bg-panel);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
    overflow-x: auto;
  }
  .tab {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px; border-radius: 7px 7px 0 0;
    cursor: pointer; font-size: 12px; color: var(--muted);
    border: 1px solid transparent; border-bottom: none;
    transition: all 0.2s; white-space: nowrap;
  }
  .tab:hover { color: var(--fg); background: var(--bg-card); }
  .tab.active {
    color: var(--accent); background: var(--bg);
    border-color: var(--border); border-bottom-color: var(--bg);
    position: relative;
  }
  .tab.active::after {
    content: ""; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--accent), transparent);
  }
  .tab .led { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
  .tab.active .led { background: var(--neon-green); box-shadow: 0 0 6px var(--neon-green); }
  .tab .close { opacity: 0.4; font-size: 14px; padding: 0 2px; border-radius: 3px; }
  .tab .close:hover { opacity: 1; color: var(--neon-red); }
  .tab-bar-actions { margin-left: auto; display: flex; gap: 5px; padding-right: 8px; padding-bottom: 6px; align-items: center; }
  /* 终端快捷按钮组（暂停/清屏/^C/^D/跳底）—— 紧凑科技风 */
  .tab-bar-actions .icon-btn {
    padding: 5px 9px; min-width: 28px; font-size: 12px; border-radius: 7px;
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--muted); transition: all 0.18s ease;
    line-height: 1;
  }
  .tab-bar-actions .icon-btn:hover {
    color: var(--accent); border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent-glow), 0 2px 8px rgba(0,212,255,0.15);
    transform: translateY(-1px);
  }
  .tab-bar-actions .icon-btn:active { transform: translateY(0); }
  /* ^C ^D 控制键按钮用警示色区分 */
  .tab-bar-actions .icon-btn#btnCtrlC:hover { color: var(--neon-orange); border-color: var(--neon-orange); box-shadow: 0 0 0 1px rgba(255,165,0,0.25); }
  .tab-bar-actions .icon-btn#btnCtrlD:hover { color: var(--neon-red); border-color: var(--neon-red); box-shadow: 0 0 0 1px rgba(255,64,96,0.25); }

  .term-area { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .term-toolbar {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 12px; background: var(--bg-panel);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .term-toolbar .btn { padding: 4px 10px; font-size: 11px; }
  .term-toolbar .info { font-size: 11px; color: var(--muted); margin-left: auto; font-family: var(--font-mono); }

  .output-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; background: var(--bg); }
  .output { flex: 1; min-height: 0; overflow-y: auto;
    padding: 8px 14px;
    font-family: var(--font-mono); font-size: 13px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-all;
    font-variant-ligatures: none;
  }
  /* xterm 终端容器 */
  .xterm-wrap {
    flex: 1; min-height: 0; position: relative; background: #1a1f2e;  /* 终端底色：略浅于纯黑，降低对比度护眼 */
    padding: 4px 6px 0 6px; overflow: hidden;
  }
  .xterm-bottom-pad { flex-shrink: 0; height: 18px; background: #1a1f2e; }  /* 底部留白 1 行高，与终端底色一致 */
  .xterm-wrap .xterm { height: 100%; }
  .xterm-wrap .xterm-viewport { overflow-y: auto !important; }
  /* xterm 行高/字号与原终端一致 */
  .xterm-wrap .xterm-rows { font-family: var(--font-mono); }

  /* ===== Ctrl+右键上下文菜单 ===== */
  .ctx-menu { position: fixed; z-index: 9999; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,.5), 0 0 0 1px rgba(0,212,255,0.08); padding: 5px 0; min-width: 190px; display: none; font-size: 12px; user-select: none; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .ctx-item { padding: 8px 16px; cursor: pointer; display: flex; align-items: center; gap: 10px; color: var(--fg); transition: background 0.12s, color 0.12s; }
  .ctx-item:hover { background: var(--accent); color: #001020; }
  .ctx-item.disabled { color: var(--muted); cursor: default; }
  .ctx-item.disabled:hover { background: transparent; color: var(--muted); }
  .ctx-sep { height: 1px; background: var(--border); margin: 5px 0; }

  /* ===== 串口搜索分栏（仿日志查看器 .log-search-*） ===== */
  .term-search-splitter { height: 5px; background: var(--border); cursor: row-resize; flex-shrink: 0; display: none; transition: background 0.15s; }
  .term-search-splitter:hover { background: var(--accent); }
  .term-search-pane { display: none; flex-direction: column; height: 35%; min-height: 80px; max-height: 70%; background: var(--bg-card); border-top: 1px solid var(--border); flex-shrink: 0; }
  .term-search-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; background: var(--bg-panel); }
  .term-search-head input { flex: 1; background: var(--bg-input); border: 1px solid var(--border); color: var(--fg); border-radius: 6px; padding: 5px 10px; font-size: 12px; transition: border-color 0.2s, box-shadow 0.2s; }
  .term-search-head input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); outline: none; }
  .term-search-results { flex: 1; overflow-y: auto; position: relative; background: var(--bg-input); min-height: 40px; }
  .term-search-results .hline { cursor: pointer; position: static; height: auto; line-height: 1.5; padding: 3px 10px; white-space: pre-wrap; word-break: break-all; border-left: 2px solid transparent; transition: background 0.12s, border-color 0.12s; }
  .term-search-results .hline:hover { background: var(--bg-card); border-left-color: var(--accent); }
  .term-search-results .hline.active { background: rgba(0,212,255,0.12); border-left-color: var(--accent); color: var(--accent); }

  .line { padding: 0; }
  .line .ts { color: #2a3a55; font-size: 10px; margin-right: 8px; user-select: none; font-family: var(--font-mono); }
  .tag-kernel { color: var(--kernel); }
  .tag-kernel_err { color: var(--kernel-err); }
  .tag-uboot { color: var(--uboot); }
  .tag-heop { color: var(--heop); }
  .tag-heop_ok { color: var(--heop-ok); }
  .tag-heop_fail { color: var(--heop-fail); font-weight: 600; }
  .tag-prompt { color: var(--prompt); }
  .tag-text { color: var(--text); }
  .tag-empty { }
  .tag-input { color: var(--input-c); }
  .tag-serial-reader, .tag-serial, .tag-ctrl { color: var(--neon-orange); font-style: italic; }

  /* 终端内联输入行（v0.3.0 已弃用，xterm 自带输入；保留样式以防残留引用） */
  .term-input-line { display: none; }

  /* ===== 右侧面板（工具栏 + 标签页） ===== */
  .ai-panel {
    width: 340px; flex-shrink: 0;
    background: var(--bg-panel);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
    transition: width 0.3s;
  }
  .ai-panel.collapsed { width: 44px; }
  .ai-panel.collapsed .panel-body, .ai-panel.collapsed .ai-head-detail { display: none; }
  .ai-panel.collapsed .ai-head { padding: 12px 0; justify-content: center; }
  .ai-panel.collapsed #aiToggle { display: none; }
  .ai-head .ai-icon { cursor: pointer; transition: transform 0.2s; }
  .ai-head .ai-icon:hover { transform: scale(1.12); }
  .ai-head {
    padding: 12px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  }
  .ai-head .ai-icon {
    width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--neon-purple), var(--accent));
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; box-shadow: 0 0 12px rgba(179,102,255,0.4);
  }
  .ai-head-detail { flex: 1; }
  .ai-head-detail .title { font-size: 13px; font-weight: 600; color: var(--fg-bright); }
  .ai-head-detail .sub { font-size: 10px; color: var(--muted); }
  .ai-head .toggle {
    background: none; border: 1px solid var(--border); border-radius: 5px;
    color: var(--muted); cursor: pointer; padding: 3px 7px; font-size: 14px;
  }
  .ai-head .toggle:hover { color: var(--accent); border-color: var(--accent); }

  /* 顶部工具栏：搜索 + 跳底 */
  .panel-toolbar {
    display: flex; align-items: center; gap: 6px;
    padding: 10px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .panel-toolbar .search-box {
    flex: 1; display: flex; align-items: center; gap: 4px;
    background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px;
    padding: 4px 8px; transition: border-color 0.2s, box-shadow 0.2s;
  }
  .panel-toolbar .search-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
  .panel-toolbar .search-box input {
    flex: 1; background: transparent; border: none; outline: none; color: var(--fg);
    font-size: 12px; font-family: var(--font-ui);
  }
  .panel-toolbar .search-box .count { font-size: 10px; color: var(--muted); font-family: var(--font-mono); }
  .panel-toolbar .nav-btn {
    background: none; border: 1px solid var(--border); border-radius: 5px;
    color: var(--muted); cursor: pointer; padding: 3px 6px; font-size: 12px;
  }
  .panel-toolbar .nav-btn:hover { color: var(--accent); border-color: var(--accent); }
  .panel-toolbar .nav-btn:disabled { opacity: 0.3; cursor: default; }

  /* 标签页 */
  .panel-tabs {
    display: flex; gap: 2px; padding: 0 14px; background: var(--bg-panel);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .panel-tab {
    padding: 8px 14px; cursor: pointer; font-size: 12px; color: var(--muted);
    border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap;
  }
  .panel-tab:hover { color: var(--fg); }
  .panel-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .panel-body { flex: 1; min-height: 0; overflow-y: auto; }
  .panel-tab-pane { display: none; height: 100%; }
  .panel-tab-pane.active { display: flex; flex-direction: column; }

  /* 感知标签 */
  .sense-pane { padding: 8px 14px; overflow-y: auto; }
  .sense-head {
    font-size: 10px; font-weight: 600; letter-spacing: 1px; color: var(--muted);
    text-transform: uppercase; margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .sense-head .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--neon-green); animation: pulse 1.5s infinite; }
  .sense-filter { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; }
  .sense-filter .chip {
    font-size: 10px; padding: 2px 8px; border-radius: 10px; cursor: pointer;
    background: var(--bg-card); border: 1px solid var(--border); color: var(--muted);
    font-family: var(--font-mono); transition: all 0.2s;
  }
  .sense-filter .chip:hover { border-color: var(--accent); color: var(--accent); }
  .sense-filter .chip.active { background: rgba(0,212,255,0.15); border-color: var(--accent); color: var(--accent); }
  .sense-line { font-family: var(--font-mono); font-size: 11px; color: var(--text); padding: 2px 0; white-space: pre-wrap; word-break: break-all; cursor: pointer; border-radius: 4px; padding-left: 4px; }
  .sense-line:hover { background: var(--bg-card); }
  .sense-line .port-tag { color: var(--accent); font-size: 9px; margin-right: 4px; }
  .sense-line.kw-error { color: var(--neon-red); }
  .sense-line.kw-warning { color: var(--neon-orange); }
  .sense-line.kw-info { color: var(--accent); }

  /* MCP 状态标签 */
  .mcp-pane { padding: 10px 14px; overflow-y: auto; }
  .mcp-head { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; margin-bottom: 12px; }
  .mcp-head .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .mcp-head .dot.on { background: var(--neon-green); box-shadow: 0 0 6px var(--neon-green); }
  .mcp-section { margin-bottom: 14px; }
  .mcp-section .title { font-size: 10px; font-weight: 600; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
  .mcp-mono { font-family: var(--font-mono); font-size: 11px; color: var(--text); word-break: break-all; background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; }
  .mcp-tools { display: flex; flex-direction: column; gap: 4px; }
  .mcp-tool { font-size: 11px; padding: 4px 8px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; }
  .mcp-tool .tname { font-family: var(--font-mono); color: var(--accent); font-weight: 600; }
  .mcp-tool .tdesc { color: var(--muted); margin-left: 6px; }
  .mcp-calls { display: flex; flex-direction: column; gap: 3px; }
  .mcp-call { font-family: var(--font-mono); font-size: 10px; padding: 3px 6px; border-radius: 4px; background: var(--bg-card); border-left: 2px solid var(--border); }
  .mcp-call.ok { border-left-color: var(--neon-green); }
  .mcp-call.fail { border-left-color: var(--neon-red); }
  .mcp-call .ctime { color: var(--muted); margin-right: 6px; }
  .mcp-call .ctool { color: var(--accent); font-weight: 600; }
  .mcp-call .cargs { color: var(--text); opacity: 0.8; }
  .mcp-empty { color: var(--muted); font-size: 11px; font-style: italic; }

  /* 分析标签 */
  .analyze-pane { padding: 12px 14px; overflow-y: auto; }
  .stat-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 14px; }
  .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
  .stat-card .label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-card .value { font-size: 20px; font-weight: 700; font-family: var(--font-mono); margin-top: 2px; }
  .stat-card.err .value { color: var(--neon-red); }
  .stat-card.warn .value { color: var(--neon-orange); }
  .stat-card.info .value { color: var(--accent); }
  .stat-card.ok .value { color: var(--neon-green); }
  .analyze-section { margin-bottom: 14px; }
  .analyze-section .title { font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .freq-bar { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; font-size: 11px; }
  .freq-bar .name { width: 70px; color: var(--fg); font-family: var(--font-mono); }
  .freq-bar .bar { flex: 1; height: 8px; background: var(--bg-card); border-radius: 4px; overflow: hidden; }
  .freq-bar .fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 4px; }
  .freq-bar .num { width: 30px; text-align: right; color: var(--muted); font-family: var(--font-mono); }
  .cluster-item { font-size: 11px; color: var(--fg); padding: 4px 8px; background: var(--bg-card); border-radius: 6px; margin-bottom: 4px; border-left: 2px solid var(--neon-red); font-family: var(--font-mono); cursor: pointer; }
  .cluster-item:hover { background: var(--bg-input); }

  /* 命令标签 */
  .cmd-pane { padding: 10px 14px; overflow-y: auto; display: flex; flex-direction: column; }
  .cmd-add { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .cmd-add input { background: var(--bg-input); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 12px; outline: none; font-family: var(--font-mono); width: 100%; }
  .cmd-add .cmd-add-name { font-family: var(--font-ui); }
  .cmd-add .cmd-add-row { display: flex; gap: 6px; }
  .cmd-add .cmd-add-cmd { flex: 1; }
  .cmd-add input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
  .cmd-add button { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #001020; border: none; border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer; font-weight: 600; flex-shrink: 0; }
  .cmd-sheets { display: flex; gap: 4px; margin-bottom: 8px; border-bottom: 1px solid var(--border); }
  .cmd-sheet-tab { font-size: 11px; font-weight: 600; color: var(--muted); padding: 4px 10px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.2s; }
  .cmd-sheet-tab:hover { color: var(--fg); }
  .cmd-sheet-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .cmd-sheet-pane { display: none; flex: 1; overflow-y: auto; }
  .cmd-sheet-pane.active { display: block; }
  .cmd-section .title { font-size: 11px; font-weight: 600; color: var(--muted); margin: 10px 0 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .cmd-item { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 4px; transition: all 0.2s; }
  .cmd-item:hover { border-color: var(--accent); }
  .cmd-item .text { flex: 1; font-family: var(--font-mono); font-size: 11px; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cmd-item .name { font-family: var(--font-ui); font-weight: 600; color: var(--accent); cursor: pointer; }
  .cmd-item .cmd-edit-name:hover { text-decoration: underline; }
  .cmd-item .cmd-no-name { color: var(--muted); font-style: italic; font-size: 10px; font-family: var(--font-ui); }
  .cmd-item .cmd-no-name:hover { color: var(--accent); }
  .cmd-item .cmd-sub { font-family: var(--font-mono); font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cmd-item .run { background: none; border: 1px solid var(--border); border-radius: 4px; color: var(--neon-green); cursor: pointer; padding: 2px 8px; font-size: 11px; }
  .cmd-item .run:hover { border-color: var(--neon-green); background: rgba(0,255,157,0.1); }
  .cmd-item .edit { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; padding: 0 4px; }
  .cmd-item .edit:hover { color: var(--accent); }
  .cmd-item .del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; padding: 0 4px; }
  .cmd-item .del:hover { color: var(--neon-red); }
  .cmd-empty { color: var(--muted); font-size: 11px; padding: 12px; text-align: center; }

  /* 历史浏览（虚拟列表） */
  .history-pane { padding: 8px 10px; display: flex; flex-direction: column; height: 100%; gap: 6px; }
  .history-toolbar { display: flex; gap: 6px; align-items: center; }
  .history-toolbar select, .history-toolbar input { background: var(--bg-input); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font-size: 11px; outline: none; }
  .history-toolbar select { max-width: 140px; }
  .history-toolbar input { flex: 1; font-family: var(--font-mono); }
  .history-toolbar select:focus, .history-toolbar input:focus { border-color: var(--accent); }
  .history-toolbar .btn { padding: 4px 8px; font-size: 11px; }
  .history-status { font-size: 10px; color: var(--muted); padding: 2px 4px; }
  .vlist { flex: 1; overflow-y: auto; position: relative; background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; padding-bottom: 18px; }  /* 底部留白 1 行高，与终端一致 */
  .vlist-inner { position: relative; width: 100%; }
  .vlist-viewport { position: absolute; left: 0; right: 0; top: 0; }  /* 跟随 scrollTop 平移的渲染块，行在其中用实际坐标排列 */
  .hline { position: absolute; left: 0; right: 0; top: 0; height: 18px; line-height: 18px; padding: 0 6px; font-family: var(--font-mono); font-size: 11px; color: var(--fg); white-space: pre; overflow: hidden; text-overflow: ellipsis; box-sizing: border-box; }
  .hline:hover { background: var(--bg-card); }
  .hline.kw-error { color: var(--neon-red); }
  .hline.kw-warning { color: var(--neon-orange); }
  .hline.kw-info { color: var(--accent); }
  .hline .htag { color: var(--muted); font-size: 9px; margin-right: 6px; }
  .hline .hts { color: #5f7fa6; font-size: 10px; margin-right: 6px; user-select: none; }  /* 工具日志自带时间戳，展示出来 */
  .hline .hrow { color: var(--accent); font-size: 9px; margin-right: 6px; min-width: 50px; display: inline-block; }

  /* 全屏覆盖容器（top 等）—— v0.3.0：xterm 自身处理全屏序列，此 overlay 仅作"全屏模式"提示条 */
  .screen-overlay {
    position: absolute; top: 0; left: 0; right: 0; display: none;
    z-index: 6; pointer-events: none;
  }
  .screen-overlay.show { display: flex; flex-direction: column; }
  /* 退出全屏提示条 */
  .screen-hint {
    padding: 4px 10px; font-size: 11px; color: var(--muted);
    background: rgba(0,212,255,0.06); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px; pointer-events: auto;
  }
  .screen-hint .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--neon-green); box-shadow: 0 0 6px var(--neon-green); animation: pulse 1.2s infinite; }
  .screen-hint .esc { margin-left: auto; color: var(--accent); cursor: pointer; padding: 1px 8px; border: 1px solid var(--border); border-radius: 4px; }
  .screen-hint .esc:hover { background: rgba(0,212,255,0.12); }
  /* screen-body/screen-row/screen-cursor 已废弃（xterm 接管），样式保留空壳避免引用报错 */
  .screen-body, .screen-row, .screen-cursor { display: none; }

  /* 搜索/关键字高亮 */
  mark.hit { background: rgba(0,212,255,0.18); border-bottom: 2px solid var(--accent); color: inherit; padding: 0 1px; border-radius: 2px; }
  mark.hit.active { background: rgba(255,157,0,0.35); border-bottom-color: var(--neon-orange); }
  .kw-error { color: var(--neon-red); font-weight: 600; }
  .kw-warning { color: var(--neon-orange); font-weight: 600; }
  .kw-info { color: var(--accent); font-weight: 600; }
  .kw-success { color: var(--neon-green); font-weight: 600; }
  .top-sentinel { height: 1px; }

  /* 隐藏输入框（v0.3.0：xterm 自带输入，此框已不再承载焦点；保留以防旧引用） */
  #cmdInput { position: absolute; left: -9999px; width: 1px; opacity: 0; }

  /* 回放面板 */
  .replay-panel {
    display: none; position: absolute; inset: 0;
    background: var(--bg); z-index: 10; flex-direction: column;
  }
  .replay-panel.show { display: flex; }
  .replay-head { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--bg-panel); border-bottom: 1px solid var(--border); }
  .replay-body { flex: 1; overflow-y: auto; padding: 8px 14px; font-family: var(--font-mono); font-size: 13px; white-space: pre-wrap; word-break: break-all; }
  .replay-foot { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--bg-panel); border-top: 1px solid var(--border); }
  .replay-foot input[type=range] { flex: 1; }

  /* 日志模态框 */
  .modal {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(4px);
  }
  .modal.show { display: flex; }
  .modal .box {
    background: var(--bg-panel); border: 1px solid var(--border-glow); border-radius: 12px;
    width: 640px; max-height: 78vh; display: flex; flex-direction: column;
    box-shadow: 0 0 40px rgba(0,212,255,0.1);
  }
  .modal .head { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .modal .head strong { color: var(--fg-bright); font-size: 14px; }
  .modal .head .head-actions { display: flex; gap: 6px; align-items: center; }
  .modal .dir-bar {
    padding: 8px 16px; font-size: 11px; color: var(--muted); font-family: var(--font-mono);
    background: var(--bg-input); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px; word-break: break-all;
  }
  .modal .dir-bar .open-btn { color: var(--accent); cursor: pointer; white-space: nowrap; border: 1px solid var(--border); border-radius: 4px; padding: 2px 8px; }
  .modal .dir-bar .open-btn:hover { background: rgba(0,212,255,0.12); border-color: var(--accent); }
  .log-dir-bar { display: flex; align-items: center; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--bg-card); }
  .log-dir-bar .lbl { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .log-dir-input { flex: 1; background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; color: var(--fg); font-family: var(--font-mono); font-size: 11px; outline: none; }
  .log-dir-input:focus { border-color: var(--accent); }
  .modal .list { overflow-y: auto; padding: 8px; }
  .modal .item { padding: 10px 12px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: all 0.2s; gap: 8px; }
  .modal .item:hover { background: var(--bg-card); border-color: var(--accent); }
  .modal .item .sz { color: var(--muted); font-size: 11px; }
  .modal .item .item-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
  .modal .item .act-btn { font-size: 11px; color: var(--accent); cursor: pointer; border: 1px solid var(--border); border-radius: 4px; padding: 2px 8px; background: var(--bg-card); }
  .modal .item .act-btn:hover { border-color: var(--accent); background: rgba(0,212,255,0.12); }
  .modal .item .act-btn.open { color: var(--neon-orange); }

<script>
// ============================================================
// 全局状态
// ============================================================
const $ = id => document.getElementById(id);
const banner = $('banner');
const portList = $('portList');
const tabs = $('tabs');
const termArea = $('termArea');

let connections = {};   // port_id -> conn（含 term/fit/search/xtermWrap/sse 等）
let activePortId = null;
let aiSse = null;

// banner 显示/消失会改变 .main 高度 → xterm 容器尺寸变化，但 xterm 不自带
// ResizeObserver，fit 不会自动跑。banner 消失后终端下方必现 ~2 行空白
//（rows 还是按矮容器算的），故 banner 每次 class 变化后统一重 fit 所有终端。
function refitAllTerms() {
  requestAnimationFrame(() => {
    for (const id in connections) {
      const c = connections[id];
      if (c && c.term && c.fit && c.wrap.style.display !== 'none') {
        try { c.fit.fit(); } catch(e){}
        // rows 变化后视口相对位置改变，跟随模式补一次贴底
        if (c.autoScroll && !c.inScreen) { try { c.term.scrollToBottom(); } catch(e){} }
      }
    }
  });
}
function showBanner(msg, ms=4000, isErr=false) {
  banner.textContent = msg;
  banner.className = 'banner show' + (isErr ? ' err' : '');
  refitAllTerms();
  if (ms) setTimeout(()=>{ if (banner.textContent === msg) { banner.className = 'banner'; refitAllTerms(); } }, ms);
}
function fmtTs(ms) {
  const d = new Date(ms);
  return d.toLocaleTimeString('zh-CN', {hour12:false}) + '.' + String(ms % 1000).padStart(3,'0');
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
// 连接排序：串口[0] < SSH[1] < 日志[2]，同类内按自然序
function sortKeyFn(pid) {
  const m = /^COM(\d+)$/i.exec(pid);
  if (m) return [0, parseInt(m[1], 10)];  // 串口：COM 号数字序
  if (pid.startsWith('log:')) return [2, pid];  // 日志：字典序
  return [1, pid];  // SSH：字典序
}

// ============================================================
// 关键字高亮（error/warning/info 等）
// v0.3.0：改用 xterm decoration 实现（见下方 highlightNewKw），
// 旧的 DOM textNode 高亮函数 highlightKeywords 已废弃移除。
// ============================================================
// （KW_RULES / KW_COLOR 已移至下方 xterm decoration 区块统一定义）

// ============================================================
// 终端标签页 & 输出区管理
// ============================================================
// 注：实际终端元素由 buildTerminal() 创建，此处不再保留死代码。

// 重新设计：每个连接有自己的 xterm 终端容器
function buildTerminal(portId, meta) {
  // 标签
  const tab = document.createElement('div');
  tab.className = 'tab';
  tab.dataset.portId = portId;
  tab.innerHTML = `<span class="led"></span><span>${esc(meta.label || portId)}</span><span style="color:var(--muted);font-size:10px;">${meta.kind === 'ssh' ? '' : '@'+meta.baud}</span> <span class="close" title="关闭">✕</span>`;
  tab.onclick = (e) => {
    if (e.target.classList.contains('close')) { e.stopPropagation(); closeConnection(portId); return; }
    switchTab(portId);
  };
  // 终端区
  const wrap = document.createElement('div');
  wrap.className = 'term-area';
  wrap.dataset.portId = portId;
  wrap.style.display = 'none';
  wrap.innerHTML = `
    <div class="output-wrap">
      <div class="xterm-wrap" data-xterm="${portId}"></div>
      <div class="xterm-bottom-pad"></div>
      <div class="term-search-splitter"></div>
      <div class="term-search-pane">
        <div class="term-search-head">
          <input type="text" class="term-search-input" placeholder="查找关键字…（回车搜索全部，Shift+回车跳下一个）" autocomplete="off">
          <span class="term-search-count"></span>
          <button class="btn ghost term-search-collapse" title="折叠分栏">▾</button>
        </div>
        <div class="term-search-results"></div>
      </div>
    </div>
  `;

  const conn = {
    portId,  // 用于搜索分栏调 /api/search 时定位连接（不依赖 activePortId）
    meta, tab, wrap,
    xtermWrap: wrap.querySelector(`[data-xterm="${portId}"]`),
    term: null, fit: null, search: null,
    sse: null,
    paused: false,
    autoScroll: true,
    pendingRaw: '',   // 历史加载期间缓冲的实时 raw，loadBuffer 完成后 flush
    // 历史分页（基于后端 buf，xterm 滚动到底即实时流；向上翻历史用分页 API）
    hasMore: true,
    oldestSeq: null,
    loadingMore: false,
    loadingHistory: false,
    // 全屏模式（top/htop）：仅用于显示提示条
    inScreen: false,
    screenOverlay: null,
    // 命令行流式高亮状态：cmdHL=true 表示当前处于命令行（# 之后），逐字符染绿
    cmdHL: false,
    // 关键字常驻高亮：记录已加 decoration 的行范围
    kwDecorLastRow: 0,
    kwDecorations: [],
    // 串口搜索分栏（仿日志查看器）
    termSearchPane: wrap.querySelector('.term-search-pane'),
    termSearchInput: wrap.querySelector('.term-search-input'),
    termSearchResults: wrap.querySelector('.term-search-results'),
    termSearchCount: wrap.querySelector('.term-search-count'),
    termSearchState: { q: '', results: [], idx: 0 },
    termSplitMove: null, termSplitUp: null,
  };

  // ---- 创建 xterm 实例 ----
  conn.term = new Terminal({
    fontFamily: '"Cascadia Code", "JetBrains Mono", "Consolas", "Menlo", monospace',
    fontSize: 13,
    lineHeight: 1.3,
    cursorBlink: true,
    cursorStyle: 'bar',
    scrollback: 100000,       // 大回滚缓冲，配合后端分页
    allowProposedApi: true,
    convertEol: false,        // 保留原始 \r\n，设备输出原样
    theme: {
      // One Dark（atom 经典深色主题）：长时间看舒服，ANSI 16 色对比度均衡。
      // 前景 #d7d7d7（比原 #abb2bf 更亮，灰白不刺眼但清晰）。
      background: '#1a1f2e',
      foreground: '#d7d7d7',
      cursor: '#528bff',
      cursorAccent: '#1a1f2e',
      selectionBackground: 'rgba(82,139,255,0.25)',
      black: '#1a1f2e', red: '#e06c75', green: '#98c379', yellow: '#e5c07b',
      blue: '#61afef', magenta: '#c678dd', cyan: '#56b6c2', white: '#abb2bf',
      // bright 变体须与基础色不同，否则设备「亮色」输出显示不出对比度
      brightBlack: '#5c6370', brightRed: '#d19a66', brightGreen: '#b5e890',
      brightYellow: '#e5c07b', brightBlue: '#82b8ff', brightMagenta: '#d19a66',
      brightCyan: '#66cccc', brightWhite: '#ffffff',
    },
  });
  conn.fit = new FitAddon.FitAddon();
  conn.search = new SearchAddon.SearchAddon();
  conn.term.loadAddon(conn.fit);
  conn.term.loadAddon(conn.search);
  try { conn.term.loadAddon(new WebLinksAddon.WebLinksAddon()); } catch(e) {}
  conn.term.open(conn.xtermWrap);
  // WebGL2 renderer：GPU 加速 glyph 渲染，高吞吐滚动不再卡（Tabby/Windows Terminal 同思路）。
  // 加载失败（无 WebGL2/驱动异常）自动回退默认 DOM 渲染，不影响功能
  try {
    if (window.WebglAddon) {
      const webgl = new WebglAddon.WebglAddon();
      webgl.onContextLoss(() => { try { webgl.dispose(); } catch(_){} });
      conn.term.loadAddon(webgl);
      conn._webgl = webgl;
    }
  } catch(e) {}
  try { conn.fit.fit(); } catch(e) {}

  // ---- Ctrl+C 复制选中（有选中→复制；无选中→发 ^C 中断）----
  // ---- Ctrl+V 粘贴剪贴板内容到串口 ----
  // ---- Ctrl+F 查找全部（打开串口下方搜索分栏，列出全部命中行）----
  conn.term.attachCustomKeyEventHandler(e => {
    if (e.ctrlKey && e.key === 'c' && e.type === 'keydown') {
      const sel = conn.term.getSelection();
      if (sel) { try { navigator.clipboard.writeText(sel); } catch(_){} return false; }
    }
    if (e.ctrlKey && (e.key === 'v' || e.key === 'V') && e.type === 'keydown') {
      // 异步读剪贴板（原生 Win32，无 WebView2 权限弹窗），拿到文本后编码为字节发给串口
      _pasteToConn(conn);
      return false;  // 阻止 xterm 默认行为
    }
    if (e.ctrlKey && (e.key === 'f' || e.key === 'F') && e.type === 'keydown') {
      toggleTermSearchPane(conn, true);
      conn.termSearchInput.focus(); conn.termSearchInput.select();
      return false;
    }
    return true;
  });

  // ---- Ctrl+右键上下文菜单 ----
  conn.xtermWrap.addEventListener('contextmenu', e => {
    if (!e.ctrlKey) return;  // 普通右键保持 xterm 默认行为
    e.preventDefault();
    showCtxMenu(e.clientX, e.clientY, conn);
  });

  // ---- xterm 输入 → 串口 ----
  conn.term.onData(data => {
    if (conn.paused) return;
    // data 是字符串（已按字符拆分），编码为字节发送
    const bytes = [];
    for (let i = 0; i < data.length; i++) {
      const code = data.charCodeAt(i);
      if (code < 128) bytes.push(code);
      else { for (const b of new TextEncoder().encode(data[i])) bytes.push(b); }
    }
    if (bytes.length) termSendRaw(portId, bytes);
  });

  // ---- 滚动检测：到底自动跟实时 ----
  // 注：深历史翻阅走「📜 历史」tab（虚拟列表，G 级不卡），主 xterm 不再 reset 重写加载更早历史
  conn.term.onScroll(() => {
    const vp = conn.xtermWrap.querySelector('.xterm-viewport');
    if (!vp) return;
    const atBottom = vp.scrollHeight - vp.scrollTop - vp.clientHeight < 30;
    conn.autoScroll = atBottom;
  });

  // ---- 全屏模式提示条（xterm 自身处理全屏序列，这里只显示提示 + 退出按钮） ----
  const overlay = document.createElement('div');
  overlay.className = 'screen-overlay';
  overlay.dataset.screen = portId;
  overlay.innerHTML = `
    <div class="screen-hint">
      <span class="dot"></span><span>全屏模式（top/htop）— 实时刷新中</span>
      <span class="esc" data-screen-esc="${portId}">退出 ↩</span>
    </div>
  `;
  wrap.querySelector('.output-wrap').appendChild(overlay);
  conn.screenOverlay = overlay;
  overlay.querySelector(`[data-screen-esc="${portId}"]`).onclick = () => {
    termSendRaw(portId, [3]);  // Ctrl-C 中断 top
  };

  // 插入 DOM
  const es = termArea.querySelector('.empty-state');
  if (es) es.remove();
  // 标签按 COM 号数字排序插入：找到第一个比当前大的标签，插它前面
  const _comKey = pid => { const m = /^COM(\d+)$/i.exec(pid); return m ? +m[1] : 9999; };
  const curKey = _comKey(portId);
  let inserted = false;
  for (const t of tabs.querySelectorAll('.tab')) {
    if (_comKey(t.dataset.portId) > curKey) {
      tabs.insertBefore(tab, t);
      inserted = true;
      break;
    }
  }
  if (!inserted) tabs.insertBefore(tab, tabs.querySelector('.tab-bar-actions'));
  termArea.appendChild(wrap);

  // SSE
  connectSSE(portId, conn);

  // 串口搜索分栏：拖分隔条 + 回车搜索 + 折叠按钮
  initTermSplitter(conn);
  // 回车重新搜索（串口 buf 动态变化，每次都需重搜）；Shift+回车跳下一个命中
  conn.termSearchInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      if (e.shiftKey) {
        const st = conn.termSearchState;
        if (st.results.length) {
          st.idx = (st.idx + 1) % st.results.length;
          jumpToTermHit(conn, st.idx);
          highlightTermHit(conn, st.idx);
        }
      } else {
        doTermSearch(conn);
      }
    }
  });
  wrap.querySelector('.term-search-collapse').onclick = () => {
    const isShown = conn.termSearchPane.style.display !== 'none';
    toggleTermSearchPane(conn, !isShown);
  };

  // 加载历史缓冲（写入 xterm）
  loadBuffer(portId, conn);
  return conn;
}

function switchTab(portId) {
  activePortId = portId;
  // 标签
  tabs.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.portId === portId));
  // 终端区
  termArea.querySelectorAll('.term-area').forEach(w => w.style.display = w.dataset.portId === portId ? 'flex' : 'none');
  // 侧边栏
  portList.querySelectorAll('.port-item').forEach(p => p.classList.toggle('active', p.dataset.portId === portId));
  // 切换后重新 fit 并聚焦 xterm（等 display:flex 生效后再 fit，否则算出 0 尺寸）
  const conn = connections[portId];
  if (conn) {
    if (conn.meta.kind === 'log') {
      // 日志 tab：重渲染虚拟列表（display:flex 后尺寸才正确）
      requestAnimationFrame(() => requestAnimationFrame(() => renderLogSlice(conn)));
    } else {
      requestAnimationFrame(() => requestAnimationFrame(() => {
        try { conn.fit.fit(); } catch(e){}
        try { conn.term.focus(); } catch(e){}
      }));
    }
    // 若分析标签正显示，刷新一次（数据源已切到新连接的 buffer）
    const activePane = document.querySelector('.panel-tab.active');
    if (activePane && activePane.dataset.pane === 'analyze') renderAnalyze();
  }
}

// 窗口/面板尺寸变化时重新 fit 活动 xterm
window.addEventListener('resize', () => {
  const conn = connections[activePortId];
  if (conn) {
    if (conn.meta.kind === 'log') renderLogSlice(conn);
    else { try { conn.fit.fit(); } catch(e){} }
  }
});

// SSE 收到 raw 字节流 → 写入 xterm；screenctl → 切换提示条
function appendRaw(portId, text) {
  const conn = connections[portId];
  if (!conn || conn.paused) return;
  // 历史还在加载时先缓冲 raw，等历史写完再 flush，避免实时数据插到历史前面/重复
  if (conn.loadingHistory) { conn.pendingRaw += text; return; }
  // 写合并：多个 SSE chunk 攒一帧再一次性 write，减少 xterm.write 调用次数。
  // 高吞吐时每次 write 都有同步解析开销，合并后渲染次数 ≈ 帧率（60fps），输入不再卡顿。
  // flush 调度用 rAF + 500ms setTimeout 双保险：窗口最小化时 rAF 停发，
  // setTimeout 仍被节流执行（~1s 一次），队列持续消化不会无界堆积
  conn._writeQueue = (conn._writeQueue || '') + text;
  if (conn._writeQueue.length > 1048576) {  // 1MB 保险上限：超限同步 flush 防极端堆积
    const data = conn._writeQueue;
    conn._writeQueue = '';
    if (conn._writePending) { clearTimeout(conn._writeFlushTimer); conn._writePending = false; }
    try { conn.term.write(data); } catch(e) {}
    return;
  }
  if (conn._writePending) return;
  conn._writePending = true;
  const flush = () => {
    if (connections[portId] !== conn) { conn._writeQueue = ''; return; }
    conn._writePending = false;
    const data = conn._writeQueue;
    conn._writeQueue = '';
    if (data && !conn.paused) {
      let out = data;
      // 命令行流式高亮：先在原始流上识别行首 #/$/> （时间戳会破坏行首判断，故高亮在前）
      if (!conn.inScreen) out = _hlCmdStream(out, conn);
      // 时间戳注入：在高亮后的行首插时间戳（ts 在 ANSI 高亮码之前，两者共存）
      if (conn.tsEnabled && !conn.inScreen) out = _injectTs(out, conn);
      conn.term.write(out);
      // 关键字常驻高亮：对新写入的行扫描
      scheduleKwHighlight(conn);
      // 跟随到底：xterm 只在"精确贴底"时才自动滚，onScroll 的 30px 宽容阈值内
      // （autoScroll=true 但视口差零点几行）新数据不触发内建滚动，底部空隙随数据
      // 增长越拉越大——偶现留白 3~4 行的根因。跟随模式下显式贴底纠偏。
      if (conn.autoScroll && !conn.inScreen) { try { conn.term.scrollToBottom(); } catch(e){} }
    }
  };
  requestAnimationFrame(flush);
  conn._writeFlushTimer = setTimeout(flush, 500);  // 后台兜底（rAF 停发时最多 500ms 必 flush）
}
// 逐行时间戳注入（tio 同款，BSP 排障刚需）：每行行首加 [HH:MM:SS.mmm]。
// 只处理行式输出：全屏应用（top/htop，inScreen）期间原样透传，不破坏光标控制。
// 按 \n 切分，每个非首段的行开始处插时间戳（行首 \r 先剥离再放回）。
// 退格/回车覆盖等字符级控制在行内原样保留。
function _tsNow() {
  const d = new Date();
  return d.toTimeString().slice(0, 8) + '.' + String(d.getMilliseconds()).padStart(3, '0');
}
function _injectTs(data, conn) {
  if (conn._tsAtLS === undefined) conn._tsAtLS = true;  // 跨 chunk 行首状态
  const parts = data.split('\n');
  const ts = '\x1b[90m[' + _tsNow() + ']\x1b[0m ';
  let out = '';
  for (let i = 0; i < parts.length; i++) {
    let seg = parts[i];
    const atLS = (i === 0) ? conn._tsAtLS : true;  // 首段沿用跨 chunk 状态，其余段都在行首
    if (i > 0) out += '\n';
    if (seg === '') continue;         // 空段（连续 \n）：不注入
    let pre = '';
    if (seg.startsWith('\r')) { pre = '\r'; seg = seg.slice(1); }
    if (seg === '') { out += pre; continue; }  // 行只有 \r：不注入
    out += pre + (atLS ? ts : '') + seg;
  }
  // 最后一段无 \n（未闭合）：保持其行首状态；有 \n：回到行首
  conn._tsAtLS = parts[parts.length - 1] === '' || data.endsWith('\n');
  return out;
}
// 命令行流式高亮（mobaxterm 风格）：# 提示符及之后用户输入逐字符染色。
// 关键约束：串口命令是逐字符 echo 的，不能整行缓冲重写（否则 # ls# ls 重复）。
// 故逐 chunk 扫描，状态 conn.cmdHL 跨 chunk 保持：遇行首 # 进命令行（紫提示符+绿后续），
// 遇 \n/\r 退出复位；ANSI 控制序列与 \b 等控制符整体透传，不改变高亮状态。
function _hlCmdStream(data, conn) {
  if (conn.cmdHL === undefined) conn.cmdHL = false;
  if (conn._hlAtLS === undefined) conn._hlAtLS = true;  // 是否在行首（未见可见字符）
  let out = '';
  for (let i = 0; i < data.length; i++) {
    const ch = data[i];
    const code = data.charCodeAt(i);
    // ANSI 控制序列 \x1b[...letter：整段透传，不影响高亮状态
    if (ch === '\x1b') {
      let j = i + 1;
      if (data[j] === '[') {
        j++;
        while (j < data.length && !/[\x40-\x7e]/.test(data[j])) j++;
        if (j < data.length) j++;
      } else { j = i + 2; }
      out += data.slice(i, j);
      i = j - 1;
      continue;
    }
    // \n / \r：退出命令行，复位色
    if (ch === '\n' || ch === '\r') {
      if (conn.cmdHL) { out += '\x1b[0m'; conn.cmdHL = false; }
      out += ch;
      conn._hlAtLS = true;
      continue;
    }
    // 行首 # ：进入命令行（紫色提示符 + 绿色后续输入）
    if ((ch === '#' || ch === '$' || ch === '>') && conn._hlAtLS && !conn.cmdHL) {
      out += '\x1b[92m' + ch;
      conn.cmdHL = true;
      conn._hlAtLS = false;
      continue;
    }
    // 空格/制表：行首空白不取消行首状态（让  # 仍触发）；命令行内原样
    if (ch === ' ' || ch === '\t') { out += ch; continue; }
    // 其他控制符（\b \v \f 等）：透传，不改变行首状态
    if (code < 0x20) { out += ch; continue; }
    // 可见字符：命令行内原样（绿色作用中），非命令行原样；取消行首状态
    out += ch;
    conn._hlAtLS = false;
  }
  return out;
}
function enterScreen(portId, conn) {
  if (conn.inScreen) return;
  conn.inScreen = true;
  conn.screenOverlay.classList.add('show');
}
function exitScreen(portId, conn) {
  if (!conn.inScreen) return;
  conn.inScreen = false;
  conn.screenOverlay.classList.remove('show');
}

// 构建一行 DOM（仅回放面板仍用 DOM 行渲染，主终端已改用 xterm）
function buildLineDiv(item) {
  const div = document.createElement('div');
  div.className = 'line tag-' + (item.tag || 'text');
  if (item.seq != null) div.dataset.seq = item.seq;
  const ts = document.createElement('span');
  ts.className = 'ts';
  ts.textContent = item.ts ? fmtTs(item.ts) : '';
  div.appendChild(ts);
  div.appendChild(document.createTextNode(item.text || ''));
  return div;
}

// DOM 节点上限：方向性裁剪（v0.3.0 已废弃，xterm 自管缓冲；保留空壳避免引用报错）
function trimDom(conn) {}

function renderTermInput(conn) {}

function termSendRaw(portId, bytes) {
  // 微批合并：连续按键（打字/粘贴）攒 ≤8ms 一批一次 POST。
  // 之前每键一次 fetch：WebView2 网络栈 + Flask 线程开销叠加，打字时输入明显迟缓。
  // 8ms < 人感知阈值且不影响交互命令（回车后的命令行完整性由设备端解析）。
  let b = connections[portId];
  if (!b) {  // 未知连接（已关闭）：直接发，走原路径
    fetch('/api/send_raw', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({port_id: portId, bytes})});
    return;
  }
  b._sendQ = (b._sendQ || []).concat(bytes);
  if (b._sendTimer) return;
  b._sendTimer = setTimeout(() => {
    b._sendTimer = null;
    const q = b._sendQ; b._sendQ = [];
    if (!q.length || connections[portId] !== b) return;
    fetch('/api/send_raw', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({port_id: portId, bytes: q})});
  }, 8);
}

function connectSSE(portId, conn) {
  conn.sse = new EventSource('/api/stream?port_id=' + encodeURIComponent(portId));
  conn.sse.onmessage = (e) => {
    try {
      const item = JSON.parse(e.data);
      if (item.kind === 'raw') {
        appendRaw(portId, item.data);
        return;
      }
      if (item.kind === 'screenctl') {
        if (item.state === 'exit') exitScreen(portId, conn);
        else if (item.state === 'enter') enterScreen(portId, conn);
        return;
      }
    } catch(err) {}
  };
  conn.sse.onerror = () => {
    conn.sse.close();
    setTimeout(() => { if (connections[portId]) connectSSE(portId, conn); }, 2000);
  };
}

// ============================================================
// 关键字常驻高亮（xterm decoration）
// ============================================================
const KW_RULES = [
  { cls: 'kw-error', re: /\b(error|fail|failed|failure|panic|oops|fatal|denied|refused|abort|crash|segfault|oom|killed|segmentation fault|no such file or directory|permission denied|operation not permitted|unable to handle|kernel panic|out of memory|oom-kill|oom killer|call trace|stack trace|core dump|bus error|page fault|null pointer|general protection fault|illegal instruction|division by zero|hung task|soft lockup|hard lockup)\b/gi },
  { cls: 'kw-warning', re: /\b(warn|warning|deprecated|timeout|retry|overflow|underrun|stall|hung|blocked|deadlock|leak|leaked|corrupt|corrupted|incomplete|missing|not found|not supported|invalid|broken|exhausted|degraded|overrun|underflow|bad blocks|read-only|filesystem corruption)\b/gi },
  { cls: 'kw-info', re: /\b(info|notice|starting|started|stopped|detected|found|loaded|ready|init|initializing|mounting|mounted|deactivated|booting|probe|probed|register|registered|enabled|disabled|linux version|systemd|udev|freeing|freed|allocated|setting up|configured|bringing up|link is up|link is down)\b/gi },
  { cls: 'kw-success', re: /\b(success|succeed|succeeded|ok|done|complete|completed|passed|ready)\b/gi },
];
const KW_COLOR = {
  'kw-error':'#ff4060', 'kw-warning':'#ff9d00', 'kw-info':'#00d4ff', 'kw-success':'#00ff9d',
};
// 节流：批量扫描新行，避免每个 chunk 都扫全缓冲
function scheduleKwHighlight(conn) {
  if (conn._kwTimer) return;
  conn._kwTimer = setTimeout(() => {
    conn._kwTimer = null;
    highlightNewKw(conn);
  }, 250);
}
function highlightNewKw(conn) {
  if (!conn.term || !conn.term.registerDecoration) return;
  const buf = conn.term.buffer.active;
  const totalRows = buf.length;
  // 增量扫描窗口：只扫自上次以来的新行 + 回溯 1 行防跨行漏扫。
  // 单次写入超大（如 loadBuffer 500 行）时窗口同样生效——首次从 0 开始全量属正常。
  const fromRow = Math.max(0, (conn.kwDecorLastRow || 0) - 1);
  for (let r = fromRow; r < totalRows; r++) {
    const line = buf.getLine(r);
    if (!line) continue;
    const text = line.translateToString(true);
    if (!text.trim()) continue;
    // 命令行高亮（# 后命令名）已放弃：ANSI 注入法会在逐字符 echo 流上重复输出（# ls# ls），
    // decoration foregroundColor 在 WebGL renderer 下不渲染。此处只做关键词（error/warning）高亮。
    const rules = KW_RULES;
    for (const rule of rules) {
      rule.re.lastIndex = 0;
      let m;
      while ((m = rule.re.exec(text)) !== null) {
        // kw-cmd 用捕获组 2 定位命令名本身，其余用整个匹配
        const grp = rule.grp || 0;
        const start = m.index + (m[grp] ? text.slice(m.index).indexOf(m[grp]) : 0);
        const matched = m[grp] || m[0];
        const end = start + matched.length;
        try {
          // registerMarker(e) 内部: ybase + y + e = 目标行 → e = r - ybase - y（相对偏移，非绝对行号）
          const offset = Math.round(r - buf.ybase - buf.y);
          const dec = conn.term.registerDecoration({
            marker: conn.term.registerMarker(offset),
            x: start,
            width: end - start,
            foregroundColor: KW_COLOR[rule.cls],
            layer: 'top',
          });
          if (dec) conn.kwDecorations.push(dec);
        } catch(e) {}
        if (m.index === rule.re.lastIndex) rule.re.lastIndex++;
      }
    }
  }
  conn.kwDecorLastRow = totalRows;
  // decoration 数量硬上限：每个 decoration 是一个 DOM overlay，超量是渲染卡顿重灾区。
  // 3000 折中：错误密集日志（几百行全是 error/warning）不丢高亮，又不至于拖垮渲染。
  // 超限丢最旧的（滚动出视野的早已无用）
  if (conn.kwDecorations.length > 3000) {
    const drop = conn.kwDecorations.splice(0, conn.kwDecorations.length - 3000);
    drop.forEach(d => { try { d.dispose(); } catch(e){} });
  }
}

// ============================================================
// 历史分页（xterm 滚动到底即实时流；向上翻历史用后端分页 API）
// ============================================================
async function loadBuffer(portId, conn) {
  if (conn.loadingHistory) return;
  conn.loadingHistory = true;
  try {
    const r = await fetch('/api/buffer?port_id=' + encodeURIComponent(portId) + '&n=500');
    const j = await r.json();
    // await 期间连接可能已关闭，term 已 dispose，校验后再写
    if (connections[portId] !== conn || !conn.term) return;
    const lines = j.lines || [];
    if (lines.length) {
      // 历史行是"逻辑行"（后端已按 \n 切分、\r 覆盖处理过），用 \r\n 写入 xterm
      const text = lines.map(l => l.text || '').join('\r\n');
      if (text) conn.term.write(text + '\r\n');
      conn.oldestSeq = lines[0].seq;
      conn.hasMore = j.has_more !== false;
    } else {
      conn.hasMore = false;
    }
    conn.kwDecorLastRow = 0;
    scheduleKwHighlight(conn);
    if (conn.autoScroll) conn.term.scrollToBottom();
    // flush 历史加载期间缓冲的实时数据
    if (conn.pendingRaw) {
      const pend = conn.pendingRaw; conn.pendingRaw = '';
      conn.term.write(pend);
      scheduleKwHighlight(conn);
      if (conn.autoScroll) conn.term.scrollToBottom();
    }
  } catch(e) {} finally {
    conn.loadingHistory = false;
  }
}

// 向上加载更早历史：xterm 不支持顶部插入，用 reset 重写（旧行+当前行）
async function loadOlder(portId, conn) {
  if (conn.loadingMore || !conn.hasMore || conn.oldestSeq == null || conn.loadingHistory) return;
  conn.loadingMore = true;
  try {
    const r = await fetch('/api/buffer?port_id=' + encodeURIComponent(portId) + '&n=500&before_seq=' + conn.oldestSeq);
    const j = await r.json();
    const lines = j.lines || [];
    if (lines.length) {
      const older = lines.map(l => l.text || '').join('\r\n');
      const curBuf = conn.term.buffer.active;
      const curLines = [];
      for (let r = 0; r < curBuf.length; r++) {
        const ln = curBuf.getLine(r);
        if (ln) curLines.push(ln.translateToString(true));
      }
      // 记住重写前用户视口顶行对应的行号，重写后恢复到同一逻辑行
      const vp = conn.xtermWrap.querySelector('.xterm-viewport');
      let topRowBefore = 0;
      try {
        const cellH = conn.term._core._renderService.dimensions.css.cell.height || 17;
        topRowBefore = conn.term.buffer.active.baseY + Math.round(vp.scrollTop / cellH);
      } catch(e) {}
      const allText = older + '\r\n' + curLines.join('\r\n');
      conn.term.reset();
      conn.term.write(allText);
      conn.kwDecorLastRow = 0;
      conn.kwDecorations.forEach(d => { try { d.dispose(); } catch(e){} });
      conn.kwDecorations = [];
      conn.oldestSeq = lines[0].seq;
      conn.hasMore = j.has_more !== false;
      scheduleKwHighlight(conn);
      // 恢复滚动位置：旧行插入后，原视口顶行下移了 lines.length 行
      try { conn.term.scrollToLine(topRowBefore + lines.length); } catch(e) {}
    } else {
      conn.hasMore = false;
    }
  } catch(e) {} finally {
    conn.loadingMore = false;
  }
}

function closeConnection(portId) {
  fetch('/api/disconnect', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({port_id: portId})});
  const conn = connections[portId];
  if (conn) {
    if (conn.sse) conn.sse.close();
    if (conn._webgl) { try { conn._webgl.dispose(); } catch(e){} }  // 释放 GPU 资源
    if (conn.term) { try { conn.term.dispose(); } catch(e){} }
    // 微批发送的 pending 定时器清理（防关闭后误发）
    if (conn._sendTimer) { clearTimeout(conn._sendTimer); conn._sendTimer = null; }
    // 移除串口搜索分栏的 document 级监听器，避免泄漏
    if (conn.termSplitMove) document.removeEventListener('mousemove', conn.termSplitMove);
    if (conn.termSplitUp) document.removeEventListener('mouseup', conn.termSplitUp);
    conn.tab.remove();
    conn.wrap.remove();
    delete connections[portId];
  }
  // 切换到第一个可用标签（复用全局 sortKeyFn）
  const remaining = Object.keys(connections).sort((a, b) => {
    const ka = sortKeyFn(a), kb = sortKeyFn(b);
    return ka[0] !== kb[0] ? ka[0] - kb[0] : (ka[1] < kb[1] ? -1 : ka[1] > kb[1] ? 1 : 0);
  });
  if (remaining.length) {
    switchTab(remaining[0]);
  } else {
    activePortId = null;
    termArea.innerHTML = '<div class="empty-state"><div class="big-icon">📡</div><div class="title">暂无连接</div><div class="desc">点击顶部「新建连接」选择串口或 SSH，支持同时监控多个连接。每个连接独立标签页，互不干扰。</div></div>';
  }
  refreshSidebar();
  refreshGlobalStatus();
}

function refreshSidebar() {
  const ids = Object.keys(connections);
  $('portCount').textContent = ids.length;
  if (!ids.length) {
    if (_sidebarKey !== 'empty') {
      _sidebarKey = 'empty';
      portList.innerHTML = '<div class="empty-state" style="padding:30px 10px;"><div class="desc">点击「新建连接」添加连接</div></div>';
    }
    return;
  }
  // 排序：串口[0] < SSH[1] < 日志[2]（sortKeyFn 全局定义，closeConnection/closeLogViewer 复用）
  ids.sort((a, b) => {
    const ka = sortKeyFn(a), kb = sortKeyFn(b);
    return ka[0] !== kb[0] ? ka[0] - kb[0] : (ka[1] < kb[1] ? -1 : ka[1] > kb[1] ? 1 : 0);
  });
  // 脏检查：连接集合 + active tab 变化才重建整个列表 DOM；
  // 行数（每次刷新必变）只更新对应 span 文本，避免 5s 一次全量 innerHTML 重建叠加重排
  const key = ids.join('|') + '#' + activePortId;
  if (key !== _sidebarKey) {
    _sidebarKey = key;
    portList.innerHTML = '';
    ids.forEach(pid => {
      const conn = connections[pid];
      const item = document.createElement('div');
      item.className = 'port-item connected' + (pid === activePortId ? ' active' : '');
      item.dataset.portId = pid;
      const isSSH = conn.meta.kind === 'ssh';
      const isLog = conn.meta.kind === 'log';
      const descText = isSSH ? `SSH · ${conn.meta.host || ''}` : isLog ? `📜 日志` : `${conn.meta.baud || ''} baud`;
      const rowCount = conn.term ? conn.term.buffer.active.length : (conn.logState ? conn.logState.total : 0);
      item.innerHTML = `
        <span class="led"></span>
        <div class="info">
          <div class="name">${esc(conn.meta.label || pid)}</div>
          <div class="desc">${esc(descText)} · <span class="baud" data-rows>${rowCount} 行</span></div>
        </div>
        <div class="actions"><button data-close="${pid}" title="${isLog ? '关闭' : '断开'}">✕</button></div>
      `;
      item.onclick = (e) => {
        if (e.target.dataset.close) { e.stopPropagation(); (isLog ? closeLogViewer(pid) : closeConnection(pid)); return; }
        switchTab(pid);
      };
      portList.appendChild(item);
    });
  } else {
    // 只更新行数（轻量：改 textContent，不重建 DOM）
    ids.forEach(pid => {
      const el = portList.querySelector(`.port-item[data-port-id="${CSS.escape(pid)}"] [data-rows]`);
      if (!el) return;
      const conn = connections[pid];
      const n = conn.term ? conn.term.buffer.active.length : (conn.logState ? conn.logState.total : 0);
      const t = n + ' 行';
      if (el.textContent !== t) el.textContent = t;
    });
  }
  // 标签栏同序重排（复用全局 sortKeyFn）——当前顺序已一致时跳过，不动 DOM
  const tabEls = Array.from(tabs.querySelectorAll('.tab'));
  const curIds = tabEls.map(t => t.dataset.portId);
  const wantIds = ids.concat(curIds.filter(id => !connections[id]));
  const needSort = curIds.length !== wantIds.length || curIds.some((id, i) => id !== wantIds[i]);
  if (needSort) {
    tabEls.sort((a, b) => {
      const ka = sortKeyFn(a.dataset.portId), kb = sortKeyFn(b.dataset.portId);
      return ka[0] !== kb[0] ? ka[0] - kb[0] : (ka[1] < kb[1] ? -1 : kb[1] > kb[1] ? 1 : 0);
    });
    const actions = tabs.querySelector('.tab-bar-actions');
    tabEls.forEach(t => tabs.insertBefore(t, actions));
  }
}

document.addEventListener('keydown', (e) => {
  // Ctrl+F：日志 tab → 激活底部查找分栏并聚焦输入框
  if (e.ctrlKey && (e.key === 'f' || e.key === 'F') && activePortId) {
    const conn = connections[activePortId];
    if (conn && conn.meta && conn.meta.kind === 'log') {
      e.preventDefault();
      toggleLogSearchPane(conn, true);
      if (conn.searchInput.value) conn.searchInput.select();
      return;
    }
  }
  if (!activePortId) return;
  const conn = connections[activePortId];
  if (!conn) return;
  const pid = activePortId;
  // 只在 xterm 未获焦点时拦截这些全局快捷键，避免与 xterm 输入冲突
  if (e.ctrlKey && e.key === 'End') { e.preventDefault(); jumpToBottom(pid); return; }
});

// 回放
// ============================================================
let replayData = null, replayTimer = null, replayIdx = 0, replayStartTs = 0, replayBaseReal = 0;
async function openReplay(name) {
  const panel = $('replayPanel');
  $('replayTitle').textContent = '回放：' + name;
  const r = await fetch('/api/replay/' + encodeURIComponent(name));
  const j = await r.json();
  replayData = j.lines || [];
  replayIdx = 0;
  $('replayBody').innerHTML = '';
  if (!replayData.length) { $('replayInfo').textContent = '空'; panel.classList.add('show'); return; }
  const first = replayData[0].ts, last = replayData[replayData.length-1].ts;
  const dur = (last - first)/1000;
  $('replayTotal').textContent = fmtDur(dur);
  $('replayInfo').textContent = `${replayData.length} 行 · 时长 ${fmtDur(dur)}`;
  $('replaySeek').max = Math.max(1, Math.floor(dur));
  panel.classList.add('show');
  playReplay();
}
function fmtDur(s){ const m=Math.floor(s/60), ss=Math.floor(s%60); return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0'); }
function renderReplayLine(item) {
  const body = $('replayBody');
  const div = document.createElement('div');
  div.className = 'line tag-' + (item.tag||'text');
  const ts = document.createElement('span'); ts.className='ts'; ts.textContent = item.ts?fmtTs(item.ts):'';
  div.appendChild(ts);
  div.appendChild(document.createTextNode(item.text));
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
}
function playReplay() {
  if (!replayData || replayTimer) return;
  const speed = parseFloat($('replaySpeed').value)||1;
  replayStartTs = replayData[replayIdx]?.ts || 0;
  replayBaseReal = Date.now();
  const tick = () => {
    if (replayIdx >= replayData.length) { stopReplay(); return; }
    const now = Date.now();
    const elapsed = (now - replayBaseReal) * speed;
    const cur = replayStartTs + elapsed;
    while (replayIdx < replayData.length && replayData[replayIdx].ts <= cur) {
      renderReplayLine(replayData[replayIdx]); replayIdx++;
    }
    $('replaySeek').value = Math.floor((cur - replayData[0].ts)/1000);
    $('replayTime').textContent = fmtDur((cur - replayData[0].ts)/1000);
    replayTimer = requestAnimationFrame(tick);
  };
  replayTimer = requestAnimationFrame(tick);
}
function stopReplay() { if (replayTimer) { cancelAnimationFrame(replayTimer); replayTimer = null; } }
$('btnReplayPlay').onclick = playReplay;
$('btnReplayPause').onclick = stopReplay;
$('btnReplayClose').onclick = () => { stopReplay(); $('replayPanel').classList.remove('show'); };
$('replaySpeed').onchange = () => { stopReplay(); playReplay(); };
$('replaySeek').oninput = function() {
  stopReplay();
  const v = parseInt(this.value);
  if (!replayData.length) return;
  const target = replayData[0].ts + v*1000;
  replayIdx = 0;
  $('replayBody').innerHTML = '';
  while (replayIdx < replayData.length && replayData[replayIdx].ts < target) {
    renderReplayLine(replayData[replayIdx]); replayIdx++;
  }
  $('replayTime').textContent = fmtDur(v);
};

// ---- 搜索（v0.3.0：用 xterm SearchAddon + decoration 高亮） ----
let searchState = { q: '', idx: -1, total: 0 };
const SEARCH_DECOR = {
  matchBackground: 'rgba(255,214,102,0.35)',
  matchOverviewRuler: '#ff9d00',
  activeMatchBackground: 'rgba(0,212,255,0.45)',
  activeMatchColor: '#ffffff',
};
function clearSearchHighlights() {
  // 清掉搜索 decoration（带 class 的）
  if (activePortId && connections[activePortId] && connections[activePortId].search) {
    try { connections[activePortId].search.clearDecorations(); } catch(e){}
  }
  searchState.idx = -1;
  searchState.total = 0;
  $('searchCount').textContent = '';
}
function applySearchHighlights(q) {
  clearSearchHighlights();
  if (!q || !activePortId) return;
  const conn = connections[activePortId];
  if (!conn || !conn.term || !conn.search) return;
  // 统计总数：遍历 buffer 行匹配（与 search addon 的大小写设置一致）
  let total = 0;
  const buf = conn.term.buffer.active;
  const low = q.toLowerCase();
  for (let r = 0; r < buf.length; r++) {
    const ln = buf.getLine(r);
    if (!ln) continue;
    const t = ln.translateToString(true).toLowerCase();
    let pos = 0;
    while ((pos = t.indexOf(low, pos)) !== -1) { total++; pos += low.length; }
  }
  searchState.total = total;
  searchState.idx = total ? 1 : -1;
  $('searchCount').textContent = total ? (total + ' 处') : '无';
  if (!total) return;
  // findNext 会用 SEARCH_DECOR 高亮所有匹配，并定位到第一个
  conn.search.findNext(q, {
    caseSensitive: false, wholeWord: false, incremental: false,
    decorations: SEARCH_DECOR,
  });
}
function gotoSearchMark(idx) {
  if (!activePortId) return;
  const conn = connections[activePortId];
  if (!conn || !conn.search) return;
  const q = searchState.q;
  if (!q) return;
  const opts = { caseSensitive: false, wholeWord: false, incremental: false, decorations: SEARCH_DECOR };
  if (idx < 0) {
    conn.search.findPrevious(q, opts);
    if (searchState.idx > 1) searchState.idx--;
    else searchState.idx = searchState.total;
  } else {
    conn.search.findNext(q, opts);
    if (searchState.idx < searchState.total) searchState.idx++;
    else searchState.idx = 1;
  }
  $('searchCount').textContent = searchState.total ? (searchState.idx + '/' + searchState.total) : '无';
}
$('searchInput').addEventListener('input', (e) => {
  const q = e.target.value.trim();
  searchState.q = q;
  if (q) applySearchHighlights(q); else clearSearchHighlights();
});
$('searchInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    if (e.shiftKey) gotoSearchMark(-1);
    else gotoSearchMark(1);
  }
});
$('searchPrev').onclick = () => gotoSearchMark(-1);
$('searchNext').onclick = () => gotoSearchMark(1);

// 原生读剪贴板粘贴到连接（Ctrl+V 与菜单「粘贴到终端」共用）。
// 走 pywebview js_api 的 Win32 读剪贴板，绕开 navigator.clipboard.readText
// 首次触发的 WebView2「允许粘贴吗」权限弹窗。
function _pasteToConn(conn, notify) {
  const doPaste = (text) => {
    if (!text) { if (notify) showBanner('剪贴板为空'); return; }
    if (connections[conn.portId] !== conn) return;
    // 多行粘贴警告（Tabby 同款防误操作）：>1 行或超 500 字符需确认，
    // 防止误把配置文件/脚本整段灌进设备破坏现场
    const lines = text.split(/\r?\n/);
    if (lines.length > 1 || text.length > 500) {
      const preview = text.length > 60 ? text.slice(0, 60) + '…' : text;
      const desc = lines.length > 1
        ? `即将粘贴 ${lines.length} 行 / ${text.length} 字符（首行: ${preview.replace(/\n/g, ' ⏎ ')}）`
        : `即将粘贴 ${text.length} 字符（${preview}）`;
      if (!confirm(desc + '\n\n确定粘贴到终端？')) {
        if (notify) showBanner('已取消粘贴');
        return;
      }
    }
    const bytes = Array.from(new TextEncoder().encode(text));
    termSendRaw(conn.portId, bytes);
    if (notify) showBanner('已粘贴 ' + text.length + ' 字符');
  };
  if (window.pywebview && pywebview.api && pywebview.api.read_clipboard) {
    pywebview.api.read_clipboard().then(doPaste).catch(() => {
      if (notify) showBanner('读取剪贴板失败');
    });
  } else {
    // pywebview bridge 未就绪（页面加载早期）时兜底走 Web API
    navigator.clipboard.readText().then(doPaste).catch(() => {});
  }
}

async function doTermSearch(conn) {
  const q = conn.termSearchInput.value.trim();
  const st = conn.termSearchState;
  if (!q || !conn.term) return;
  conn.termSearchCount.textContent = '搜索中…';
  // 直接在 xterm buffer 内搜索（用户看到的内容），不调后端 /api/search。
  // 后端 buf 的 \r 处理与 xterm 不同（buf 拆行，xterm 同行覆盖），用后端结果
  // 跳转 xterm 会导致行号错位（"串行"问题）。xterm buffer 是最准确的搜索源。
  const buf = conn.term.buffer.active;
  const low = q.toLowerCase();
  const hits = [];
  for (let r = 0; r < buf.length; r++) {
    const ln = buf.getLine(r);
    if (!ln) continue;
    const t = ln.translateToString(true);
    if (t.toLowerCase().indexOf(low) !== -1) {
      hits.push({ row: r, text: t });
    }
  }
  st.q = q; st.results = hits; st.idx = 0;
  // 渲染命中行列表
  conn.termSearchResults.innerHTML = hits.map((l, idx) => {
    const text = esc((l.text || '').replace(/\r/g, ''));
    return `<div class="hline" data-idx="${idx}" title="${text}"><span class="hrow">${l.row}</span> ${text}</div>`;
  }).join('') || '<div style="padding:10px;color:var(--muted);">无命中</div>';
  conn.termSearchResults.querySelectorAll('.hline').forEach(el => {
    el.onclick = () => {
      const idx = +el.dataset.idx;
      st.idx = idx;
      jumpToTermHit(conn, idx);
      highlightTermHit(conn, idx);
    };
  });
  conn.termSearchCount.textContent = hits.length ? `命中 ${hits.length} 处` : '无命中';
  if (hits.length) { jumpToTermHit(conn, 0); highlightTermHit(conn, 0); }
}
// 跳到第 idx 个命中：st.results[idx].row 是搜索时记录的 xterm 行号，直接定位。
// 搜索在 xterm buffer 内完成，行号与显示一致，无错位。
function jumpToTermHit(conn, idx) {
  if (!conn.term || !conn.termSearchState) return;
  const st = conn.termSearchState;
  if (!st.results.length || idx < 0 || idx >= st.results.length) return;
  const found = st.results[idx].row;
  const buf = conn.term.buffer.active;
  // 行号可能因 reflow/新数据流入而漂移，校验仍在范围内
  if (found < 0 || found >= buf.length) return;
  try {
    // scrollToLine 把目标行滚到视图顶部；select 选中整行高亮（蓝底，xterm 内置最稳定）
    conn.term.scrollToLine(found);
    conn.term.select(0, found, conn.term.cols);
    conn.term.focus();
    // registerDecoration 加醒目背景高亮当前命中行（6 位 hex，不带 alpha）
    if (conn.term.registerDecoration) {
      const offset = Math.round(found - buf.ybase - buf.y);
      const dec = conn.term.registerDecoration({
        marker: conn.term.registerMarker(offset),
        x: 0,
        width: conn.term.cols,
        backgroundColor: '#00d4ff',
        layer: 'top',
      });
      // 3 秒后淡出，避免堆积
      if (dec) setTimeout(() => { try { dec.dispose(); } catch(_){} }, 3000);
    }
  } catch(e){}
}
function highlightTermHit(conn, idx) {
  conn.termSearchResults.querySelectorAll('.hline').forEach((el, i) => el.classList.toggle('active', i === idx));
}
// 拖分隔条调分栏高度（仿 initLogSplitter）

  };
  document.addEventListener('mousemove', conn.termSplitMove);
  document.addEventListener('mouseup', conn.termSplitUp);
}

async function refreshMcpInfo() {
  try {
