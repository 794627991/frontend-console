# 架构治理声明（v3.0，对照 ZCode architecture-policy.yaml 的 Python 移植）
#
# 语义：
#   modules[].managed: true  的模块全规则生效（依赖白名单/唯一公开入口/行数/循环）
#   managed: false 的模块只登记不治理（存量 legacy，渐进迁移——先免检，
#             新写的模块即受约束）
# 校验：py tools/architecture_check.py（全量）/--changed（只查 git 改动波及）
#   新增违规退出码 1（存量违规走 .architecture-baseline.json 指纹豁免，
#   只有「新增」会红——避免一次性大清洗阻塞开发）
version: 1

modules:
  - id: eventlog
    roots: [src/eventlog]
    managed: true
    requires: []                    # 不得依赖工程内其他模块（契约层零耦合）
    publicEntrypoints: [src/eventlog/__init__.py]
    layers: {}                      # 单层包：types/store/bus/truncate/reducer/log 平铺
    owner: harness

  - id: harness
    roots: [src/harness]
    managed: false                  # v3.0 拆分产物，存量债务先登记；后续收 managed
    requires: [eventlog]
    publicEntrypoints: []
    owner: harness

global:
  maxFileLines: 1200                # Python 侧（ZCode 400 行按 TS 组件粒度定，这里按本项目现状放宽）
  forbidCycles: true
  forbidDeepImports: true           # 跨模块只准走 publicEntrypoints
  managedOnly: true                 # 只检查 managed: true

exceptions: []                      # {rule, paths, expires}——到期自动报违规
