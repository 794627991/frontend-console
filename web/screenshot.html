<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fc-snip</title>
<style>
  /* 截图窗专用页（独立全屏窗=物理屏幕尺寸）：height:100% 必须——插件按
  body 实测高度建 canvas，无内容时高 0 → 整个界面不可见（历史实锤）。 */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%;
               overflow: hidden; background: #000; }
</style>
<script>window.__FC_SNIP__ = true;   // 页面真伪标记：Python 侧 loaded 后验证，
// ERR_CONNECTION_REFUSED 等错误页也会触发 loaded 事件——没这标记的错误页
// 不 show 不写心跳，静默重试（用户实锤：错误页全屏弹出）。
</script>
<script src="/vendor/screenShotPlugin.umd.js"></script>
</head>
<body>
<script>
// ============================================================
// 独立全屏截图窗（v2.3.12 最终形态）：窗=DPI 子进程按虚拟桌面几何定位=
// 屏幕尺寸 → 插件 canvas=视口=底图 1:1 原生分辨率（无缩放无适配计算）。
// showScreenData 必开（底图绘制开关，默认关=黑屏）；writeBase64=false
// （剪贴板统一主进程 CF_DIB）。Enter 确认/Esc 取消 → js_api → 子进程
// 写产物退出 → 主进程收图挂附件。
// ============================================================
(function () {
  'use strict';
  function boot() {
    var img = '/api/snip/img?v=' + Date.now();
    // 收尾防黑闪：插件 √/×/保存 都会 destroyDom 销毁界面，露出 body 背景
    // （原 #000=黑屏闪烁/保存键黑屏挂死双实锤）。背景换成底图原图：
    // 销毁瞬间只丢遮罩变亮，不再黑，配合 Python 侧即刻 hide 基本无感。
    document.body.style.background = '#000 url(' + img + ') center/100% 100% no-repeat';
    new screenShotPlugin({
      capture: { source: 'image', imageSrc: img },
      writeBase64: false,
      showScreenData: true,
      clickCutFullScreen: true,
      maxUndoNum: 30,
      // 「保存」按钮=另存为 PNG 文件（区别于 √=附加到对话，用户定调）。
      // dataUrl 在第 3 参；插件回调后即 destroyDom，对话框由 Python 侧弹。
      saveCallback: function (idx, msg, dataUrl) {
        try { window.pywebview && pywebview.api.snip_save_as(dataUrl); }
        catch (e) { window.close(); }
      },
      completeCallback: function (info) {
        try { window.pywebview && pywebview.api.snip_done(info.base64); }
        catch (e) { window.close(); }
      },
      closeCallback: function () {
        try { window.pywebview && pywebview.api.snip_cancel(); }
        catch (e) { window.close(); }
      },
      cancelCallback: function () {
        try { window.pywebview && pywebview.api.snip_cancel(); }
        catch (e) { window.close(); }
      }
    });
  }
  // boot 闸门：等视口=物理屏幕宽高（子进程 loaded 后才把 WinForms
  // ClientSize 钉到物理矩形，此前窗口是创建期被钳小的尺寸）。插件 canvas
  // 按当时视口建且不重建，早 boot=canvas 偏小→底图缩放+框选错位。比较用
  // 物理口径：DPI>100% 时 CSS 视口=物理/dpr，乘回去再比（多分辨率适配）。
  // 3s 超时兜底强启（钉尺寸万一失败，缩小跑总比黑屏好）。
  var qs = new URLSearchParams(location.search);
  var W = +qs.get('w') || 0, H = +qs.get('h') || 0;
  var t0 = Date.now();
  function physW() { return Math.round(window.innerWidth * (window.devicePixelRatio || 1)); }
  function physH() { return Math.round(window.innerHeight * (window.devicePixelRatio || 1)); }
  function gate() {
    if ((W && physW() === W && physH() === H)
        || Date.now() - t0 > 3000) {
      if (document.readyState === 'complete') boot();
      else window.addEventListener('load', boot);
      return;
    }
    setTimeout(gate, 50);
  }
  gate();
})();
</script>
</body>
</html>
