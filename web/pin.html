<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>fc-pin</title>
<style>
  /* v3.5.150 贴图窗页（Snipaste F3 同款）：img 填满窗（窗纵横比=图纵横比，
     无变形）。左键拖动/滚轮缩放/双击关闭全桥 js_api（Python 侧物理像素
     SetWindowPos）。右键菜单：缩放预设/透明度/适应屏幕/关闭。 */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%;
               overflow: hidden; background: transparent; cursor: move;
               user-select: none; }
  img { width: 100%; height: 100%; display: block; -webkit-user-drag: none; }
  #menu { position: fixed; display: none; z-index: 9; min-width: 132px;
          background: rgba(30, 30, 34, .97); border: 1px solid #4a4a52;
          border-radius: 6px; padding: 4px 0; font: 12px/1.9 system-ui;
          color: #ddd; box-shadow: 0 4px 16px rgba(0,0,0,.4); }
  #menu div { padding: 2px 16px; cursor: pointer; white-space: nowrap; }
  #menu div:hover { background: #4a9eff; color: #fff; }
  #menu .sep { height: 1px; background: #4a4a52; margin: 3px 0;
               padding: 0; cursor: default; }
  #menu .sep:hover { background: #4a4a52; }
</style>
</head>
<body>
<img id="pic" alt="">
<div id="menu"></div>
<script>
window.__FC_PIN__ = true;   // 页面真伪标记（Python 侧 loaded 验证，错误页不 show）
(function () {
  'use strict';
  var qs = new URLSearchParams(location.search);
  var img = document.getElementById('pic');
  var menu = document.getElementById('menu');
  img.src = '/api/snip/pinimg?id=' + encodeURIComponent(qs.get('id') || '') +
            '&v=' + Date.now();

  function api(fn, a, b) {
    try { var p = window.pywebview && pywebview.api; if (p) p[fn](a, b); }
    catch (e) {}
  }
  function hideMenu() { menu.style.display = 'none'; }

  // 左键拖动：mousemove 逐事件上报位移（Python 侧乘 DPI 回物理），不拦右键
  var drag = null;
  document.addEventListener('mousedown', function (e) {
    hideMenu();
    if (e.button !== 0) return;
    drag = { x: e.screenX, y: e.screenY };
    e.preventDefault();
  });
  document.addEventListener('mousemove', function (e) {
    if (!drag) return;
    var dx = e.screenX - drag.x, dy = e.screenY - drag.y;
    if (!dx && !dy) return;
    drag.x = e.screenX; drag.y = e.screenY;
    api('drag_by', dx, dy);
  });
  document.addEventListener('mouseup', function () { drag = null; });

  // 双击/Esc 关闭（右键菜单里也有）
  document.addEventListener('dblclick', function () { api('close'); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') api('close');
  });

  // 滚轮缩放：鼠标点锚定（Python GetCursorPos），放大/缩小一步 15%
  document.addEventListener('wheel', function (e) {
    e.preventDefault();
    api('zoom', e.deltaY < 0 ? 1 : -1);
  }, { passive: false });

  // 右键菜单
  function mi(label, fn) {
    var d = document.createElement('div');
    d.textContent = label;
    d.onclick = function () { hideMenu(); fn && fn(); };
    menu.appendChild(d);
  }
  function sep() {
    var d = document.createElement('div');
    d.className = 'sep';
    menu.appendChild(d);
  }
  document.addEventListener('contextmenu', function (e) {
    e.preventDefault();
    menu.innerHTML = '';
    mi('⬚ 100%（原始）', function () { api('scale_pct', 100); });
    mi('⊕ 200%', function () { api('scale_pct', 200); });
    mi('⊖ 50%', function () { api('scale_pct', 50); });
    mi('⤢ 适应屏幕', function () { api('fit_screen'); });
    sep();
    mi('不透明度 100%', function () { api('opacity', 100); });
    mi('不透明度 75%', function () { api('opacity', 75); });
    mi('不透明度 50%', function () { api('opacity', 50); });
    mi('不透明度 25%', function () { api('opacity', 25); });
    sep();
    mi('✕ 关闭（双击 / Esc 同）', function () { api('close'); });
    menu.style.display = 'block';
    menu.style.left = Math.min(e.clientX, innerWidth - menu.offsetWidth - 4) + 'px';
    menu.style.top = Math.min(e.clientY, innerHeight - menu.offsetHeight - 4) + 'px';
  });
  document.addEventListener('click', hideMenu);
})();
</script>
</body>
</html>
